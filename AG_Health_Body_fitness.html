s, flaxseed, and adequate water; avoid unproven shrinkage claims.","Exercise if needed":"Low-impact exercise such as walking, swimming, and light strength work.","When to seek medical care":"Very heavy bleeding, severe pain, or pressure symptoms need gynecological assessment."}},{"title":"Ovarian Cysts","f":{"Meaning":"Fluid-filled sacs that develop on or inside an ovary.","Causes and risk factors":"Hormonal changes, ovulation, PCOS, endometriosis.","Symptoms to detect":"Pelvic pain, bloating, irregular periods, pain during sex; many cause no symptoms.","Prevention and precautions":"Regular checkups; track cycles; manage hormonal conditions.","Natural support and how to use":"Balanced anti-inflammatory diet; warm compress for mild discomfort; avoid self-treating large cysts.","Exercise if needed":"Gentle walking and stretching; avoid intense core work during pain.","When to seek medical care":"Sudden severe one-sided pain, vomiting, fainting, or fever is an emergency."}},{"title":"Vaginal Yeast Infection","f":{"Meaning":"Overgrowth of yeast causing itching and discharge.","Causes and risk factors":"Antibiotics, diabetes, pregnancy, tight wet clothing, immune changes.","Symptoms to detect":"Thick white discharge, itching, burning, redness, soreness.","Prevention and precautions":"Dry the area well; avoid scented products; change out of wet clothes quickly.","Natural support and how to use":"Plain unsweetened yogurt or probiotic foods; coconut oil may soothe external irritation; warm water wash only.","Exercise if needed":"Gentle walking; avoid cycling or friction-heavy exercise during irritation.","When to seek medical care":"Fever, pelvic pain, sores, or recurrent infections need medical assessment."}},{"title":"Bacterial Vaginosis","f":{"Meaning":"Imbalance of vaginal bacteria causing unusual discharge and odor.","Causes and risk factors":"Douching, new partners, pH changes, antibiotics.","Symptoms to detect":"Thin gray/white discharge, fishy odor, mild itching.","Prevention and precautions":"Avoid douching and scented washes; practice gentle hygiene; safe sex.","Natural support and how to use":"Probiotic-rich yogurt, kefir, and fermented foods; warm water cleansing only.","Exercise if needed":"General gentle activity is fine.","When to seek medical care":"Persistent odor, pelvic pain, fever, or pregnancy requires medical care."}},{"title":"Urinary Tract Infection","f":{"Meaning":"Bacteria infect the bladder or urinary tract.","Causes and risk factors":"Sexual activity, holding urine, dehydration, wiping direction, menopause.","Symptoms to detect":"Burning urination, urgency, cloudy urine, pelvic pressure, blood in urine.","Prevention and precautions":"Urinate after sex; drink water; wipe front to back; avoid harsh feminine products.","Natural support and how to use":"Water, cranberry juice without added sugar, barley water, probiotics.","Exercise if needed":"Gentle walking; avoid tight clothing during flare-ups.","When to seek medical care":"Fever, back pain, vomiting, or blood in urine needs urgent care."}},{"title":"Painful Intercourse","f":{"Meaning":"Pain during or after sexual activity.","Causes and risk factors":"Dryness, infections, endometriosis, pelvic-floor tension, menopause, stress.","Symptoms to detect":"Burning, deep pain, tightness, bleeding after sex.","Prevention and precautions":"Use lubrication; communicate with partner; treat infections; manage stress.","Natural support and how to use":"Water-based lubricant; vitamin-E-rich foods; pelvic relaxation breathing; avoid harsh soaps.","Exercise if needed":"Pelvic-floor relaxation stretches and deep breathing.","When to seek medical care":"Bleeding, severe pain, or persistent symptoms need gynecological evaluation."}},{"title":"Vaginal Dryness","f":{"Meaning":"Reduced natural lubrication causing discomfort.","Causes and risk factors":"Menopause, breastfeeding, stress, medicines, hormonal changes.","Symptoms to detect":"Dryness, itching, burning, painful sex, frequent UTIs.","Prevention and precautions":"Use lubricant during sex; avoid scented products; stay hydrated.","Natural support and how to use":"Water-based lubricant; vitamin E-rich foods; soy foods may help some women; gentle moisturizers.","Exercise if needed":"Walking, yoga, and pelvic-floor relaxation.","When to seek medical care":"Bleeding, sores, or persistent burning needs clinical assessment."}},{"title":"Menopause","f":{"Meaning":"The natural end of menstrual periods, usually after age 45–55.","Causes and risk factors":"Declining estrogen and progesterone with age.","Symptoms to detect":"Hot flashes, night sweats, mood changes, sleep problems, vaginal dryness.","Prevention and precautions":"Strength training, calcium and vitamin D, sleep routine, stress management.","Natural support and how to use":"Soy foods, flaxseed, black cohosh only with professional advice, cooling foods, adequate water.","Exercise if needed":"Weight-bearing exercise, resistance training, yoga, and walking to protect bones and mood.","When to seek medical care":"Very heavy bleeding after menopause or bleeding 12 months after the last period needs urgent evaluation."}},{"title":"Perimenopause","f":{"Meaning":"The transition years before menopause when hormones fluctuate.","Causes and risk factors":"Age-related hormonal changes, stress, lifestyle.","Symptoms to detect":"Irregular periods, hot flashes, sleep changes, mood swings, brain fog.","Prevention and precautions":"Track cycles; prioritize sleep, protein, strength training, and stress reduction.","Natural support and how to use":"Flaxseed, soy foods, leafy greens, fatty fish, magnesium-rich nuts; limit alcohol and caffeine.","Exercise if needed":"Strength training 2–3 times weekly; walking and yoga.","When to seek medical care":"Extremely heavy bleeding, bleeding between periods, or severe symptoms need review."}},{"title":"Pregnancy Nausea","f":{"Meaning":"Nausea and vomiting, often in early pregnancy.","Causes and risk factors":"Rising pregnancy hormones, empty stomach, strong smells.","Symptoms to detect":"Nausea, vomiting, food aversions, dehydration.","Prevention and precautions":"Eat small frequent meals; avoid strong smells; rest; do not skip food completely.","Natural support and how to use":"Ginger tea or ginger chews; lemon water; bland foods like crackers, rice, and bananas.","Exercise if needed":"Light walking and prenatal yoga if approved by a clinician.","When to seek medical care":"Cannot keep fluids down, weight loss, dizziness, or reduced urination needs urgent care."}},{"title":"Pregnancy Back Pain","f":{"Meaning":"Back discomfort caused by pregnancy changes.","Causes and risk factors":"Weight shift, hormones relaxing joints, posture, weak core.","Symptoms to detect":"Lower-back ache, stiffness, pain when standing or walking.","Prevention and precautions":"Supportive shoes; good posture; avoid heavy lifting; prenatal-safe movement.","Natural support and how to use":"Warm compress; pregnancy-safe massage; magnesium-rich foods.","Exercise if needed":"Prenatal yoga, pelvic tilts, walking, and swimming with clinician approval.","When to seek medical care":"Numbness, severe pain, bleeding, or contractions need urgent assessment."}},{"title":"Gestational Diabetes","f":{"Meaning":"High blood sugar that develops during pregnancy.","Causes and risk factors":"Hormonal changes, obesity, family history, age, prior GD.","Symptoms to detect":"Often no symptoms; excessive thirst, fatigue, frequent urination.","Prevention and precautions":"Early screening; balanced meals; walk after meals; limit sugary drinks.","Natural support and how to use":"Fenugreek in food; cinnamon in moderation; vegetables, beans, protein, and whole grains.","Exercise if needed":"Walking after meals; prenatal-approved strength and mobility work.","When to seek medical care":"Follow your maternity team’s testing and treatment plan closely."}},{"title":"Preeclampsia Risk","f":{"Meaning":"High blood pressure and possible organ stress during pregnancy.","Causes and risk factors":"First pregnancy, high BP, kidney disease, obesity, family history.","Symptoms to detect":"Severe headache, vision changes, upper-belly pain, swelling, high BP.","Prevention and precautions":"Attend prenatal visits; monitor BP; rest; follow medical advice.","Natural support and how to use":"No home remedy treats preeclampsia; balanced diet, hydration, and prescribed care only.","Exercise if needed":"Gentle walking only if approved; avoid strenuous exercise if advised.","When to seek medical care":"Severe headache, vision changes, swelling, or upper-belly pain is an emergency."}},{"title":"Postpartum Recovery","f":{"Meaning":"Physical and emotional healing after childbirth.","Causes and risk factors":"Childbirth strain, hormones, sleep loss, blood loss, breastfeeding.","Symptoms to detect":"Fatigue, bleeding, soreness, mood changes, hair shedding.","Prevention and precautions":"Rest, hydration, nutritious meals, gradual movement, support system.","Natural support and how to use":"Iron-rich foods, protein, oats, fruits, vegetables; sitz bath for perineal soreness.","Exercise if needed":"Start with short walks and pelvic-floor exercises when cleared by a clinician.","When to seek medical care":"Heavy bleeding, fever, severe pain, chest pain, or thoughts of self-harm need urgent care."}},{"title":"Postpartum Depression","f":{"Meaning":"Persistent low mood after childbirth that affects daily functioning.","Causes and risk factors":"Hormonal shifts, sleep deprivation, stress, lack of support, history of depression.","Symptoms to detect":"Sadness, hopelessness, anxiety, difficulty bonding, sleep problems.","Prevention and precautions":"Ask for help; rest when possible; maintain meals and connection; seek counseling.","Natural support and how to use":"Regular meals, omega-3 fish, sunlight, hydration; therapy and prescribed treatment when needed.","Exercise if needed":"Gentle walks with baby; gradually rebuild movement.","When to seek medical care":"Thoughts of harming yourself or the baby require immediate emergency help."}},{"title":"Breastfeeding Problems","f":{"Meaning":"Difficulties with latch, supply, pain, or blocked ducts.","Causes and risk factors":"Poor latch, engorgement, mastitis, stress, insufficient rest.","Symptoms to detect":"Sore nipples, low supply concerns, lumps, fever, breast redness.","Prevention and precautions":"Correct latch; feed frequently; rest; avoid tight bras.","Natural support and how to use":"Warm compress before feeding, cold compress after; oats, water, protein-rich meals; cabbage-leaf comfort for engorgement.","Exercise if needed":"Gentle walking and posture work; avoid strenuous exercise until comfortable.","When to seek medical care":"Fever, flu-like symptoms, red painful breast lump, or pus needs prompt care."}},{"title":"Breast Pain","f":{"Meaning":"Tenderness or heaviness in the breasts.","Causes and risk factors":"Hormones, caffeine, poorly fitting bras, injury, cysts.","Symptoms to detect":"Aching, swelling, tenderness, lumpiness.","Prevention and precautions":"Supportive bra; reduce caffeine; track cycle-related patterns.","Natural support and how to use":"Warm or cold compress; evening primrose oil evidence is mixed; balanced diet and hydration.","Exercise if needed":"Supportive sports bra during exercise; gentle chest and shoulder stretches.","When to seek medical care":"New distinct lump, nipple discharge, skin changes, or persistent pain needs assessment."}},{"title":"Breast Lump","f":{"Meaning":"An area of thickening or a lump in breast tissue.","Causes and risk factors":"Hormonal changes, cysts, fibroadenomas, infection, rarely cancer.","Symptoms to detect":"Lump, swelling, skin dimpling, nipple discharge, change in shape.","Prevention and precautions":"Monthly self-awareness checks; routine screening as advised; healthy lifestyle.","Natural support and how to use":"No home remedy evaluates a lump; maintain healthy diet and avoid unproven treatments.","Exercise if needed":"Gentle activity is fine unless painful.","When to seek medical care":"Any new or persistent lump needs prompt clinical evaluation."}},{"title":"Fibrocystic Breast Changes","f":{"Meaning":"Benign lumpiness or tenderness related to hormonal changes.","Causes and risk factors":"Hormonal fluctuations, caffeine sensitivity, age.","Symptoms to detect":"Lumpy breasts, tenderness, cyclical swelling.","Prevention and precautions":"Supportive bra; reduce caffeine; track symptoms across the cycle.","Natural support and how to use":"Warm compress; flaxseed; balanced diet; avoid unnecessary supplements.","Exercise if needed":"Low-impact exercise and good posture.","When to seek medical care":"A new dominant lump or bloody discharge needs medical review."}},{"title":"Thyroid Disorders","f":{"Meaning":"Underactive or overactive thyroid disrupts metabolism and hormones.","Causes and risk factors":"Autoimmune disease, iodine imbalance, genetics, postpartum changes.","Symptoms to detect":"Fatigue, weight changes, hair loss, palpitations, period changes, temperature sensitivity.","Prevention and precautions":"Regular testing if symptomatic; balanced diet; manage stress; avoid self-prescribing iodine.","Natural support and how to use":"Selenium-rich Brazil nuts in moderation; iodized salt; avoid high-dose kelp without testing.","Exercise if needed":"Moderate exercise; adjust intensity if heart rate is abnormal.","When to seek medical care":"Chest pain, severe palpitations, fainting, or neck swelling needs urgent care."}},{"title":"Hypothyroidism","f":{"Meaning":"The thyroid produces too little hormone, slowing metabolism.","Causes and risk factors":"Hashimoto’s disease, iodine issues, thyroid surgery, medicines.","Symptoms to detect":"Fatigue, weight gain, cold intolerance, dry skin, constipation, hair loss.","Prevention and precautions":"Take prescribed medication consistently; balanced diet; regular monitoring.","Natural support and how to use":"Brazil nuts in moderation, fish, eggs, dairy or fortified foods; avoid taking thyroid medicine with calcium or iron at the same time.","Exercise if needed":"Strength training and walking to support energy and metabolism.","When to seek medical care":"Severe slowing, fainting, or very low body temperature is urgent."}},{"title":"Hyperthyroidism","f":{"Meaning":"The thyroid produces too much hormone, speeding metabolism.","Causes and risk factors":"Graves’ disease, thyroid nodules, inflammation.","Symptoms to detect":"Weight loss, palpitations, anxiety, heat intolerance, tremor, frequent stools.","Prevention and precautions":"Medical assessment; avoid stimulants; manage stress; regular monitoring.","Natural support and how to use":"Balanced meals with adequate calories; avoid excess caffeine and stimulant supplements.","Exercise if needed":"Gentle exercise only if heart rate is controlled.","When to seek medical care":"Chest pain, fainting, severe palpitations, or high fever is urgent."}},{"title":"Anemia","f":{"Meaning":"Low red blood cells or hemoglobin reduce oxygen delivery.","Causes and risk factors":"Heavy periods, iron deficiency, pregnancy, poor diet, chronic disease.","Symptoms to detect":"Fatigue, pale skin, breathlessness, dizziness, fast heartbeat, hair loss.","Prevention and precautions":"Treat heavy bleeding; eat iron-rich foods with vitamin C; screen during pregnancy.","Natural support and how to use":"Beans, liver, red meat, spinach, pumpkin seeds, citrus fruits; avoid tea with iron-rich meals.","Exercise if needed":"Light-to-moderate exercise; avoid intense training while symptomatic.","When to seek medical care":"Fainting, chest pain, black stools, or severe breathlessness is urgent."}},{"title":"Iron Deficiency","f":{"Meaning":"Low iron stores affect energy, immunity, and hair health.","Causes and risk factors":"Heavy periods, poor intake, pregnancy, absorption problems.","Symptoms to detect":"Tiredness, brittle nails, hair shedding, cravings for ice, pale skin.","Prevention and precautions":"Combine plant iron with vitamin C; investigate ongoing blood loss.","Natural support and how to use":"Lentils, beans, liver, red meat, spinach, pumpkin seeds, oranges.","Exercise if needed":"Gradual aerobic activity and strength training once energy improves.","When to seek medical care":"Persistent fatigue or heavy bleeding needs testing and treatment."}},{"title":"Calcium Deficiency","f":{"Meaning":"Low calcium affects bones, muscles, and nerves.","Causes and risk factors":"Low dairy or fortified intake, menopause, vitamin D deficiency.","Symptoms to detect":"Muscle cramps, numbness, brittle nails, bone pain, fractures.","Prevention and precautions":"Include calcium foods daily; get sensible sunlight; strength train.","Natural support and how to use":"Yogurt, milk or fortified alternatives, sardines, leafy greens, sesame seeds.","Exercise if needed":"Weight-bearing exercise and resistance training 2–3 times weekly.","When to seek medical care":"Muscle spasms, tingling, or fractures need medical assessment."}},{"title":"Vitamin D Deficiency","f":{"Meaning":"Low vitamin D affects bones, immunity, mood, and muscles.","Causes and risk factors":"Low sunlight, darker skin, indoor lifestyle, obesity, malabsorption.","Symptoms to detect":"Fatigue, bone or muscle pain, low mood, frequent illness.","Prevention and precautions":"Sensible sun exposure; eat oily fish and fortified foods; maintain healthy weight.","Natural support and how to use":"Salmon, sardines, eggs, fortified milk, mushrooms; sunlight 15–30 minutes several times weekly.","Exercise if needed":"Outdoor walking and resistance training.","When to seek medical care":"Bone pain, fractures, or severe fatigue warrants a blood test."}},{"title":"Osteoporosis","f":{"Meaning":"Bones become weak and fracture more easily, especially after menopause.","Causes and risk factors":"Estrogen decline, low calcium/vitamin D, smoking, inactivity, family history.","Symptoms to detect":"Height loss, stooped posture, back pain, fractures from minor falls.","Prevention and precautions":"Calcium, vitamin D, strength training, no smoking, limit alcohol.","Natural support and how to use":"Dairy or fortified alternatives, sardines, leafy greens, almonds, sunlight.","Exercise if needed":"Weight-bearing exercise, resistance training, balance work; avoid high-impact exercise if frail.","When to seek medical care":"Sudden back pain or fracture needs urgent assessment."}},{"title":"Osteoarthritis","f":{"Meaning":"Joint cartilage wears down, causing pain and stiffness.","Causes and risk factors":"Aging, joint injury, excess weight, repetitive strain, genetics.","Symptoms to detect":"Joint pain, morning stiffness, swelling, reduced movement.","Prevention and precautions":"Maintain healthy weight; strengthen muscles around joints; avoid overuse.","Natural support and how to use":"Turmeric with black pepper, ginger, omega-3 fish, olive oil.","Exercise if needed":"Swimming, cycling, walking, and gentle strength training.","When to seek medical care":"Hot, red, severely swollen joint or fever needs urgent care."}},{"title":"Rheumatoid Arthritis","f":{"Meaning":"An autoimmune disease causing joint inflammation.","Causes and risk factors":"Immune dysfunction, genetics, smoking, hormones.","Symptoms to detect":"Joint pain, swelling, morning stiffness, fatigue, symmetrical joint involvement.","Prevention and precautions":"Do not smoke; follow treatment; protect joints; manage stress.","Natural support and how to use":"Omega-3 fish, olive oil, colorful vegetables, turmeric in food.","Exercise if needed":"Gentle range-of-motion work, swimming, and light resistance training.","When to seek medical care":"Hot, red joint with fever or rapidly worsening weakness needs urgent care."}},{"title":"Postpartum Anxiety","f":{"Meaning":"Excessive worry or panic after childbirth.","Causes and risk factors":"Hormonal shifts, sleep loss, responsibility stress, prior anxiety.","Symptoms to detect":"Racing thoughts, irritability, panic, insomnia, constant checking.","Prevention and precautions":"Ask for help; share nighttime duties; maintain rest and meals.","Natural support and how to use":"Breathing exercises, chamomile tea, magnesium-rich foods, sunlight.","Exercise if needed":"Gentle walks and stretching; avoid overtraining while sleep-deprived.","When to seek medical care":"Panic attacks, inability to care for yourself or baby, or self-harm thoughts need urgent help."}},{"title":"Sleep Problems in Menopause","f":{"Meaning":"Hormonal changes disrupt sleep quality and temperature control.","Causes and risk factors":"Falling estrogen, hot flashes, stress, sleep apnea risk.","Symptoms to detect":"Night sweats, waking frequently, insomnia, fatigue.","Prevention and precautions":"Cool room; breathable bedding; limit alcohol and caffeine; regular schedule.","Natural support and how to use":"Flaxseed, soy foods, magnesium-rich nuts, cooling foods; avoid spicy late meals.","Exercise if needed":"Yoga, walking, and strength training; avoid intense late exercise.","When to seek medical care":"Loud snoring, breathing pauses, or severe daytime sleepiness needs evaluation."}},{"title":"Varicose Veins","f":{"Meaning":"Enlarged twisted veins, often in the legs.","Causes and risk factors":"Pregnancy, genetics, prolonged standing, obesity, age.","Symptoms to detect":"Visible veins, aching, heaviness, swelling, itching.","Prevention and precautions":"Move regularly; elevate legs; avoid prolonged standing; compression if advised.","Natural support and how to use":"Horse-chestnut evidence is mixed; flavonoid-rich fruits and vegetables; hydration.","Exercise if needed":"Walking, calf raises, swimming; avoid prolonged standing.","When to seek medical care":"Skin ulcers, bleeding, sudden swelling, or severe pain needs urgent care."}},{"title":"Pelvic Floor Weakness","f":{"Meaning":"Weak muscles that support the bladder, womb, and bowel.","Causes and risk factors":"Childbirth, aging, obesity, chronic coughing, heavy lifting.","Symptoms to detect":"Urine leakage, heaviness, reduced support, pelvic pressure.","Prevention and precautions":"Pelvic-floor exercises; healthy weight; avoid chronic straining.","Natural support and how to use":"Protein, magnesium-rich foods, hydration; avoid constipation.","Exercise if needed":"Kegels: squeeze 5 seconds, relax 5 seconds, 10–15 repetitions, 2–3 times daily; add glute bridges.","When to seek medical care":"Leakage, bulge, or inability to control urine/bowel needs pelvic-health assessment."}},{"title":"Urinary Incontinence","f":{"Meaning":"Accidental urine leakage.","Causes and risk factors":"Childbirth, menopause, obesity, chronic cough, pelvic-floor weakness.","Symptoms to detect":"Leaks when coughing, laughing, exercising, or rushing to the toilet.","Prevention and precautions":"Pelvic-floor training; healthy weight; avoid excessive caffeine; treat constipation.","Natural support and how to use":"Reduce bladder irritants such as caffeine and alcohol; hydration without overdrinking; fiber to prevent constipation.","Exercise if needed":"Kegels, bladder-training schedules, walking, and core stability work.","When to seek medical care":"Blood in urine, pain, or sudden severe leakage needs assessment."}},{"title":"Pelvic Organ Prolapse","f":{"Meaning":"Pelvic organs drop from their normal position due to weak support.","Causes and risk factors":"Childbirth, menopause, obesity, chronic cough, heavy lifting.","Symptoms to detect":"Bulge or heaviness in the vagina, urinary or bowel difficulty.","Prevention and precautions":"Pelvic-floor therapy; healthy weight; avoid chronic straining; treat cough.","Natural support and how to use":"Fiber and hydration to prevent constipation; avoid heavy straining.","Exercise if needed":"Pelvic-floor exercises and gentle walking; avoid heavy lifting.","When to seek medical care":"A visible bulge, obstruction, or inability to urinate needs urgent care."}},{"title":"Polyps","f":{"Meaning":"Small growths in the uterus, cervix, or bowel.","Causes and risk factors":"Hormones, chronic inflammation, age, obesity.","Symptoms to detect":"Irregular bleeding, bleeding after sex, spotting between periods.","Prevention and precautions":"Regular checkups; manage weight and inflammation; report abnormal bleeding.","Natural support and how to use":"Balanced anti-inflammatory diet; no home remedy removes polyps.","Exercise if needed":"Gentle exercise is generally fine.","When to seek medical care":"Any bleeding after menopause or recurrent abnormal bleeding needs evaluation."}},{"title":"Cervical Health and HPV","f":{"Meaning":"HPV infection can cause cervical cell changes and cancer over time.","Causes and risk factors":"HPV through sexual contact, smoking, weakened immunity.","Symptoms to detect":"Often no symptoms; abnormal bleeding, discharge, or pain in later changes.","Prevention and precautions":"HPV vaccination where available; regular cervical screening; condoms; no smoking.","Natural support and how to use":"Balanced diet, folate-rich greens, citrus fruits; avoid smoking.","Exercise if needed":"Regular activity supports immunity and overall health.","When to seek medical care":"Bleeding after sex, postmenopausal bleeding, or abnormal discharge needs prompt assessment."}},{"title":"Cervical Cancer Risk","f":{"Meaning":"Cancer that develops from persistent high-risk HPV infection.","Causes and risk factors":"Persistent HPV, smoking, weak immunity, lack of screening.","Symptoms to detect":"Bleeding after sex, unusual discharge, pelvic pain, postmenopausal bleeding.","Prevention and precautions":"HPV vaccination; regular Pap/HPV screening; safe sex; no smoking.","Natural support and how to use":"Vegetables, fruits, folate-rich greens; avoid tobacco.","Exercise if needed":"Regular exercise supports overall health and recovery.","When to seek medical care":"Any postmenopausal bleeding or bleeding after sex needs urgent assessment."}},{"title":"Ovarian Cancer Risk","f":{"Meaning":"Cancer that begins in the ovaries; symptoms are often vague early.","Causes and risk factors":"Age, family history, endometriosis, fertility factors.","Symptoms to detect":"Bloating, pelvic pain, feeling full quickly, urinary changes, fatigue.","Prevention and precautions":"Know family history; discuss risk with a clinician; report persistent symptoms.","Natural support and how to use":"Balanced anti-inflammatory diet; no home remedy prevents or treats ovarian cancer.","Exercise if needed":"Gentle activity as tolerated.","When to seek medical care":"Persistent bloating, pelvic pain, or urinary urgency for weeks needs assessment."}},{"title":"Uterine Cancer Risk","f":{"Meaning":"Cancer that begins in the lining of the uterus.","Causes and risk factors":"Obesity, estrogen imbalance, diabetes, PCOS, late menopause.","Symptoms to detect":"Abnormal bleeding, postmenopausal bleeding, pelvic pain.","Prevention and precautions":"Maintain healthy weight; manage diabetes; report abnormal bleeding early.","Natural support and how to use":"Fiber-rich vegetables, whole grains, beans; limit processed foods.","Exercise if needed":"Regular activity and strength training.","When to seek medical care":"Postmenopausal bleeding is never normal and needs urgent evaluation."}},{"title":"Infertility","f":{"Meaning":"Difficulty conceiving after regular unprotected sex for 12 months.","Causes and risk factors":"Ovulation problems, PCOS, endometriosis, tubal blockage, age, thyroid issues.","Symptoms to detect":"Irregular cycles, painful periods, hormonal symptoms, or no obvious symptoms.","Prevention and precautions":"Track cycles; maintain healthy weight; avoid smoking and excess alcohol; early assessment after 6–12 months.","Natural support and how to use":"Balanced meals, folate-rich greens, whole grains, adequate sleep; avoid extreme dieting.","Exercise if needed":"Moderate exercise; avoid overtraining.","When to seek medical care":"Seek fertility care early if periods are irregular, cycles are very painful, or age is over 35."}},{"title":"Low Ovarian Reserve","f":{"Meaning":"Fewer eggs remain available for conception than expected for age.","Causes and risk factors":"Aging, genetics, endometriosis, surgery, chemotherapy.","Symptoms to detect":"Shorter cycles, difficulty conceiving, sometimes no symptoms.","Prevention and precautions":"Early fertility assessment; avoid smoking; healthy lifestyle.","Natural support and how to use":"Antioxidant-rich berries, vegetables, nuts, fish; adequate sleep.","Exercise if needed":"Moderate exercise; avoid excessive intense training.","When to seek medical care":"If conception is delayed or cycles change suddenly, see a fertility specialist."}},{"title":"Miscarriage Risk","f":{"Meaning":"Pregnancy loss before 20 weeks, often due to chromosome issues.","Causes and risk factors":"Chromosome abnormalities, hormonal issues, infections, chronic illness, age.","Symptoms to detect":"Bleeding, cramping, tissue passage, loss of pregnancy symptoms.","Prevention and precautions":"Prenatal care; manage diabetes and thyroid conditions; avoid smoking and alcohol.","Natural support and how to use":"Balanced nutrition, folate-rich foods, hydration; no home remedy prevents all miscarriages.","Exercise if needed":"Gentle walking as advised; avoid strenuous activity during bleeding.","When to seek medical care":"Heavy bleeding, severe pain, fever, or dizziness during pregnancy is urgent."}},{"title":"Ectopic Pregnancy Risk","f":{"Meaning":"Pregnancy grows outside the uterus, usually in a fallopian tube.","Causes and risk factors":"Previous ectopic pregnancy, tubal damage, pelvic infection, smoking.","Symptoms to detect":"One-sided pelvic pain, vaginal bleeding, shoulder-tip pain, dizziness.","Prevention and precautions":"Early pregnancy testing; prompt prenatal care; treat pelvic infections.","Natural support and how to use":"No home remedy is safe or appropriate.","Exercise if needed":"Avoid strenuous activity until assessed.","When to seek medical care":"One-sided pain, fainting, shoulder pain, or bleeding in early pregnancy is a medical emergency."}},{"title":"Fibroadenoma","f":{"Meaning":"A common benign breast lump made of glandular and connective tissue.","Causes and risk factors":"Hormonal sensitivity, age, genetics.","Symptoms to detect":"Smooth, movable, rubbery breast lump; usually painless.","Prevention and precautions":"Regular breast awareness; routine clinical checks.","Natural support and how to use":"No home remedy removes it; maintain healthy lifestyle.","Exercise if needed":"General exercise is fine.","When to seek medical care":"Any new lump needs clinical assessment to confirm it is benign."}},{"title":"Galactorrhea","f":{"Meaning":"Milk-like nipple discharge not related to breastfeeding.","Causes and risk factors":"High prolactin, medicines, thyroid problems, pituitary issues.","Symptoms to detect":"Nipple discharge, missed periods, headaches, fertility issues.","Prevention and precautions":"Do not squeeze the nipples; review medicines with a clinician; check thyroid and prolactin.","Natural support and how to use":"Balanced diet and stress management; avoid herbal products that affect hormones.","Exercise if needed":"Moderate exercise is fine.","When to seek medical care":"Bloody discharge, single-duct discharge, headache, or vision changes need prompt evaluation."}},{"title":"Mastitis","f":{"Meaning":"Breast tissue infection, common during breastfeeding.","Causes and risk factors":"Blocked duct, bacteria entering through cracked nipples, infrequent feeding.","Symptoms to detect":"Red, hot, painful breast, fever, flu-like symptoms, lump.","Prevention and precautions":"Frequent feeding or expression; proper latch; rest; do not stop breastfeeding abruptly unless advised.","Natural support and how to use":"Warm compress before feeding, cold compress afterward; hydration, rest, garlic and ginger-rich meals.","Exercise if needed":"Gentle walking; avoid pressure on the affected breast.","When to seek medical care":"Fever, pus, rapidly worsening pain, or no improvement needs urgent care."}},{"title":"Blocked Milk Duct","f":{"Meaning":"A milk duct becomes blocked, causing a tender lump.","Causes and risk factors":"Infrequent feeding, pressure, poor latch, tight bra.","Symptoms to detect":"Tender lump, localized redness, milk-flow reduction.","Prevention and precautions":"Feed or express regularly; avoid tight bras; rest.","Natural support and how to use":"Warm compress and gentle massage before feeding; cold pack afterward; adequate water.","Exercise if needed":"Light walking and shoulder mobility.","When to seek medical care":"Fever or spreading redness may indicate mastitis and needs care."}},{"title":"Engorgement","f":{"Meaning":"Breasts become overly full and painful when milk supply exceeds removal.","Causes and risk factors":"Missed feeds, weaning, oversupply, poor latch.","Symptoms to detect":"Swollen, hard, painful breasts; low-grade fever.","Prevention and precautions":"Feed or express regularly; use supportive bra; gradual weaning.","Natural support and how to use":"Warm shower before feeding; cold cabbage leaves or cold pack afterward; hydration.","Exercise if needed":"Gentle movement; avoid chest-pressure exercises.","When to seek medical care":"Fever, red streaks, or severe pain may signal infection."}},{"title":"Sore Nipples","f":{"Meaning":"Pain, cracking, or damage to nipple skin during breastfeeding.","Causes and risk factors":"Poor latch, friction, thrush, dryness, pumping issues.","Symptoms to detect":"Pain during feeding, cracks, bleeding, sharp pain after feeds.","Prevention and precautions":"Correct latch; lanolin or expressed milk on clean nipples; air-dry; check pump fit.","Natural support and how to use":"Expressed breast milk, purified lanolin, warm compress; probiotic foods if thrush is suspected.","Exercise if needed":"Gentle upper-body mobility; avoid exercises that press the chest.","When to seek medical care":"Persistent cracks, white patches, or severe pain needs lactation support."}},{"title":"Low Breast Milk Supply","f":{"Meaning":"Concern that milk production is insufficient for the baby.","Causes and risk factors":"Infrequent feeding, poor latch, stress, dehydration, some medicines.","Symptoms to detect":"Baby seems unsatisfied, poor weight gain, reduced wet diapers.","Prevention and precautions":"Feed on demand; ensure good latch; rest; hydrate; follow baby’s growth with a clinician.","Natural support and how to use":"Oats, fennel tea in moderation, water, protein-rich meals; avoid unproven galactagogues.","Exercise if needed":"Gentle walking and posture work.","When to seek medical care":"Poor weight gain, fewer wet diapers, or dehydration signs in baby need urgent pediatric care."}},{"title":"Menstrual Migraine","f":{"Meaning":"Migraines linked to the drop in estrogen around menstruation.","Causes and risk factors":"Hormonal fluctuation, stress, poor sleep, dehydration.","Symptoms to detect":"Headache before or during periods, nausea, light sensitivity.","Prevention and precautions":"Track cycle; regular sleep and meals; hydrate; reduce alcohol.","Natural support and how to use":"Ginger tea; magnesium-rich foods; hydration; avoid known triggers.","Exercise if needed":"Gentle walking and yoga; avoid intense exercise during attacks.","When to seek medical care":"Sudden severe headache, weakness, or vision loss is an emergency."}},{"title":"Hormonal Acne","f":{"Meaning":"Breakouts linked to hormonal fluctuations, often around the jawline.","Causes and risk factors":"PCOS, menstrual cycle, stress, cosmetics, insulin resistance.","Symptoms to detect":"Deep painful pimples, jawline and chin breakouts, oily skin.","Prevention and precautions":"Non-comedogenic skincare; avoid picking; manage insulin and stress.","Natural support and how to use":"Zinc-rich pumpkin seeds, spearmint tea, omega-3 fish, low-glycemic meals.","Exercise if needed":"Regular exercise helps insulin sensitivity and stress.","When to seek medical care":"Severe cystic acne or acne with irregular periods needs medical review."}},{"title":"Hirsutism","f":{"Meaning":"Excess coarse hair on the face, chest, or abdomen in women.","Causes and risk factors":"PCOS, adrenal or ovarian hormone issues, medicines, genetics.","Symptoms to detect":"Coarse hair on face, chest, belly, or back; acne; irregular periods.","Prevention and precautions":"Evaluate hormones; manage weight and insulin; avoid self-prescribing hormones.","Natural support and how to use":"Spearmint tea; balanced low-glycemic diet; strength training; avoid unverified hormone supplements.","Exercise if needed":"Strength training and walking improve metabolic health.","When to seek medical care":"Rapid hair growth, voice deepening, or severe acne needs prompt endocrine review."}},{"title":"Toxic Shock Syndrome Risk","f":{"Meaning":"Rare but serious bacterial infection linked to tampon use and wounds.","Causes and risk factors":"Prolonged tampon use, wounds, surgery, weakened immunity.","Symptoms to detect":"Sudden fever, vomiting, rash, dizziness, confusion, low BP.","Prevention and precautions":"Change tampons regularly; use the lowest absorbency needed; avoid overnight prolonged use.","Natural support and how to use":"No home remedy treats TSS; remove tampon and seek emergency care.","Exercise if needed":"None during acute illness.","When to seek medical care":"Sudden fever with rash, dizziness, or confusion is a medical emergency."}},{"title":"Premenstrual Dysphoric Disorder","f":{"Meaning":"Severe premenstrual mood symptoms that disrupt life.","Causes and risk factors":"Hormone sensitivity, serotonin changes, stress, genetics.","Symptoms to detect":"Severe mood swings, depression, anxiety, anger, sleep and concentration problems.","Prevention and precautions":"Track symptoms; regular sleep, meals, exercise; reduce alcohol and caffeine.","Natural support and how to use":"Calcium, magnesium, vitamin-B6-rich foods; chamomile tea; omega-3 fish.","Exercise if needed":"Aerobic exercise, yoga, and strength training throughout the cycle.","When to seek medical care":"Thoughts of self-harm, severe depression, or inability to function need urgent care."}},{"title":"Amenorrhea","f":{"Meaning":"Absence of menstrual periods when they should occur.","Causes and risk factors":"Pregnancy, stress, excessive exercise, low body weight, PCOS, thyroid issues.","Symptoms to detect":"No period for 3 or more months, infertility risk, bone-loss risk.","Prevention and precautions":"Adequate calories, reduce overtraining, manage stress, medical evaluation.","Natural support and how to use":"Balanced meals with enough protein, healthy fats, and carbohydrates; avoid extreme dieting.","Exercise if needed":"Reduce intense training if overexercising; prioritize strength and gentle movement.","When to seek medical care":"Missing periods are not normal and can affect bone and fertility health."}},{"title":"Dysfunctional Uterine Bleeding","f":{"Meaning":"Abnormal uterine bleeding without a clear structural cause.","Causes and risk factors":"Hormonal imbalance, PCOS, thyroid issues, stress, perimenopause.","Symptoms to detect":"Bleeding between periods, prolonged periods, unpredictable cycles.","Prevention and precautions":"Track bleeding; maintain healthy weight; seek evaluation early.","Natural support and how to use":"Iron-rich foods; balanced diet; avoid self-prescribing hormones.","Exercise if needed":"Light activity; avoid intense exercise if weak or dizzy.","When to seek medical care":"Heavy bleeding, dizziness, or bleeding after menopause needs urgent care."}},{"title":"Cervicitis","f":{"Meaning":"Inflammation of the cervix, often from infection.","Causes and risk factors":"STIs, bacterial imbalance, irritation, allergies to products.","Symptoms to detect":"Discharge, bleeding after sex, painful urination, pelvic discomfort.","Prevention and precautions":"Safe sex; avoid irritants; regular screening; treat infections.","Natural support and how to use":"No home remedy replaces prescribed treatment; hydration and gentle hygiene support comfort.","Exercise if needed":"Avoid sex until treated and cleared.","When to seek medical care":"Bleeding after sex, fever, or pelvic pain needs prompt care."}},{"title":"Pelvic Inflammatory Disease","f":{"Meaning":"Infection of the womb, tubes, or ovaries, often from untreated STIs.","Causes and risk factors":"Untreated chlamydia or gonorrhea, douching, recent childbirth or procedure.","Symptoms to detect":"Pelvic pain, fever, unusual discharge, painful sex, irregular bleeding.","Prevention and precautions":"Safe sex; regular STI testing; avoid douching; treat infections early.","Natural support and how to use":"No home remedy replaces antibiotics; rest, hydration, and warm compress may ease discomfort.","Exercise if needed":"Rest during acute illness; resume activity after treatment.","When to seek medical care":"Severe pelvic pain, fever, vomiting, or fainting is an emergency."}},{"title":"Cystitis","f":{"Meaning":"Bladder inflammation, often from infection.","Causes and risk factors":"Bacteria, sexual activity, dehydration, holding urine.","Symptoms to detect":"Burning urination, urgency, pelvic pressure, cloudy urine.","Prevention and precautions":"Hydrate; urinate after sex; avoid holding urine; good hygiene.","Natural support and how to use":"Water, cranberry juice without added sugar, barley water, probiotics.","Exercise if needed":"Gentle walking; avoid tight clothing.","When to seek medical care":"Fever, back pain, vomiting, or blood in urine needs urgent care."}},{"title":"Interstitial Cystitis","f":{"Meaning":"Chronic bladder pain and pressure without infection.","Causes and risk factors":"Bladder lining sensitivity, autoimmune factors, stress, diet triggers.","Symptoms to detect":"Pelvic pain, frequent urination, pain during sex, urgency.","Prevention and precautions":"Identify food triggers; stress management; pelvic-floor therapy; avoid harsh products.","Natural support and how to use":"Avoid personal triggers such as caffeine, alcohol, and acidic foods; water; warm compress.","Exercise if needed":"Gentle stretching, walking, and pelvic-floor relaxation.","When to seek medical care":"Blood in urine, fever, or severe pain needs medical assessment."}},{"title":"Overactive Bladder","f":{"Meaning":"Sudden urge to urinate, often with frequency or leakage.","Causes and risk factors":"Aging, pelvic-floor weakness, caffeine, diabetes, nerve issues.","Symptoms to detect":"Urgency, frequent urination, night urination, leakage.","Prevention and precautions":"Bladder training; reduce caffeine; pelvic-floor exercises; healthy weight.","Natural support and how to use":"Reduce bladder irritants; adequate but not excessive water; fiber to prevent constipation.","Exercise if needed":"Kegels, quick pelvic-floor squeezes, walking, and core work.","When to seek medical care":"Blood in urine, pain, or sudden worsening needs assessment."}},{"title":"Gallstones","f":{"Meaning":"Hard deposits form in the gallbladder and can block bile flow.","Causes and risk factors":"Obesity, rapid weight loss, high-fat diet, pregnancy, estrogen.","Symptoms to detect":"Right-upper-belly pain after fatty meals, nausea, bloating, back pain.","Prevention and precautions":"Maintain steady healthy weight; avoid crash diets; eat fiber-rich meals.","Natural support and how to use":"Water, vegetables, fruits, whole grains; reduce fried and fatty foods; avoid unproven flushes.","Exercise if needed":"Walking and gentle strength training; avoid intense exercise during pain.","When to seek medical care":"Fever, jaundice, vomiting, or severe persistent pain is urgent."}},{"title":"GERD and Heartburn","f":{"Meaning":"Stomach acid moves into the food pipe, causing burning.","Causes and risk factors":"Large meals, lying down after eating, pregnancy, fatty food, caffeine.","Symptoms to detect":"Heartburn, sour taste, burping, cough, chest discomfort.","Prevention and precautions":"Smaller meals; no food 3 hours before bed; reduce triggers.","Natural support and how to use":"Ginger tea after meals; papaya; oatmeal; avoid late spicy meals.","Exercise if needed":"Walk 10–15 minutes after meals; avoid crunches after eating.","When to seek medical care":"Chest pain with sweating or breathlessness is an emergency."}},{"title":"Gestational Hypertension","f":{"Meaning":"High blood pressure that develops during pregnancy.","Causes and risk factors":"Pregnancy changes, obesity, kidney issues, family history.","Symptoms to detect":"Often silent; headache, swelling, vision changes in severe cases.","Prevention and precautions":"Attend prenatal visits; monitor BP; follow medical advice.","Natural support and how to use":"Balanced low-sodium meals, hydration, rest; no home remedy replaces care.","Exercise if needed":"Gentle walking if approved; avoid strenuous exercise if advised.","When to seek medical care":"Severe headache, vision changes, upper-belly pain, or swelling is urgent."}},{"title":"Anemia in Pregnancy","f":{"Meaning":"Low iron or hemoglobin during pregnancy.","Causes and risk factors":"Increased iron needs, poor intake, heavy prior periods, multiple pregnancy.","Symptoms to detect":"Fatigue, pale skin, breathlessness, dizziness, fast heartbeat.","Prevention and precautions":"Prenatal vitamins; iron-rich meals; screen early; take iron as prescribed.","Natural support and how to use":"Beans, liver, red meat, spinach, pumpkin seeds with citrus fruits; avoid tea with meals.","Exercise if needed":"Gentle walking and prenatal exercise as approved.","When to seek medical care":"Fainting, chest pain, or severe breathlessness is urgent."}},{"title":"Pregnancy Insomnia","f":{"Meaning":"Difficulty sleeping during pregnancy.","Causes and risk factors":"Hormones, baby movement, heartburn, frequent urination, anxiety.","Symptoms to detect":"Trouble falling or staying asleep, daytime fatigue.","Prevention and precautions":"Sleep on the side with pillow support; limit fluids late; wind down before bed.","Natural support and how to use":"Warm milk, chamomile tea if approved, banana, breathing exercises.","Exercise if needed":"Prenatal yoga, walking, and gentle stretching.","When to seek medical care":"Severe snoring, breathing pauses, or extreme sleepiness needs assessment."}},{"title":"Pregnancy Swelling","f":{"Meaning":"Fluid buildup in feet, ankles, and hands during pregnancy.","Causes and risk factors":"Increased fluid, pressure from uterus, heat, standing long hours.","Symptoms to detect":"Swollen feet, ankles, hands, tight shoes, discomfort.","Prevention and precautions":"Elevate feet; stay hydrated; avoid standing too long; wear comfortable shoes.","Natural support and how to use":"Water-rich fruits, adequate protein, reduced salty processed food; cool compress.","Exercise if needed":"Walking, ankle circles, swimming; avoid prolonged standing.","When to seek medical care":"Sudden facial/hand swelling, headache, or vision changes can signal preeclampsia."}},{"title":"Carpal Tunnel in Pregnancy","f":{"Meaning":"Nerve compression in the wrist causing hand symptoms.","Causes and risk factors":"Fluid retention, repetitive hand use, pregnancy hormones.","Symptoms to detect":"Numbness, tingling, pain, weakness in hands, worse at night.","Prevention and precautions":"Wrist splint at night; avoid repetitive strain; elevate hands.","Natural support and how to use":"Cold compress; vitamin-B6-rich foods; gentle hand stretches.","Exercise if needed":"Wrist and finger stretches; avoid gripping-heavy exercise.","When to seek medical care":"Severe weakness or persistent numbness needs assessment."}},{"title":"Sciatica in Pregnancy","f":{"Meaning":"Pain radiating from the lower back down the leg due to nerve pressure.","Causes and risk factors":"Baby position, weight shift, disc pressure, posture.","Symptoms to detect":"Shooting leg pain, numbness, tingling, difficulty walking.","Prevention and precautions":"Good posture; supportive shoes; avoid heavy lifting; gentle movement.","Natural support and how to use":"Warm compress; pregnancy-safe massage; magnesium-rich foods.","Exercise if needed":"Prenatal yoga, pelvic tilts, walking, and gentle nerve glides with guidance.","When to seek medical care":"Loss of bladder/bowel control or severe weakness is urgent."}},{"title":"Diastasis Recti","f":{"Meaning":"Separation of abdominal muscles after pregnancy.","Causes and risk factors":"Pregnancy stretching, multiple pregnancies, weak core, heavy lifting.","Symptoms to detect":"Belly bulge, core weakness, back pain, poor posture.","Prevention and precautions":"Gradual core rehabilitation; avoid crunches early; good lifting mechanics.","Natural support and how to use":"Protein-rich meals, collagen-supporting vitamin-C foods; avoid unproven wraps as treatment.","Exercise if needed":"Deep-core activation, pelvic tilts, heel slides; avoid sit-ups until cleared.","When to seek medical care":"Pain, hernia bulge, or urinary leakage needs pelvic-health physiotherapy."}},{"title":"Pelvic Girdle Pain","f":{"Meaning":"Pain around the pelvis, hips, or lower back during pregnancy.","Causes and risk factors":"Hormonal joint loosening, posture changes, previous injury.","Symptoms to detect":"Pain walking, turning in bed, climbing stairs, or standing on one leg.","Prevention and precautions":"Supportive belt if advised; good posture; avoid asymmetric movements.","Natural support and how to use":"Warm compress; gentle massage; balanced nutrition.","Exercise if needed":"Pelvic tilts, clamshells, gentle mobility, swimming.","When to seek medical care":"Severe pain, numbness, or inability to walk needs assessment."}},{"title":"Pregnancy Ankle Pain","f":{"Meaning":"Foot and ankle discomfort from added weight and fluid changes.","Causes and risk factors":"Weight gain, fluid retention, relaxed ligaments, footwear.","Symptoms to detect":"Aching arches, swollen ankles, heel pain.","Prevention and precautions":"Supportive shoes; elevate feet; avoid long standing; gentle stretching.","Natural support and how to use":"Cold compress; foot rolling on a ball; hydration; magnesium-rich foods.","Exercise if needed":"Ankle circles, calf stretches, swimming, walking.","When to seek medical care":"Severe swelling in one leg with pain or redness needs urgent assessment."}},{"title":"Pregnancy Constipation","f":{"Meaning":"Difficult bowel movements during pregnancy.","Causes and risk factors":"Hormones slowing digestion, iron supplements, reduced activity.","Symptoms to detect":"Hard stool, bloating, straining, belly discomfort.","Prevention and precautions":"Fiber, water, gentle movement; take iron with advice and food if needed.","Natural support and how to use":"Papaya, prunes, oats, flaxseed, warm lemon water.","Exercise if needed":"Walking 20–30 minutes daily; prenatal yoga.","When to seek medical care":"Severe pain, vomiting, bleeding, or no stool with swelling needs care."}},{"title":"Pregnancy Heartburn","f":{"Meaning":"Acid reflux caused by pregnancy pressure and hormones.","Causes and risk factors":"Hormones relaxing the food-pipe valve, growing uterus, large meals.","Symptoms to detect":"Burning chest, sour taste, burping, night cough.","Prevention and precautions":"Small meals; avoid lying down after eating; avoid trigger foods.","Natural support and how to use":"Ginger tea; papaya; oatmeal; avoid late spicy meals.","Exercise if needed":"Walk after meals; avoid bending or core work after eating.","When to seek medical care":"Chest pain with sweating or breathlessness is an emergency."}},{"title":"Pregnancy Hair Shedding","f":{"Meaning":"Temporary hair loss after childbirth.","Causes and risk factors":"Hormonal shift after delivery, stress, iron deficiency.","Symptoms to detect":"Increased shedding 2–4 months postpartum.","Prevention and precautions":"Gentle hair care; adequate protein and iron; manage stress.","Natural support and how to use":"Rosemary oil, protein-rich foods, eggs, fish, spinach, nuts.","Exercise if needed":"Moderate exercise and stress reduction.","When to seek medical care":"Patchy loss or scalp sores need dermatology review."}},{"title":"Menopausal Joint Pain","f":{"Meaning":"Joint stiffness and aches linked to estrogen decline.","Causes and risk factors":"Estrogen decline, aging, inflammation, inactivity.","Symptoms to detect":"Stiff joints, aches, reduced flexibility, morning discomfort.","Prevention and precautions":"Strength training, healthy weight, anti-inflammatory diet, sleep.","Natural support and how to use":"Turmeric with black pepper, ginger, fatty fish, olive oil.","Exercise if needed":"Strength training, walking, swimming, and mobility work.","When to seek medical care":"Hot, red, swollen joint or fever needs urgent care."}},{"title":"Menopausal Weight Gain","f":{"Meaning":"Fat gain around the belly during the menopause transition.","Causes and risk factors":"Hormonal changes, muscle loss, insulin resistance, poor sleep.","Symptoms to detect":"Belly fat, slower metabolism, fatigue, clothing changes.","Prevention and precautions":"Protein at meals, strength training, sleep, stress management.","Natural support and how to use":"Fiber-rich vegetables, beans, green tea, adequate protein; limit alcohol.","Exercise if needed":"Strength training 2–3 times weekly plus daily walking.","When to seek medical care":"Rapid unexplained weight gain or severe symptoms need medical review."}},{"title":"Hot Flashes","f":{"Meaning":"Sudden heat, sweating, and flushing often during menopause.","Causes and risk factors":"Estrogen decline, stress, alcohol, spicy food, heat.","Symptoms to detect":"Heat waves, sweating, palpitations, night sweats.","Prevention and precautions":"Cool environment; breathable clothing; reduce triggers; regular exercise.","Natural support and how to use":"Flaxseed, soy foods, cooling water-rich fruits; avoid spicy late meals.","Exercise if needed":"Yoga, walking, and strength training; avoid overheating during workouts.","When to seek medical care":"Chest pain, fainting, or heart palpitations that persist need assessment."}},{"title":"Vaginal Atrophy","f":{"Meaning":"Thinning and dryness of vaginal tissue after estrogen decline.","Causes and risk factors":"Menopause, breastfeeding, some cancer treatments.","Symptoms to detect":"Dryness, burning, painful sex, urinary symptoms.","Prevention and precautions":"Use lubricants and moisturizers; avoid irritants; discuss treatment options.","Natural support and how to use":"Water-based lubricant; vaginal moisturizer; vitamin-E-rich foods; avoid scented products.","Exercise if needed":"Pelvic-floor relaxation and gentle walking.","When to seek medical care":"Bleeding, sores, or persistent pain needs gynecological assessment."}},{"title":"Painful Periods After Childbirth","f":{"Meaning":"Menstrual pain that becomes noticeable or worse after delivery.","Causes and risk factors":"Hormonal changes, adenomyosis, fibroids, pelvic issues.","Symptoms to detect":"Cramps, heavy flow, pelvic pain after childbirth returns.","Prevention and precautions":"Track cycles; heat therapy; balanced nutrition; medical review if severe.","Natural support and how to use":"Ginger tea; warm compress; magnesium-rich foods; omega-3 fish.","Exercise if needed":"Walking, yoga, and gentle core restoration.","When to seek medical care":"Very heavy bleeding, fainting, or severe pain needs assessment."}},{"title":"Adenomyosis","f":{"Meaning":"Uterine lining tissue grows into the muscular wall of the womb.","Causes and risk factors":"Hormones, prior uterine surgery, childbirth, inflammation.","Symptoms to detect":"Heavy painful periods, enlarged uterus, pelvic pressure, painful sex.","Prevention and precautions":"Track symptoms; anti-inflammatory diet; early gynecological review.","Natural support and how to use":"Ginger, turmeric, omega-3 fish, vegetables; heat therapy for cramps.","Exercise if needed":"Gentle yoga, walking, pelvic-floor relaxation.","When to seek medical care":"Heavy bleeding, anemia, or severe pain needs specialist care."}},{"title":"Vulvodynia","f":{"Meaning":"Chronic pain or burning around the vaginal opening without clear infection.","Causes and risk factors":"Nerve sensitivity, pelvic-floor tension, irritation, hormones.","Symptoms to detect":"Burning, stinging, pain with sex or tampon use.","Prevention and precautions":"Avoid irritants; use lubricants; pelvic-floor therapy; gentle clothing.","Natural support and how to use":"Cool compress; vitamin-E-rich foods; avoid scented products.","Exercise if needed":"Pelvic-floor relaxation, deep breathing, gentle walking.","When to seek medical care":"Persistent pain needs a vulvar/pelvic-health specialist."}},{"title":"Lichen Sclerosus","f":{"Meaning":"Chronic skin condition causing thin, white, itchy vulvar skin.","Causes and risk factors":"Autoimmune factors, hormones, genetics.","Symptoms to detect":"Itching, white patches, fragile skin, painful sex, scarring.","Prevention and precautions":"Avoid scratching and irritants; regular follow-up; gentle hygiene.","Natural support and how to use":"Emollients for external use; avoid harsh soaps; no home remedy replaces prescribed treatment.","Exercise if needed":"Gentle movement; avoid friction-heavy exercise during flares.","When to seek medical care":"Bleeding, ulcers, or skin changes need prompt dermatology/gynecology review."}},{"title":"Vaginal Fistula","f":{"Meaning":"Abnormal connection between the vagina and bladder or bowel, often after obstructed childbirth.","Causes and risk factors":"Prolonged obstructed labor, surgery, radiation, infection.","Symptoms to detect":"Continuous urine or stool leakage from the vagina, recurrent infections.","Prevention and precautions":"Timely obstetric care; treat infections; surgical repair is usually needed.","Natural support and how to use":"Nutrition, hydration, and wound care support recovery but do not close a fistula.","Exercise if needed":"Gentle movement as advised after surgery.","When to seek medical care":"Continuous leakage after childbirth needs specialist assessment."}},{"title":"Cervical Polyp Bleeding","f":{"Meaning":"Bleeding caused by benign growths on the cervix.","Causes and risk factors":"Chronic inflammation, hormones, pregnancy changes.","Symptoms to detect":"Spotting after sex, between periods, or after menopause.","Prevention and precautions":"Regular screening; avoid self-treatment; report bleeding patterns.","Natural support and how to use":"Balanced diet; no home remedy removes polyps.","Exercise if needed":"Gentle activity is fine.","When to seek medical care":"Postmenopausal bleeding or recurrent bleeding needs prompt assessment."}},{"title":"Breast Abscess","f":{"Meaning":"A collection of pus in the breast, often related to mastitis.","Causes and risk factors":"Untreated mastitis, blocked duct, bacteria, smoking.","Symptoms to detect":"Painful hot lump, fever, pus, redness.","Prevention and precautions":"Treat mastitis early; continue feeding or expressing as advised; avoid tight bras.","Natural support and how to use":"Warm compress before feeding; medical drainage or antibiotics when needed.","Exercise if needed":"Rest; gentle arm mobility.","When to seek medical care":"Fever, pus, or rapidly worsening breast pain needs urgent care."}},{"title":"Nipple Discharge","f":{"Meaning":"Fluid leaking from one or both nipples outside breastfeeding.","Causes and risk factors":"Hormones, medicines, prolactin issues, duct problems, rarely cancer.","Symptoms to detect":"Milk-like, clear, green, bloody, or single-duct discharge.","Prevention and precautions":"Do not squeeze nipples; review medicines; seek assessment for persistent discharge.","Natural support and how to use":"Balanced diet and stress management; avoid hormone-affecting supplements.","Exercise if needed":"General exercise is fine.","When to seek medical care":"Bloody, single-duct, or discharge with a lump needs prompt evaluation."}},{"title":"Fibrocystic Pain","f":{"Meaning":"Cyclical breast pain and lumpiness linked to hormonal changes.","Causes and risk factors":"Hormonal fluctuations, caffeine, stress, cysts.","Symptoms to detect":"Tenderness, swelling, lumpy texture before periods.","Prevention and precautions":"Supportive bra; reduce caffeine; track cycle pattern.","Natural support and how to use":"Warm/cold compress; flaxseed; balanced diet; adequate hydration.","Exercise if needed":"Supportive sports bra; gentle chest and shoulder stretches.","When to seek medical care":"A new dominant lump or bloody discharge needs assessment."}},{"title":"Thyroid Eye Problems","f":{"Meaning":"Eye symptoms associated with thyroid disease, especially Graves’ disease.","Causes and risk factors":"Autoimmune thyroid disease, smoking, genetics.","Symptoms to detect":"Bulging eyes, dryness, double vision, eye pressure, irritation.","Prevention and precautions":"Do not smoke; manage thyroid condition; protect eyes; regular follow-up.","Natural support and how to use":"Selenium-rich foods in moderation; artificial tears for dryness; avoid smoking.","Exercise if needed":"Low-impact exercise; avoid strenuous activity if heart rate is abnormal.","When to seek medical care":"Vision change, severe eye pain, or double vision is urgent."}},{"title":"Goiter","f":{"Meaning":"Enlargement of the thyroid gland in the neck.","Causes and risk factors":"Iodine imbalance, autoimmune disease, nodules, genetics.","Symptoms to detect":"Neck swelling, tightness, difficulty swallowing, voice change.","Prevention and precautions":"Use iodized salt appropriately; avoid high-dose kelp without testing; regular checks.","Natural support and how to use":"Iodized salt, fish, dairy or fortified foods; avoid self-prescribing iodine supplements.","Exercise if needed":"General moderate exercise is fine.","When to seek medical care":"Rapid growth, breathing or swallowing difficulty needs urgent care."}},{"title":"Thyroid Nodules","f":{"Meaning":"Lumps within the thyroid gland.","Causes and risk factors":"Iodine status, genetics, radiation exposure, age.","Symptoms to detect":"Neck lump, pressure, hoarseness, often no symptoms.","Prevention and precautions":"Regular monitoring; avoid unregulated iodine supplements; healthy diet.","Natural support and how to use":"Balanced iodine intake through iodized salt and fish; avoid megadose kelp.","Exercise if needed":"General exercise is fine.","When to seek medical care":"Rapid growth, hard fixed lump, or voice change needs urgent assessment."}},{"title":"Preventive Checkups and Cancer Screening","f":{"Meaning":"Regular screening detects disease early before symptoms appear.","Causes and risk factors":"Skipping checkups, fear, busy schedules, lack of awareness.","Symptoms to detect":"Often none—this is why screening matters.","Prevention and precautions":"Cervical screening, breast awareness/mammography as advised, BP, sugar, cholesterol, bone health.","Natural support and how to use":"Balanced diet, exercise, sleep, no smoking, limited alcohol.","Exercise if needed":"At least 150 minutes weekly moderate activity plus strength training twice weekly.","When to seek medical care":"Do not wait for symptoms; early detection saves lives."}}],"general":[{"title":"Fever","f":{"Meaning":"Raised body temperature, often from infection or inflammation.","Causes and risk factors":"Infections, heat, inflammation, some medicines.","Symptoms to detect":"Hot body, chills, sweating, fatigue, headache.","Prevention and precautions":"Hydration, handwashing, vaccination, mosquito protection.","Natural support and how to use":"Lukewarm sponge, fluids, rest; paracetamol/ibuprofen only at correct doses.","Exercise if needed":"Rest; resume activity after recovery.","When to seek medical care":"Fever with stiff neck, confusion, rash, breathing difficulty, or seizure is urgent."}},{"title":"Malaria","f":{"Meaning":"Parasitic infection transmitted by infected mosquitoes.","Causes and risk factors":"Mosquito bites in endemic areas.","Symptoms to detect":"Fever, chills, headache, body pain, vomiting, fatigue.","Prevention and precautions":"Treated nets, repellent, screens, removing stagnant water.","Natural support and how to use":"Hydration, light meals, rest; testing and prescribed antimalarial medicine are essential.","Exercise if needed":"Rest during illness; gradual return to activity.","When to seek medical care":"Confusion, seizures, inability to drink, or fast breathing is an emergency."}},{"title":"Typhoid","f":{"Meaning":"Bacterial infection from contaminated food or water.","Causes and risk factors":"Unsafe water, poor sanitation, contaminated food.","Symptoms to detect":"Fever, weakness, stomach pain, poor appetite, bowel changes.","Prevention and precautions":"Safe water, handwashing, washed fruits, properly cooked food.","Natural support and how to use":"Oral rehydration, rice, banana, toast, yogurt; complete prescribed antibiotics.","Exercise if needed":"Rest; gentle walking after recovery.","When to seek medical care":"Severe belly pain, confusion, or persistent high fever is urgent."}},{"title":"Common Cold","f":{"Meaning":"Mild viral infection of the nose and throat.","Causes and risk factors":"Viruses spread through droplets and surfaces.","Symptoms to detect":"Runny nose, sneezing, mild cough, sore throat.","Prevention and precautions":"Handwashing, avoid sick contacts, clean shared surfaces.","Natural support and how to use":"Warm fluids, honey for adults, saline nasal rinse, rest.","Exercise if needed":"Light walking if energy allows.","When to seek medical care":"Trouble breathing, high fever, or symptoms beyond 10 days need review."}},{"title":"Influenza","f":{"Meaning":"Viral illness causing sudden fever and body symptoms.","Causes and risk factors":"Influenza viruses spread through droplets.","Symptoms to detect":"Fever, chills, body aches, cough, fatigue.","Prevention and precautions":"Annual flu vaccine where available; handwashing; avoid crowds when sick.","Natural support and how to use":"Fluids, rest, warm soup, honey, vitamin-C-rich fruits.","Exercise if needed":"Bed rest; gentle movement after fever settles.","When to seek medical care":"Breathing difficulty, dehydration, or confusion needs urgent care."}},{"title":"Cough","f":{"Meaning":"Reflex that clears mucus or irritation from airways.","Causes and risk factors":"Cold, flu, asthma, allergies, smoke, reflux.","Symptoms to detect":"Dry or wet cough, chest discomfort, poor sleep.","Prevention and precautions":"Avoid smoke; treat allergies; stay hydrated.","Natural support and how to use":"Warm water, honey for adults, steam inhalation, saline rinse.","Exercise if needed":"Walking and breathing exercises if well.","When to seek medical care":"Blood in cough, wheezing, chest pain, or breathlessness is urgent."}},{"title":"Pneumonia","f":{"Meaning":"Lung infection that inflames air sacs.","Causes and risk factors":"Bacteria, viruses, smoking, weak immunity.","Symptoms to detect":"Fever, cough, fast breathing, chest pain, fatigue.","Prevention and precautions":"Vaccination, no smoking, good nutrition, early treatment of respiratory illness.","Natural support and how to use":"Warm fluids, rest, protein-rich foods; medical treatment is essential.","Exercise if needed":"Rest; gradual walking during recovery.","When to seek medical care":"Fast breathing, chest indrawing, blue lips, or confusion is an emergency."}},{"title":"Tuberculosis","f":{"Meaning":"Bacterial infection mainly affecting the lungs.","Causes and risk factors":"Close contact with an infected person, weak immunity.","Symptoms to detect":"Cough over 2 weeks, night sweats, weight loss, fever, coughing blood.","Prevention and precautions":"Ventilation, cover coughs, complete treatment, testing after exposure.","Natural support and how to use":"Nutritious food, protein, eggs, beans, fruits; complete prescribed TB treatment.","Exercise if needed":"Rest during treatment; gradual activity.","When to seek medical care":"Coughing blood or severe breathlessness is urgent."}},{"title":"Sinusitis","f":{"Meaning":"Inflammation or infection of sinus passages.","Causes and risk factors":"Cold, allergies, nasal blockage, bacterial infection.","Symptoms to detect":"Facial pressure, blocked nose, headache, thick mucus.","Prevention and precautions":"Steam inhalation, saline rinse, hydration, avoid smoke.","Natural support and how to use":"Steam with eucalyptus or ginger; warm compress; spicy foods may temporarily clear passages.","Exercise if needed":"Light walking; avoid intense exercise during fever.","When to seek medical care":"Swelling around the eye, vision change, or confusion is urgent."}},{"title":"Allergies","f":{"Meaning":"Immune overreaction to dust, pollen, food, or other triggers.","Causes and risk factors":"Genetics, exposure, season, certain foods.","Symptoms to detect":"Sneezing, itching, rash, watery eyes, cough.","Prevention and precautions":"Reduce dust, wash bedding, avoid triggers, keep windows managed.","Natural support and how to use":"Saline rinse, vitamin-C-rich fruits, local honey evidence is limited.","Exercise if needed":"Indoor exercise during high-pollen periods.","When to seek medical care":"Facial swelling, breathing difficulty, or collapse is an emergency."}},{"title":"Asthma","f":{"Meaning":"Long-term airway inflammation causing breathing difficulty.","Causes and risk factors":"Genetics, allergies, smoke, infections, exercise triggers.","Symptoms to detect":"Wheeze, cough, chest tightness, breathlessness.","Prevention and precautions":"Avoid triggers; use inhalers correctly; regular review.","Natural support and how to use":"Warm fluids; avoid triggers; follow prescribed asthma plan.","Exercise if needed":"Swimming, walking, and controlled exercise with an action plan.","When to seek medical care":"Severe breathlessness, blue lips, or no inhaler relief is an emergency."}},{"title":"High Blood Pressure","f":{"Meaning":"Blood pushes too hard against artery walls over time.","Causes and risk factors":"Salt, inactivity, obesity, alcohol, smoking, stress.","Symptoms to detect":"Often none; sometimes headache, dizziness, blurred vision.","Prevention and precautions":"Check BP; reduce salt; exercise; avoid smoking and excess alcohol.","Natural support and how to use":"Garlic, beetroot, hibiscus tea, bananas, leafy greens.","Exercise if needed":"Brisk walking 30 minutes 5 days weekly; strength training twice weekly.","When to seek medical care":"BP above 180/120 or chest pain, weakness, speech or vision change is urgent."}},{"title":"Type 2 Diabetes","f":{"Meaning":"The body cannot use insulin properly, raising blood sugar.","Causes and risk factors":"Obesity, inactivity, sugary drinks, family history.","Symptoms to detect":"Thirst, frequent urination, fatigue, blurred vision, slow healing.","Prevention and precautions":"Healthy weight, fiber-rich meals, walking after meals, screening.","Natural support and how to use":"Fenugreek, cinnamon, apple-cider vinegar before high-carb meals, beans and vegetables.","Exercise if needed":"Walk 30–45 minutes daily; resistance training twice weekly.","When to seek medical care":"Confusion, vomiting, or very high readings need urgent care."}},{"title":"Heart Disease","f":{"Meaning":"Narrowed or damaged blood vessels reduce heart blood flow.","Causes and risk factors":"Smoking, BP, cholesterol, diabetes, inactivity.","Symptoms to detect":"Chest pressure, breathlessness, fatigue, palpitations.","Prevention and precautions":"No smoking; exercise; plant-rich diet; control BP and sugar.","Natural support and how to use":"Oats, beans, fatty fish, garlic, vegetables.","Exercise if needed":"150 minutes weekly aerobic activity; strength training twice weekly.","When to seek medical care":"Crushing chest pain, sweating, or fainting is an emergency."}},{"title":"High Cholesterol","f":{"Meaning":"Too much cholesterol can clog arteries.","Causes and risk factors":"Fried food, red meat, inactivity, genetics.","Symptoms to detect":"Usually no symptoms until artery disease develops.","Prevention and precautions":"Fiber, fish, nuts, vegetables; reduce fried and processed foods.","Natural support and how to use":"Oats, beans, avocado, walnuts, olive oil, garlic.","Exercise if needed":"Aerobic exercise most days; strength training twice weekly.","When to seek medical care":"Get a lipid test; follow prescribed treatment."}},{"title":"Stroke","f":{"Meaning":"Blood flow to part of the brain is blocked or a vessel bursts.","Causes and risk factors":"High BP, diabetes, smoking, irregular heartbeat, obesity.","Symptoms to detect":"Face drooping, arm weakness, speech difficulty, confusion.","Prevention and precautions":"Control BP and diabetes; no smoking; stay active.","Natural support and how to use":"Leafy greens, berries, fish, garlic; reduce salt.","Exercise if needed":"Regular walking, balance work, strength training.","When to seek medical care":"Use FAST and seek emergency care immediately."}},{"title":"Obesity","f":{"Meaning":"Excess body fat increases risk of many diseases.","Causes and risk factors":"Overeating, sugary drinks, inactivity, poor sleep.","Symptoms to detect":"Large waist, breathlessness, fatigue, joint pain.","Prevention and precautions":"Protein, vegetables, water, daily movement, sleep.","Natural support and how to use":"Ginger tea, green tea, lemon water, beans, oats.","Exercise if needed":"Walk 30–45 minutes 5 days weekly; strength training 2–3 times weekly.","When to seek medical care":"Chest pain, severe breathlessness, or sleep apnea signs need assessment."}},{"title":"Fatty Liver","f":{"Meaning":"Fat builds up in the liver and may cause inflammation.","Causes and risk factors":"Alcohol, obesity, diabetes, poor diet.","Symptoms to detect":"Often silent; fatigue, right-side belly discomfort.","Prevention and precautions":"Limit alcohol, lose belly fat, avoid sugary drinks.","Natural support and how to use":"Coffee in moderation, greens, garlic, omega-3 fish; avoid detox fads.","Exercise if needed":"Walking daily; strength training twice weekly.","When to seek medical care":"Jaundice, abdominal swelling, or severe fatigue needs care."}},{"title":"Kidney Stones","f":{"Meaning":"Hard mineral deposits form in the kidneys.","Causes and risk factors":"Low water, high salt, animal protein, family history.","Symptoms to detect":"Severe side/back pain, blood in urine, nausea.","Prevention and precautions":"Hydrate; reduce salt; moderate animal protein.","Natural support and how to use":"Lemon water, watermelon, cucumber; reduce cola and salt.","Exercise if needed":"Daily walking; avoid intense exercise during pain.","When to seek medical care":"Fever, vomiting, or inability to pass urine is urgent."}},{"title":"Chronic Kidney Disease","f":{"Meaning":"Kidneys gradually lose filtering ability.","Causes and risk factors":"Diabetes, BP, smoking, repeated infections, painkillers.","Symptoms to detect":"Swelling, fatigue, poor appetite, foamy urine.","Prevention and precautions":"Control BP and sugar; avoid unnecessary painkillers; hydrate.","Natural support and how to use":"Water, berries, cabbage, garlic; avoid kidney-stressing herbal products.","Exercise if needed":"Gentle walking most days.","When to seek medical care":"Foamy urine, swelling, or reduced urination needs prompt testing."}},{"title":"Urinary Tract Infection","f":{"Meaning":"Bacteria infect the bladder or urinary tract.","Causes and risk factors":"Holding urine, dehydration, sexual activity, poor hygiene.","Symptoms to detect":"Burning urination, urgency, cloudy urine, pelvic pain.","Prevention and precautions":"Hydrate; urinate after sex; good hygiene.","Natural support and how to use":"Water, cranberry juice without sugar, barley water, probiotics.","Exercise if needed":"Gentle walking; avoid tight clothing.","When to seek medical care":"Fever, back pain, vomiting, or blood in urine is urgent."}},{"title":"Gout","f":{"Meaning":"Uric acid crystals cause sudden joint inflammation.","Causes and risk factors":"Red meat, alcohol, sugary drinks, dehydration.","Symptoms to detect":"Sudden intense joint pain, redness, swelling.","Prevention and precautions":"Limit beer, sugary drinks, organ meats; hydrate.","Natural support and how to use":"Cherries, celery, lemon water, vitamin-C-rich fruits.","Exercise if needed":"Gentle walking between attacks.","When to seek medical care":"Hot swollen joint with fever needs urgent care."}},{"title":"Osteoarthritis","f":{"Meaning":"Joint cartilage wears down, causing pain and stiffness.","Causes and risk factors":"Aging, injury, excess weight, overuse.","Symptoms to detect":"Joint pain, stiffness, swelling, reduced movement.","Prevention and precautions":"Healthy weight; strengthen supporting muscles.","Natural support and how to use":"Turmeric with black pepper, ginger, omega-3 fish, olive oil.","Exercise if needed":"Swimming, cycling, walking, gentle strength work.","When to seek medical care":"Hot red swollen joint or fever is urgent."}},{"title":"Rheumatoid Arthritis","f":{"Meaning":"Autoimmune joint inflammation.","Causes and risk factors":"Immune dysfunction, genetics, smoking.","Symptoms to detect":"Joint pain, swelling, morning stiffness, fatigue.","Prevention and precautions":"No smoking; treatment adherence; joint protection.","Natural support and how to use":"Omega-3 fish, olive oil, vegetables, turmeric.","Exercise if needed":"Gentle mobility, swimming, light resistance work.","When to seek medical care":"Hot red joint with fever or rapid worsening is urgent."}},{"title":"Lower Back Pain","f":{"Meaning":"Pain or stiffness between ribs and hips.","Causes and risk factors":"Lifting, sitting, weak core, poor posture, disc issues.","Symptoms to detect":"Ache, sharp pain, stiffness, leg pain.","Prevention and precautions":"Lift properly; move often; strengthen core.","Natural support and how to use":"Heat for tightness, ice after new injury, turmeric and ginger.","Exercise if needed":"Knee-to-chest, cat-cow, glute bridges, bird-dogs, walking.","When to seek medical care":"Groin numbness, leg weakness, or bladder/bowel loss is urgent."}},{"title":"Neck Pain","f":{"Meaning":"Pain or stiffness in the neck.","Causes and risk factors":"Phone use, posture, stress, sleep position.","Symptoms to detect":"Stiffness, headache, reduced turning.","Prevention and precautions":"Raise screens; take breaks; supportive pillow.","Natural support and how to use":"Heat pack, gentle massage, magnesium-rich foods.","Exercise if needed":"Chin tucks, shoulder rolls, gentle stretches.","When to seek medical care":"Numbness, weakness, or pain after injury needs assessment."}},{"title":"Knee Pain","f":{"Meaning":"Pain around the knee from injury, arthritis, or overuse.","Causes and risk factors":"Excess weight, weak thighs, poor form, old injury.","Symptoms to detect":"Pain, swelling, stiffness, instability.","Prevention and precautions":"Strengthen thighs and glutes; healthy weight; proper footwear.","Natural support and how to use":"Turmeric, ginger, cold pack after activity, protein.","Exercise if needed":"Straight-leg raises, wall sits, glute bridges, cycling.","When to seek medical care":"Locking, giving way, or major swelling needs assessment."}},{"title":"Frozen Shoulder","f":{"Meaning":"Shoulder becomes stiff and painful, limiting movement.","Causes and risk factors":"Injury, diabetes, immobility.","Symptoms to detect":"Gradual pain and inability to lift or rotate arm.","Prevention and precautions":"Keep shoulder gently moving; manage diabetes.","Natural support and how to use":"Warm compress before stretching; anti-inflammatory foods.","Exercise if needed":"Pendulum swings, wall climbs, towel stretches.","When to seek medical care":"Sudden inability to move the shoulder needs evaluation."}},{"title":"Tennis El
