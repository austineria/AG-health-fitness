bow","f":{"Meaning":"Tendon pain on the outside of the elbow.","Causes and risk factors":"Repetitive gripping, typing, lifting.","Symptoms to detect":"Outer-elbow pain, weak grip.","Prevention and precautions":"Improve technique; take breaks; strengthen forearm.","Natural support and how to use":"Ice after activity; warm compress before stretching; omega-3 foods.","Exercise if needed":"Wrist stretches and eccentric wrist exercises.","When to seek medical care":"Persistent weakness or severe pain needs review."}},{"title":"Plantar Fasciitis","f":{"Meaning":"Inflammation of tissue along the bottom of the foot.","Causes and risk factors":"Standing, tight calves, poor shoes, excess weight.","Symptoms to detect":"Heel pain, especially first steps in the morning.","Prevention and precautions":"Supportive shoes; calf stretching; avoid barefoot hard floors.","Natural support and how to use":"Ice-bottle massage, foot rolling, magnesium-rich foods.","Exercise if needed":"Calf stretches, towel stretches, toe curls, calf raises.","When to seek medical care":"Persistent pain or numbness needs assessment."}},{"title":"Osteoporosis","f":{"Meaning":"Bones become weak and fracture easily.","Causes and risk factors":"Aging, low calcium/vitamin D, smoking, inactivity.","Symptoms to detect":"Height loss, stooped posture, fractures.","Prevention and precautions":"Calcium, vitamin D, weight-bearing exercise, no smoking.","Natural support and how to use":"Dairy or fortified alternatives, sardines, greens, almonds, sunlight.","Exercise if needed":"Walking, stair climbing, resistance training, balance work.","When to seek medical care":"Sudden back pain or fracture needs urgent assessment."}},{"title":"Muscle Loss","f":{"Meaning":"Loss of muscle mass and strength with age or illness.","Causes and risk factors":"Inactivity, low protein, aging, illness.","Symptoms to detect":"Weakness, slow movement, fatigue, falls.","Prevention and precautions":"Protein intake; resistance training; avoid prolonged inactivity.","Natural support and how to use":"Eggs, fish, beans, dairy, nuts; vitamin D.","Exercise if needed":"Strength training 2–3 times weekly; walking daily.","When to seek medical care":"Rapid weakness or weight loss needs evaluation."}},{"title":"Vitamin D Deficiency","f":{"Meaning":"Low vitamin D affects bones, muscles, immunity, and mood.","Causes and risk factors":"Low sunlight, indoor lifestyle, obesity.","Symptoms to detect":"Fatigue, bone/muscle pain, low mood.","Prevention and precautions":"Sensible sunlight; oily fish; fortified foods.","Natural support and how to use":"Salmon, sardines, eggs, fortified milk, mushrooms.","Exercise if needed":"Outdoor walking and resistance training.","When to seek medical care":"Bone pain, fractures, or severe fatigue warrants testing."}},{"title":"Iron-Deficiency Anemia","f":{"Meaning":"Low iron reduces oxygen delivery in blood.","Causes and risk factors":"Blood loss, poor diet, absorption problems.","Symptoms to detect":"Fatigue, pale skin, breathlessness, dizziness.","Prevention and precautions":"Iron-rich meals with vitamin C; investigate blood loss.","Natural support and how to use":"Beans, liver, red meat, spinach, pumpkin seeds, citrus.","Exercise if needed":"Light-to-moderate activity; avoid intense training while symptomatic.","When to seek medical care":"Fainting, chest pain, black stools, or severe breathlessness is urgent."}},{"title":"Vitamin B12 Deficiency","f":{"Meaning":"Low B12 affects nerves, blood cells, and energy.","Causes and risk factors":"Poor diet, stomach issues, alcohol, medicines.","Symptoms to detect":"Tingling, fatigue, memory issues, balance problems.","Prevention and precautions":"Include animal or fortified foods; limit alcohol.","Natural support and how to use":"Eggs, fish, meat, dairy, fortified cereals.","Exercise if needed":"Moderate walking and balance work.","When to seek medical care":"Numbness, weakness, or balance problems need prompt assessment."}},{"title":"Insomnia","f":{"Meaning":"Difficulty falling or staying asleep.","Causes and risk factors":"Stress, caffeine, screens, alcohol, irregular schedule.","Symptoms to detect":"Trouble sleeping, daytime tiredness, irritability.","Prevention and precautions":"Fixed bedtime; no caffeine after 2 p.m.; dark room.","Natural support and how to use":"Chamomile tea, warm milk, banana, breathing exercises.","Exercise if needed":"Morning walks; gentle evening stretching.","When to seek medical care":"Loud snoring, gasping, or severe daytime sleepiness needs assessment."}},{"title":"Sleep Apnea","f":{"Meaning":"Breathing repeatedly stops during sleep.","Causes and risk factors":"Obesity, alcohol, nasal blockage, anatomy.","Symptoms to detect":"Loud snoring, gasping, morning headache, sleepiness.","Prevention and precautions":"Weight loss; avoid alcohol at night; side sleeping.","Natural support and how to use":"Weight-loss foods, saline rinse, avoiding late heavy meals.","Exercise if needed":"Daily walking and strength training.","When to seek medical care":"Untreated apnea raises heart and BP risk; get tested."}},{"title":"Chronic Stress","f":{"Meaning":"Ongoing pressure keeps the body in alarm mode.","Causes and risk factors":"Work, money, relationships, poor boundaries.","Symptoms to detect":"Tension, irritability, headaches, poor sleep.","Prevention and precautions":"Boundaries, breaks, exercise, social support.","Natural support and how to use":"4-7-8 breathing, journaling, chamomile or ginger tea, sunlight.","Exercise if needed":"Walk 20–30 minutes daily; yoga or stretching.","When to seek medical care":"Self-harm thoughts, panic attacks, or inability to function need urgent help."}},{"title":"Anxiety","f":{"Meaning":"Excessive worry, fear, or physical tension.","Causes and risk factors":"Stress, trauma, caffeine, poor sleep, genetics.","Symptoms to detect":"Racing heart, restlessness, muscle tension, panic.","Prevention and precautions":"Reduce caffeine; routine; slow breathing; support.","Natural support and how to use":"Chamomile tea, magnesium-rich foods, breathing exercises.","Exercise if needed":"Walking, yoga, swimming, gentle strength training.","When to seek medical care":"Panic attacks, chest pain, or inability to cope need professional care."}},{"title":"Depression","f":{"Meaning":"Persistent low mood and loss of interest.","Causes and risk factors":"Genetics, stress, isolation, illness, substance use.","Symptoms to detect":"Sadness, fatigue, sleep/appetite changes, withdrawal.","Prevention and precautions":"Routine, connection, sunlight, exercise, therapy.","Natural support and how to use":"Omega-3 fish, eggs, greens, regular meals, sunlight.","Exercise if needed":"Daily 20–30 minute walk; strength training twice weekly.","When to seek medical care":"Thoughts of self-harm or suicide require immediate emergency help."}},{"title":"Burnout","f":{"Meaning":"Exhaustion from prolonged stress without recovery.","Causes and risk factors":"Overwork, caregiving, poor boundaries.","Symptoms to detect":"Exhaustion, cynicism, poor performance, sleep problems.","Prevention and precautions":"Rest, boundaries, delegation, recovery days.","Natural support and how to use":"Hydration, regular meals, magnesium-rich foods, nature time.","Exercise if needed":"Light movement only during severe burnout.","When to seek medical care":"Persistent exhaustion or hopelessness needs support."}},{"title":"Alcohol Misuse","f":{"Meaning":"Drinking that harms health, work, or relationships.","Causes and risk factors":"Stress, addiction, social pressure.","Symptoms to detect":"Cravings, blackouts, tremors, conflict.","Prevention and precautions":"Alcohol-free days; avoid triggers; seek support.","Natural support and how to use":"Water, electrolytes, B-vitamin-rich foods; supervised withdrawal care.","Exercise if needed":"Walking and light strength work once stable.","When to seek medical care":"Tremors, seizures, confusion, or inability to stop need urgent care."}},{"ti , irritants, allergens, stress.","Symptoms to detect":"Dry patches, itching, redness, cracking.","Prevention and precautions":"Moisturize; avoid harsh soaps; identify triggers.","Natural support and how to use":"Colloidal oatmeal bath, coconut oil or aloe vera, omega-3 foods.","Exercise if needed":"Breathable clothing; avoid friction during flares.","When to seek medical care":"Oozing, pus, fever, or widespread rash needs care."}},{"title":"Psoriasis","f":{"Meaning":"Immune condition causing thick scaly skin patches.","Causes and risk factors":"Immune dysfunction, genetics, stress, smoking.","Symptoms to detect":"Red scaly patches, itching, joint pain.","Prevention and precautions":"Moisturize; reduce alcohol and smoking; manage stress.","Natural support and how to use":"Aloe vera, oatmeal baths, omega-3 fish, moderate sunlight.","Exercise if needed":"Low-impact exercise; protect joints.","When to seek medical care":"Joint pain or widespread flare needs medical care."}},{"title":"Fungal Skin Infection","f":{"Meaning":"Fungal growth causing itchy scaly patches.","Causes and risk factors":"Sweat, moisture, shared items, diabetes.","Symptoms to detect":"Itchy ring-like rash, peeling, discoloration.","Prevention and precautions":"Dry skin; avoid sharing towels; breathable clothes.","Natural support and how to use":"Antifungal cream as directed; diluted tea-tree oil.","Exercise if needed":"Avoid shared mats without towel; shower after workouts.","When to seek medical care":"Spreading rash, pus, or fever needs care."}},{"title":"Body Odor","f":{"Meaning":"Strong smell from sweat interacting with skin bacteria.","Causes and risk factors":"Sweat, hygiene, diet, stress.","Symptoms to detect":"Underarm, foot, or body odor.","Prevention and precautions":"Daily bathing; clean clothes; breathable fabrics.","Natural support and how to use":"Baking-soda paste briefly; diluted apple-cider vinegar rinse; tea-tree oil in wash.","Exercise if needed":"Regular exercise; shower afterward w to use":"Plain unsweetened yogurt or probiotic foods; coconut oil for external soothing.","Exercise if needed":"Gentle walking; avoid friction-heavy exercise.","When to seek medical care":"Fever, pelvic pain, sores, or recurrent infections need care."}},{"title":"Bacterial Vaginosis","f":{"Meaning":"Imbalance of vaginal bacteria causing odor and discharge.","Causes and risk factors":"Douching, new partners, pH changes.","Symptoms to detect":"Thin gray/white discharge, fishy odor.","Prevention and precautions":"Avoid douching and scented washes; safe sex.","Natural support and how to use":"Probiotic yogurt, kefir, fermented foods; warm-water cleansing only.","Exercise if needed":"General gentle activity.","When to seek medical care":"Persistent odor, pelvic pain, fever, or pregnancy needs care."}},{"title":"Toilet Infections","f":{"Meaning":"Infections picked up from contaminated toilets, water, or poor hygiene.","Causes and risk factors":"Poor hygiene, contaminated water, shared facilities, wet skin.","Symptoms to detect":"Itching, rash, odor, discharge, urinary symptoms.","Prevention and precautions":"Wash hands; use clean water; avoid sharing towels; keep skin dry.","Natural support and how to use":"Warm-water wash; probiotic foods; avoid harsh feminine products.","Exercise if needed":"General gentle activity.","When to seek medical care":"Fever, pelvic pain, blood in urine, or persistent symptoms need care."}},{"title":"Gonorrhea","f":{"Meaning":"Bacterial STI infecting genitals, throat, or rectum.","Causes and risk factors":"Unprotected sex.","Symptoms to detect":"Discharge, burning urination, pelvic/testicular pain, sometimes none.","Prevention and precautions":"Condoms; regular testing; mutual monogamy.","Natural support and how to use":"No home remedy replaces antibiotics; hydration and rest support recovery.","Exercise if needed":"Avoid sex until treated and cleared.","When to seek medical care":"Untreated infection can cause infertility; get tested and treated."}},{"title":"Chlamydia","f":{"Meaning":"Common bacterial STI often without symptoms.","Causes and risk factors":"Unprotected sex.","Symptoms to detect":"Discharge, burning urination, pelvic pain, or no symptoms.","Prevention and precautions":"Condoms and routine screening.","Natural support and how to use":"No home cure; complete prescribed antibiotics.","Exercise if needed":"Avoid sex until treatment is complete.","When to seek medical care":"Untreated chlamydia can damage fertility."}},{"title":"Syphilis","f":{"Meaning":"Bacterial STI that develops in stages if untreated.","Causes and risk factors":"Direct contact with a syphilis sore.","Symptoms to detect":"Painless sore, rash, fever, swollen glands.","Prevention and precautions":"Condoms and testing; treat partners.","Natural support and how to use":"No home remedy replaces prescribed antibiotics.","Exercise if needed":"Avoid sex until treated and cleared.","When to seek medical care":"Any genital sore or unexplained rash needs testing."}},{"title":"Genital Herpes","f":{"Meaning":"Viral STI causing painful blisters or sores.","Causes and risk factors":"Herpes simplex virus through skin contact.","Symptoms to detect":"Tingling, blisters, sores, flu-like symptoms.","Prevention and precautions":"Condoms reduce risk; avoid sex during outbreaks.","Natural support and how to use":"Keep sores clean and dry; cold compress; manage stress and sleep.","Exercise if needed":"Avoid sexual activity during active sores.","When to seek medical care":"First outbreak, severe pain, or frequent recurrences need care."}},{"title":"HIV","f":{"Meaning":"Virus that weakens the immune system if untreated.","Causes and risk factors":"Unprotected sex, sharing needles, blood exposure.","Symptoms to detect":"Early flu-like illness; later often no symptoms.","Prevention and precautions":"Condoms; no needle sharing; regular testing; prevention medication when indicated.","Natural support and how to use":"Healthy food, sleep, stress management support health but do not treat HIV.","Exercise if needed":"Moderate exercise supports immunity and mood.","When to seek medical care":"Test after exposure; modern treatment allows long healthy lives."}},{"title":"HPV and Genital Warts","f":{"Meaning":"Common viral infection that can cause warts and some cancers.","Causes and risk factors":"Skin-to-skin sexual contact.","Symptoms to detect":"Warts, itching, sometimes no symptoms.","Prevention and precautions":"HPV vaccination; condoms; screening.","Natural support and how to use":"Do not cut or burn warts; keep area clean and dry.","Exercise if needed":"Avoid friction until warts are treated.","When to seek medical care":"Persistent or bleeding warts need clinical treatment."}},{"title":"Trichomoniasis","f":{"Meaning":"Common parasitic STI causing vaginal or urethral irritation.","Causes and risk factors":"Unprotected sex.","Symptoms to detect":"Itching, frothy discharge, odor, burning urination.","Prevention and precautions":"Condoms; treat partners; regular testing.","Natural support and how to use":"No home remedy replaces prescribed treatment; hydration and gentle hygiene.","Exercise if needed":"Avoid sex until treated and cleared.","When to seek medical care":"Pregnancy symptoms or pelvic pain need prompt care."}},{"title":"Pubic Lice","f":{"Meaning":"Tiny parasites in pubic hair causing intense itching.","Causes and risk factors":"Close sexual or skin contact, shared bedding or clothing.","Symptoms to detect":"Itching, visible lice or eggs, skin irritation.","Prevention and precautions":"Avoid sharing bedding or clothing; wash items in hot water.","Natural support and how to use":"Approved lice treatment; wet-combing; wash bedding and clothes.","Exercise if needed":"Avoid close contact until treated.","When to seek medical care":"Skin infection or spreading rash needs care."}},{"title":"Scabies","f":{"Meaning":"Itchy rash caused by mites burrowing into skin.","Causes and risk factors":"Close skin contac ing, tiredness.","Prevention and precautions":"Sleep under treated mosquito nets; use repellent; remove stagnant water; screen windows.","Natural support and how to use":"Oral rehydration, light foods, and rest support recovery—but a child with suspected malaria needs a test and prescribed antimalarial medicine.","Exercise if needed":"Rest during illness; gentle play after recovery.","When to seek medical care":"Fever with convulsion, confusion, inability to drink, or fast breathing is an emergency."}},{"title":"Typhoid","f":{"Meaning":"A bacterial infection from contaminated food or water.","Causes and risk factors":"Unsafe water, poor sanitation, contaminated food.","Symptoms to detect":"Fever, weakness, stomach pain, poor appetite, constipation or diarrhea.","Prevention and precautions":"Safe drinking water, handwashing, washed fruits, properly cooked food.","Natural support and how to use":"Oral rehydration, rice, banana, toast, yogurt; complete prescribed antibiotics exactly.","Exercise if needed":"Bed rest during illness; gentle activity after recovery.","When to seek medical care":"Severe belly pain, confusion, persistent high fever, or dehydration needs urgent care."}},{"title":"Common Cold","f":{"Meaning":"A mild viral infection of the nose and throat.","Causes and risk factors":"Viruses spread through droplets and touched surfaces.","Symptoms to detect":"Runny nose, sneezing, mild cough, sore throat, low fever.","Prevention and precautions":"Handwashing; avoid close contact with sick people; clean toys; balanced meals.","Natural support and how to use":"Warm fluids, honey only for children over 1 year, saline nose drops, rest.","Exercise if needed":"Rest and gentle play.","When to seek medical care":"Trouble breathing, high fever, dehydration, or symptoms beyond 10 days need medical review."}},{"title":"Cough","f":{"Meaning":"A reflex that clears the airways of mucus or irritation.","Causes and risk factors":"Cold, flu, asthma, allergies, smoke, postnasal eze, cough, chest tightness, breathlessness, night cough.","Prevention and precautions":"Avoid smoke and triggers; follow prescribed inhaler plan; regular checkups.","Natural support and how to use":"Warm fluids; avoid known triggers; use reliever inhaler exactly as prescribed.","Exercise if needed":"Swimming, walking, and controlled exercise with an asthma action plan.","When to seek medical care":"Severe breathlessness, blue lips, or no relief from inhaler is an emergency."}},{"title":"Allergies","f":{"Meaning":"Immune overreaction to substances such as dust, food, or pollen.","Causes and risk factors":"Genetics, dust mites, pollen, pet dander, certain foods.","Symptoms to detect":"Sneezing, itchy eyes, rash, cough, stomach upset.","Prevention and precautions":"Reduce dust; wash bedding; identify food triggers; keep pets out of bedrooms.","Natural support and how to use":"Saline nasal rinse for older children; vitamin-C-rich fruits; avoid known triggers.","Exercise if needed":"Outdoor activity may need adjustment during high-pollen periods.","When to seek medical care":"Facial swelling, trouble breathing, or collapse after exposure is an emergency."}},{"title":"Ear Infection","f":{"Meaning":"Infection or fluid buildup behind the eardrum.","Causes and risk factors":"Colds, fluid buildup, allergies, bottle-feeding while lying down.","Symptoms to detect":"Ear pain, pulling at ear, fever, poor sleep, reduced hearing.","Prevention and precautions":"Treat colds early; avoid smoke; breastfeed where possible; keep ears dry.","Natural support and how to use":"Warm compress over the ear; rest and fluids; do not put oil, sticks, or objects into the ear.","Exercise if needed":"Rest; avoid swimming until healed.","When to seek medical care":"Severe pain, discharge, swelling behind the ear, or hearing loss needs prompt care."}},{"title":"Sore Throat","f":{"Meaning":"Pain or irritation in the throat.","Causes and risk factors":"Viruses, bacteria, dry air, shouting, allergies."," t loss, tiredness.","Prevention and precautions":"Handwashing; wear footwear outdoors; wash fruits; deworm as advised by a clinician.","Natural support and how to use":"Pumpkin seeds and papaya are traditional foods but do not replace prescribed deworming medicine.","Exercise if needed":"Outdoor play with footwear; hand hygiene before meals.","When to seek medical care":"Severe belly pain, vomiting worms, or poor growth needs medical assessment."}},{"title":"Food Poisoning","f":{"Meaning":"Illness from contaminated or improperly stored food.","Causes and risk factors":"Bacteria, viruses, toxins, undercooked food, poor hygiene.","Symptoms to detect":"Vomiting, diarrhea, stomach cramps, fever, weakness.","Prevention and precautions":"Wash hands; cook food thoroughly; refrigerate leftovers; avoid expired food.","Natural support and how to use":"Oral rehydration solution; rice, banana, toast; ginger may soothe nausea in older children.","Exercise if needed":"Rest until recovered.","When to seek medical care":"Blood in stool, high fever, confusion, or inability to keep fluids down is urgent."}},{"title":"Dehydration","f":{"Meaning":"The body loses more fluid than it takes in.","Causes and risk factors":"Diarrhea, vomiting, fever, heat, poor fluid intake.","Symptoms to detect":"Thirst, dry mouth, dark urine, sunken eyes, tiredness.","Prevention and precautions":"Offer fluids regularly; increase fluids during illness and heat.","Natural support and how to use":"Oral rehydration solution, coconut water in small amounts, water-rich fruits.","Exercise if needed":"Rest; avoid vigorous play until rehydrated.","When to seek medical care":"No urination, sunken eyes, rapid heartbeat, confusion, or fainting is an emergency."}},{"title":"Malnutrition","f":{"Meaning":"Insufficient nutrients for normal growth and development.","Causes and risk factors":"Poverty, poor diet, repeated infections, poor feeding practices.","Symptoms to detect":"Poor weight gain, thinness, swelling, tiredness, frequent illness.","Prevention and precautions":"Breastfeeding, balanced family foods, regular meals, deworming and immunization.","Natural support and how to use":"Protein-rich beans, eggs, fish, groundnuts, fruits, vegetables; seek nutrition support for severe cases.","Exercise if needed":"Age-appropriate active play once nutrition improves.","When to seek medical care":"Swelling, lethargy, rapid weight loss, or inability to feed needs urgent care."}},{"title":"Underweight","f":{"Meaning":"A child weighs less than expected for age and height.","Causes and risk factors":"Low food intake, illness, worms, malabsorption, stress.","Symptoms to detect":"Thin appearance, low energy, frequent illness, poor growth.","Prevention and precautions":"Regular balanced meals; treat infections; monitor growth chart.","Natural support and how to use":"Eggs, beans, fish, milk, groundnuts, avocado, fruits; add healthy calories gradually.","Exercise if needed":"Active play to build appetite and muscle.","When to seek medical care":"No weight gain despite feeding or rapid weight loss needs clinical review."}},{"title":"Childhood Obesity","f":{"Meaning":"Excess body fat that affects health and confidence.","Causes and risk factors":"Sugary drinks, processed foods, inactivity, poor sleep, screen time.","Symptoms to detect":"Weight gain, breathlessness, joint pain, low confidence, snoring.","Prevention and precautions":"Family meals, water instead of soda, daily play, limited screens, adequate sleep.","Natural support and how to use":"Fruits, vegetables, beans, whole grains; avoid restrictive dieting in children.","Exercise if needed":"Active play, walking, cycling, swimming, and family walks.","When to seek medical care":"Rapid weight gain, snoring with breathing pauses, or high BP needs assessment."}},{"title":"Rickets","f":{"Meaning":"Soft or weak bones caused by vitamin D and calcium deficiency.","Causes and risk factors":"Low sunlight, poor diet, malabsorption, some kidney conditions.","Symptoms to detect":"Bone pain, delayed walking, bowed legs, delayed growth.","Prevention and precautions":"Sunlight, vitamin-D-rich foods, balanced diet, follow supplementation advice.","Natural support and how to use":"Sunlight exposure, eggs, fish, fortified milk, leafy greens; clinician-guided vitamin D.","Exercise if needed":"Gentle active play; avoid weight-bearing stress if bones are painful.","When to seek medical care":"Bone deformity, fractures, or severe pain needs medical assessment."}},{"title":"Iron-Deficiency Anemia","f":{"Meaning":"Low iron reduces oxygen delivery in the blood.","Causes and risk factors":"Poor diet, worms, heavy periods in teens, poor absorption.","Symptoms to detect":"Pale skin, tiredness, breathlessness, poor concentration, fast heartbeat.","Prevention and precautions":"Iron-rich meals with vitamin C; treat worms; regular growth monitoring.","Natural support and how to use":"Beans, liver, red meat, spinach, pumpkin seeds, oranges; avoid tea with meals.","Exercise if needed":"Play and light activity; avoid intense sports while symptomatic.","When to seek medical care":"Fainting, chest pain, or severe breathlessness is urgent."}},{"title":"Vitamin A Deficiency","f":{"Meaning":"Low vitamin A affects vision, immunity, and skin health.","Causes and risk factors":"Poor diet, malabsorption, repeated infections.","Symptoms to detect":"Night blindness, dry eyes, frequent infections, poor growth.","Prevention and precautions":"Breastfeeding, colorful fruits and vegetables, regular health checks.","Natural support and how to use":"Carrots, mango, pawpaw, sweet potatoes, dark leafy greens, eggs, liver.","Exercise if needed":"Active play supports overall development.","When to seek medical care":"Night blindness, corneal cloudiness, or frequent severe infections needs urgent care."}},{"title":"Zinc Deficiency","f":{"Meaning":"Low zinc affects growth, immunity, taste, and wound healing.","Causes and risk factors":"Poor diet, diarrhea, malabsorption, low animal-food intake.","Symptoms to detect":"Slow growth, frequent infections, poor appetite, slow wound healing.","Prevention and precautions":"Balanced diet; treat diarrhea promptly; follow supplementation advice.","Natural support and how to use":"Beans, meat, fish, eggs, pumpkin seeds, nuts, whole grains.","Exercise if needed":"Active play and age-appropriate sports.","When to seek medical care":"Persistent poor growth or recurrent infections needs assessment."}},{"title":"Tooth Decay","f":{"Meaning":"Damage to teeth caused by plaque, sugar, and poor oral care.","Causes and risk factors":"Sugary drinks, frequent snacking, poor brushing, bottle at bedtime.","Symptoms to detect":"Tooth pain, dark spots, sensitivity, bad breath, visible holes.","Prevention and precautions":"Brush twice daily with fluoride toothpaste; limit sugar; dental visits.","Natural support and how to use":"Water after meals; xylitol-free oral care; avoid sticky sweets; rinse after meals.","Exercise if needed":"Active play is fine; protect teeth during sports.","When to seek medical care":"Facial swelling, fever, or severe tooth pain needs urgent dental care."}},{"title":"Teething Pain","f":{"Meaning":"Discomfort as baby teeth emerge, usually from 6 months.","Causes and risk factors":"Natural tooth eruption, gum pressure.","Symptoms to detect":"Drooling, chewing, sore gums, mild fussiness.","Prevention and precautions":"Clean teething toys; gentle gum massage; avoid sugary foods.","Natural support and how to use":"Chilled teething ring; clean cold spoon; breast milk or formula; avoid numbing gels unless advised.","Exercise if needed":"Gentle play and comfort.","When to seek medical care":"High fever, diarrhea, or severe distress is not normal teething and needs review."}},{"title":"Mouth Ulcers","f":{"Meaning":"Painful sores inside the mouth.","Causes and risk factors":"Minor injury, stress, vitamin deficiency, viral infection, irritation.","Symptoms to detect":"Painful white or yellow sores, difficulty eating, drooling in young children.","Prevention and precautions":"Soft toothbrush; avoid acidic or spicy foods; balanced diet.","Natural support and how to use":"Rinse with warm salt water for older children; honey over age 1; yogurt and soft foods.","Exercise if needed":"Rest and normal play as tolerated.","When to seek medical care":"Large sores, fever, dehydration, or sores lasting over 2 weeks need care."}},{"title":"Oral Thrush","f":{"Meaning":"Yeast infection in the mouth, common in babies.","Causes and risk factors":"Antibiotics, weak immunity, pacifiers, poor sterilization.","Symptoms to detect":"White patches in mouth, fussiness, feeding difficulty.","Prevention and precautions":"Sterilize bottles and pacifiers; treat nipple thrush; complete prescribed medicine.","Natural support and how to use":"Gentle cleaning with clean water; probiotic foods for older children; avoid wiping patches forcefully.","Exercise if needed":"Normal gentle activity.","When to seek medical care":"Feeding refusal, dehydration, or spreading infection needs care."}},{"title":"Hand-Foot-Mouth Disease","f":{"Meaning":"A contagious viral illness causing sores on the mouth, hands, and feet.","Causes and risk factors":"Coxsackievirus spread through saliva, stool, and surfaces.","Symptoms to detect":"Fever, mouth sores, rash or blisters on hands and feet.","Prevention and precautions":"Handwashing; disinfect toys; keep sick children home; avoid sharing cups.","Natural support and how to use":"Cool fluids, soft foods, cold foods like yogurt; avoid acidic or salty foods.","Exercise if needed":"Rest until fever and sores improve.","When to seek medical care":"Dehydration, high fever, stiff neck, or unusual sleepiness needs urgent care."}},{"title":"Chickenpox","f":{"Meaning":"A contagious viral infection causing itchy blisters.","Causes and risk factors":"Varicella-zoster virus spread through air and contact.","Symptoms to detect":"Itchy blisters, fever, tiredness, loss of appetite.","Prevention and precautions":"Vaccination where available; isolate until blisters crust; avoid scratching.","Natural support and how to use":"Cool oatmeal baths; calamine lotion; loose cotton clothes; trim nails.","Exercise if needed":"Rest until blisters crust.","When to seek medical care":"Blisters in the eye, trouble breathing, confusion, or severe rash needs urgent care."}},{"title":"Measles","f":{"Meaning":"A highly contagious viral infection with rash and fever.","Causes and risk factors":"Measles virus spread through airborne droplets.","Symptoms to detect":"Fever, cough, runny nose, red eyes, rash starting on the face.","Prevention and precautions":"MMR vaccination; isolate suspected cases; vitamin A as advised by clinicians.","Natural support and how to use":"Rest, fluids, vitamin-A-rich foods when advised, soft foods, humidified air.","Exercise if needed":"Rest during illness.","When to seek medical care":"Breathing difficulty, dehydration, ear pain, or confusion is urgent."}},{"title":"Mumps","f":{"Meaning":"A viral infection causing swelling of the salivary glands.","Causes and risk factors":"Mumps virus spread through saliva and droplets.","Symptoms to detect":"Swollen cheeks, jaw pain, fever, headache, difficulty chewing.","Prevention and precautions":"MMR vaccination; avoid sharing cups; isolate suspected cases.","Natural support and how to use":"Soft foods, cool compress on swollen cheeks, fluids, rest.","Exercise if needed":"Rest until swelling settles.","When to seek medical care":"Testicular pain, severe headache, stiff neck, or hearing change needs urgent care."}},{"title":"Rubella","f":{"Meaning":"A mild viral infection that can be serious in pregnancy.","Causes and risk factors":"Rubella virus spread through droplets.","Symptoms to detect":"Mild fever, rash, swollen glands, joint pain.","Prevention and precautions":"MMR vaccination; avoid exposure for pregnant women.","Natural support and how to use":"Rest, fluids, light meals; medical advice for pregnant contacts.","Exercise if needed":"Rest during illness.","When to seek medical care":"Rash with joint pain, severe headache, or pregnancy exposure needs medical advice."}},{"title":"Whooping Cough","f":{"Meaning":"A bacterial respiratory infection causing severe coughing fits.","Causes and risk factors":"Bordetella pertussis spread through droplets.","Symptoms to detect":"Long coughing fits, whooping sound, vomiting after cough, breathing difficulty.","Prevention and precautions":"Pertussis vaccination; avoid contact with infected people; treat early.","Natural support and how to use":"Warm fluids, small frequent meals, humidified air; antibiotics as prescribed.","Exercise if needed":"Rest; avoid exertion during coughing fits.","When to seek medical care":"Blue lips, pauses in breathing, or difficulty feeding is an emergency."}},{"title":"Croup","f":{"Meaning":"A viral infection causing a barking cough and noisy breathing in young children.","Causes and risk factors":"Parainfluenza and other respiratory viruses.","Symptoms to detect":"Barking cough, hoarse voice, noisy breathing, fever.","Prevention and precautions":"Handwashing; avoid smoke; manage colds early.","Natural support and how to use":"Humidified air or steamy bathroom; warm fluids; calm the child.","Exercise if needed":"Rest and quiet play.","When to seek medical care":"Noisy breathing at rest, drooling, blue lips, or severe struggle to breathe is an emergency."}},{"title":"Roseola","f":{"Meaning":"A mild viral illness common in babies and toddlers.","Causes and risk factors":"Human herpesvirus 6 or 7.","Symptoms to detect":"High fever followed by rash after fever settles.","Prevention and precautions":"Handwashing; avoid sharing cups; rest and fluids.","Natural support and how to use":"Lukewarm sponge; fluids; light clothing; paracetamol only at correct child dose.","Exercise if needed":"Rest and gentle play after recovery.","When to seek medical care":"Seizure, stiff neck, dehydration, or fever lasting more than 3 days needs care."}},{"title":"Scarlet Fever","f":{"Meaning":"A bacterial infection producing a fine red rash, often with strep throat.","Causes and risk factors":"Streptococcal bacteria.","Symptoms to detect":"Fever, sore throat, red rash, strawberry-like tongue.","Prevention and precautions":"Handwashing; avoid sharing utensils; treat strep throat early.","Natural support and how to use":"Warm fluids, soft foods, honey over age 1; complete prescribed antibiotics.","Exercise if needed":"Rest until fever settles.","When to seek medical care":"Rash with difficulty breathing, swelling, or no improvement needs urgent care."}},{"title":"Impetigo","f":{"Meaning":"A contagious bacterial skin infection causing sores and crusts.","Causes and risk factors":"Staph or strep bacteria entering broken skin.","Symptoms to detect":"Red sores, honey-colored crusts, itching, usually around nose and mouth.","Prevention and precautions":"Keep skin clean; avoid sharing towels; trim nails; treat insect bites.","Natural support and how to use":"Gently clean with soap and water; warm compress; prescribed antibiotic cream when advised.","Exercise if needed":"Avoid contact sports until sores heal.","When to seek medical care":"Spreading redness, fever, or painful swelling needs medical care."}},{"title":"Ringworm","f":{"Meaning":"A fungal infection causing itchy ring-shaped patches.","Causes and risk factors":"Fungus from people, pets, shared items, damp skin.","Symptoms to detect":"Round itchy patch with clear center, scaly edges, hair loss in patches.","Prevention and precautions":"Do not share combs or towels; dry skin fully; treat pets if infected.","Natural support and how to use":"Antifungal cream as directed; keep area clean and dry; avoid sharing hats and combs.","Exercise if needed":"Avoid shared mats; shower after sports.","When to seek medical care":"Spreading rash, pus, or scalp involvement needs medical care."}},{"title":"Scabies","f":{"Meaning":"Itchy skin rash caused by tiny mites that burrow into skin.","Causes and risk factors":"Close skin contact, shared bedding or clothing.","Symptoms to detect":"Intense itching, especially at night; rash between fingers, wrists, waist.","Prevention and precautions":"Wash bedding and clothes in hot water; treat all close contacts; avoid sharing items.","Natural support and how to use":"Prescribed scabies treatment for the whole household; cool compress for itching.","Exercise if needed":"Avoid close contact until treated.","When to seek medical care":"Infected sores, fever, or widespread rash needs medical care."}},{"title":"Head Lice","f":{"Meaning":"Tiny insects that live on the scalp and cause itching.","Causes and risk factors":"Head-to-head contact, shared combs, hats, or pillows.","Symptoms to detect":"Itchy scalp, nits on hair shafts, scratch marks.","Prevention and precautions":"Avoid sharing combs and hats; check hair regularly; tie long hair.","Natural support and how to use":"Wet-combing with conditioner; wash bedding in hot water; use approved lice treatment as directed.","Exercise if needed":"Normal play; avoid head-to-head contact until treated.","When to seek medical care":"Scalp infection, swollen glands, or persistent lice needs care."}},{"title":"Diaper Rash","f":{"Meaning":"Irritation of the skin under a diaper.","Causes and risk factors":"Wetness, friction, diarrhea, yeast, new products.","Symptoms to detect":"Redness, bumps, soreness, crying during diaper changes.","Prevention and precautions":"Change diapers promptly; air-dry; use barrier cream; avoid scented wipes.","Natural support and how to use":"Warm water cleansing; zinc-oxide barrier cream; gentle pat-drying; loose diapers.","Exercise if needed":"Normal play and movement.","When to seek medical care":"Pus, fever, blisters, or rash spreading beyond the diaper area needs care."}},{"title":"Eczema","f":{"Meaning":"Chronic itchy, dry, inflamed skin.","Causes and risk factors":"Genetics, allergens, soaps, heat, stress, dry skin.","Symptoms to detect":"Dry patches, itching, redness, scratching, sleep disturbance.","Prevention and precautions":"Fragrance-free moisturizer; short lukewarm baths; avoid triggers; cotton clothing.","Natural support and how to use":"Colloidal oatmeal bath; fragrance-free moisturizer after bathing; coconut oil on mild dry areas.","Exercise if needed":"Comfortable play; avoid overheating during exercise.","When to seek medical care":"Oozing, pus, fever, or widespread rash needs medical care."}},{"title":"Cradle Cap","f":{"Meaning":"Greasy, scaly patches on a baby’s scalp.","Causes and risk factors":"Natural oil production, yeast, family tendency.","Symptoms to detect":"Yellow scales, flaking, mild redness on scalp.","Prevention and precautions":"Gentle washing; avoid picking; soft brush after softening scales.","Natural support and how to use":"Baby oil or mineral oil to soften scales before gentle washing; avoid harsh shampoos.","Exercise if needed":"Normal gentle handling and play.","When to seek medical care":"Redness, swelling, pus, or spreading rash needs care."}},{"title":"Heat Rash","f":{"Meaning":"Blocked sweat ducts causing tiny itchy bumps in hot weather.","Causes and risk factors":"Heat, humidity, overdressing, sweat.","Symptoms to detect":"Tiny red bumps, itching, prickling sensation.","Prevention and precautions":"Light clothing; cool environment; avoid overheating.","Natural support and how to use":"Cool bath; calamine lotion; cotton clothing; keep skin dry.","Exercise if needed":"Indoor play during extreme heat.","When to seek medical care":"Fever, pus, or heatstroke signs need urgent care."}},{"title":"Insect Bites","f":{"Meaning":"Skin reaction to mosquito, ant, or other insect bites.","Causes and risk factors":"Insect exposure outdoors, standing water, uncovered skin.","Symptoms to detect":"Itchy red bumps, swelling, sometimes pain.","Prevention and precautions":"Mosquito nets; repellent suitable for age; protective clothing; remove stagnant water.","Natural support and how to use":"Cold compress; calamine lotion; avoid scratching; antihistamine only if advised.","Exercise if needed":"Outdoor play with protection.","When to seek medical care":"Difficulty breathing, facial swelling, or widespread rash is an emergency."}},{"title":"Minor Burns","f":{"Meaning":"Damage to skin from heat, hot liquids, or friction.","Causes and risk factors":"Hot water, cooking, irons, flames, chemicals.","Symptoms to detect":"Redness, pain, blisters, peeling.","Prevention and precautions":"Keep hot items away; supervise cooking; test bath water; use smoke alarms.","Natural support and how to use":"Run cool water over the burn for 10–20 minutes; cover loosely with clean cloth; do not apply toothpaste, oil, or ice.","Exercise if needed":"Avoid pressure on the burn; gentle movement as healing allows.","When to seek medical care":"Large burns, face burns, white/charred skin, or breathing difficulty is an emergency."}},{"title":"Cuts and Wounds","f":{"Meaning":"Breaks in the skin from sharp objects or falls.","Causes and risk factors":"Falls, knives, glass, playground injuries.","Symptoms to detect":"Bleeding, pain, open skin, swelling.","Prevention and precautions":"Supervise play; store sharp objects safely; use protective gear.","Natural support and how to use":"Wash hands; clean with running water; apply gentle pressure; cover with clean dressing; do not use unclean substances.","Exercise if needed":"Avoid pressure on the wound; gentle movement as healing allows.","When to seek medical care":"Heavy bleeding, deep wound, dirty wound, or tetanus risk needs urgent care."}},{"title":"Nosebleeds","f":{"Meaning":"Bleeding from the nose, often from dryness or minor injury.","Causes and risk factors":"Nose picking, dry air, colds, allergy, injury.","Symptoms to detect":"Blood from one or both nostrils, swallowing blood, coughing.","Prevention and precautions":"Humidify air; keep nails short; treat allergies; avoid nose picking.","Natural support and how to use":"Sit upright, lean slightly forward, pinch the soft part of the nose for 10 minutes; cold compress on the bridge.","Exercise if needed":"Avoid strenuous play immediately after a nosebleed.","When to seek medical care":"Bleeding over 20 minutes, frequent bleeds, or after head injury needs urgent care."}},{"title":"Bruises","f":{"Meaning":"Discoloration from small blood vessels breaking under the skin.","Causes and risk factors":"Falls, bumps, sports, rough play.","Symptoms to detect":"Blue-purple mark, tenderness, swelling.","Prevention and precautions":"Childproof the home; supervise play; use protective gear.","Natural support and how to use":"Cold compress for 10–15 minutes in the first day; rest the area.","Exercise if needed":"Gentle movement once pain reduces.","When to seek medical care":"Unexplained bruises, bruises in unusual places, or severe swelling needs assessment."}},{"title":"Sprains and Strains","f":{"Meaning":"Injury to ligaments or muscles around a joint.","Causes and risk factors":"Falls, twisting, sports, poor warm-up.","Symptoms to detect":"Pain, swelling, bruising, reduced movement.","Prevention and precautions":"Warm up; proper footwear; supervise play; strengthen muscles.","Natural support and how to use":"RICE: rest, ice wrapped in cloth, compression, elevation for the first 48 hours.","Exercise if needed":"Gentle range-of-motion work after acute pain settles.","When to seek medical care":"Deformity, inability to bear weight, or numbness needs urgent care."}},{"title":"Fractures","f":{"Meaning":"A break or crack in a bone.","Causes and risk factors":"Falls, sports, accidents, weak bones.","Symptoms to detect":"Severe pain, swelling, deformity, inability to move or bear weight.","Prevention and precautions":"Supervision; protective gear; safe playgrounds; calcium and vitamin D.","Natural support and how to use":"Do not try to straighten or set a bone; immobilize gently and seek care.","Exercise if needed":"Avoid using the injured limb until assessed.","When to seek medical care":"Visible deformity, open wound, numbness, or severe pain is an emergency."}},{"title":"Growing Pains","f":{"Meaning":"Aching legs in children, often at night, without injury.","Causes and risk factors":"Rapid growth, activity, muscle fatigue, genetics.","Symptoms to detect":"Aching thighs or calves at night, no swelling or fever.","Prevention and precautions":"Balanced diet; regular gentle activity; consistent bedtime routine.","Natural support and how to use":"Warm bath, gentle leg massage, stretching, magnesium-rich foods like bananas and nuts.","Exercise if needed":"Moderate play; gentle stretching before bed.","When to seek medical care":"Fever, swelling, limping, one-sided severe pain, or daytime pain needs assessment."}},{"title":"Flat Feet","f":{"Meaning":"Low or absent arches in the feet.","Causes and risk factors":"Genetics, loose ligaments, muscle weakness, sometimes normal in young children.","Symptoms to detect":"Feet appear flat, foot fatigue, pain after activity.","Prevention and precautions":"Supportive shoes; avoid prolonged standing; monitor development.","Natural support and how to use":"Toe curls, towel scrunches, calf stretches, balance games.","Exercise if needed":"Swimming, cycling, and supervised balance activities.","When to seek medical care":"Pain, limping, or worsening foot shape needs podiatry review."}},{"title":"Knock Knees","f":{"Meaning":"Knees touch while ankles remain apart when standing.","Causes and risk factors":"Normal growth phase, vitamin D deficiency, genetics, some conditions.","Symptoms to detect":"Knees touch when standing, walking pattern changes.","Prevention and precautions":"Balanced nutrition; vitamin D; regular checkups; supportive footwear.","Natural support and how to use":"Vitamin-D-rich foods, sunlight, gentle leg strengthening as advised.","Exercise if needed":"Cycling, swimming, and supervised balance play.","When to seek medical care":"Pain, limping, or asymmetry needs orthopedic assessment."}},{"title":"Bowed Legs","f":{"Meaning":"Legs curve outward at the knees.","Causes and risk factors":"Normal in infants, vitamin D deficiency, rickets, bone conditions.","Symptoms to detect":"Visible outward curve, wide gap between knees.","Prevention and precautions":"Vitamin D and calcium; regular growth monitoring.","Natural support and how to use":"Sunlight, eggs, fish, fortified milk, leafy greens; clinician-guided vitamin D.","Exercise if needed":"Gentle play; avoid forced standing exercises.","When to seek medical care":"Progressive bowing, pain, or short stature needs orthopedic assessment."}},{"title":"Scoliosis","f":{"Meaning":"Sideways curvature of the spine.","Causes and risk factors":"Unknown causes, genetics, uneven growth, neuromuscular conditions.","Symptoms to detect":"Uneven shoulders or hips, visible curve, back pain, clothes hanging unevenly.","Prevention and precautions":"Regular posture checks during growth; strengthen back and core; early screening.","Natural support and how to use":"Balanced diet with calcium and vitamin D; posture awareness.","Exercise if needed":"Swimming, core strengthening, and posture exercises as advised.","When to seek medical care":"Rapid curve progression, pain, or breathing difficulty needs specialist care."}},{"title":"Poor Posture","f":{"Meaning":"Slouched or misaligned body position.","Causes and risk factors":"Screens, heavy bags, weak muscles, long sitting.","Symptoms to detect":"Rounded shoulders, neck pain, back pain, headaches.","Prevention and precautions":"Light school bags; ergonomic desk; breaks from sitting; strengthen core.","Natural support and how to use":"Water, magnesium-rich foods, heat for tight muscles.","Exercise if needed":"Wall angels, planks, rows, chin tucks, and stretching.","When to seek medical care":"Numbness, weakness, or pain down the arms or legs needs assessment."}},{"title":"Bedwetting","f":{"Meaning":"Involuntary urination during sleep in children.","Causes and risk factors":"Deep sleep, small bladder, constipation, stress, family history, rarely health issues.","Symptoms to detect":"Waking with wet bedding, embarrassment, sleep disruption.","Prevention and precautions":"Regular toilet routine; limit evening drinks; reward dry nights; treat constipation.","Natural support and how to use":"Avoid punishment; warm encouragement; high-fiber diet to prevent constipation.","Exercise if needed":"Daytime active play and pelvic-floor awareness games for older children.","When to seek medical care":"Sudden bedwetting after being dry, pain, or excessive thirst needs medical review."}},{"title":"Soiling","f":{"Meaning":"Passing stool in underwear after toilet training age.","Causes and risk factors":"Constipation with overflow, withholding stool, stress, developmental issues.","Symptoms to detect":"Stool in underwear, belly pain, poor appetite, withholding.","Prevention and precautions":"Fiber, water, regular toilet time, positive reinforcement, medical support.","Natural support and how to use":"Papaya, prunes, oats, beans, water; avoid shaming the child.","Exercise if needed":"Active play and regular movement.","When to seek medical care":"Sudden soiling, severe pain, vomiting, or blood in stool needs assessment."}},{"title":"ADHD","f":{"Meaning":"A neurodevelopmental condition affecting attention, activity, and impulse control.","Causes and risk factors":"Genetics, brain development, prenatal factors, environment.","Symptoms to detect":"Difficulty focusing, hyperactivity, impulsiveness, forgetfulness.","Prevention and precautions":"Routine, clear instructions, sleep, physical activity, professional assessment.","Natural support and how to use":"Balanced meals, omega-3-rich fish, regular sleep; avoid unproven elimination diets without guidance.","Exercise if needed":"Sports, martial arts, swimming, and structured active play.","When to seek medical care":"Symptoms affecting school, safety, or relationships need professional evaluation."}},{"title":"Autism Support Needs","f":{"Meaning":"A neurodevelopmental difference affecting communication, social interaction, and behavior.","Causes and risk factors":"Genetics and brain-development differences.","Symptoms to detect":"Delayed speech, limited eye contact, repetitive behaviors, strong routines.","Prevention and precautions":"Early developmental screening; supportive routines; speech and occupational therapy where available.","Natural support and how to use":"Balanced nutrition, regular meals, sleep routine; avoid unproven miracle treatments.","Exercise if needed":"Sensory-friendly play, swimming, walking, and structured movement.","When to seek medical care":"Loss of skills, severe distress, or safety concerns needs professional support."}},{"title":"Childhood Anxiety","f":{"Meaning":"Excessive worry or fear that affects daily life.","Causes and risk factors":"Temperament, stress, family changes, school pressure, trauma.","Symptoms to detect":"Worry, stomachaches, avoidance, sleep problems, clinginess.","Prevention and precautions":"Predictable routines; listening; gradual exposure; limit frightening content.","Natural support and how to use":"Warm milk, balanced meals, breathing games, regular sleep.","Exercise if needed":"Play, sports, yoga, and outdoor activities.","When to seek medical care":"Panic attacks, refusal to attend school, or self-harm thoughts need professional help."}},{"title":"Childhood Depression","f":{"Meaning":"Persistent sadness or loss of interest in children and teens.","Causes and risk factors":"Genetics, bullying, trauma, chronic illness, family stress.","Symptoms to detect":"Sadness, withdrawal, irritability, sleep or appetite changes, poor school performance.","Prevention and precautions":"Connection, routine, open communication, counseling, healthy sleep.","Natural support and how to use":"Regular meals, omega-3 fish, sunlight, hydration.","Exercise if needed":"Daily walks, team sports, and enjoyable movement.","When to seek medical care":"Talk of self-harm or suicide requires immediate emergency help."}},{"title":"Bullying Stress","f":{"Meaning":"Emotional harm from repeated intimidation or exclusion.","Causes and risk factors":"School or online bullying, peer pressure, social exclusion.","Symptoms to detect":"Fear of school, withdrawal, poor sleep, low confidence, stomachaches.","Prevention and precautions":"Open communication; school involvement; teach assertiveness; monitor online activity.","Natural support and how to use":"Balanced meals, sleep, journaling, trusted adult conversations.","Exercise if needed":"Team sports, martial arts with supervision, and confidence-building activities.","When to seek medical care":"Self-harm thoughts, severe anxiety, or refusal to attend school needs urgent support."}},{"title":"Sleep Problems","f":{"Meaning":"Difficulty falling asleep or staying asleep.","Causes and risk factors":"Screens, caffeine, irregular routine, stress, sleep apnea.","Symptoms to detect":"Trouble sleeping, daytime tiredness, irritability.","Prevention and precautions":"Consistent bedtime; no screens before bed; dark quiet room.","Natural support and how to use":"Warm milk, banana, chamomile tea for older children, breathing exercises.","Exercise if needed":"Daytime outdoor play and regular activity; avoid late intense exercise.","When to seek medical care":"Loud snoring, breathing pauses, or severe daytime sleepiness needs assessment."}},{"title":"Nightmares","f":{"Meaning":"Frightening dreams that wake a child during sleep.","Causes and risk factors":"Stress, scary media, fever, irregular sleep, trauma.","Symptoms to detect":"Waking scared, crying, fear of sleeping, poor sleep.","Prevention and precautions":"Calm bedtime routine; avoid scary content; comfort and reassurance.","Natural support and how to use":"Warm milk; calming story; nightlight; consistent bedtime.","Exercise if needed":"Daytime active play; avoid stimulating activities before bed.","When to seek medical care":"Frequent nightmares, daytime fear, or trauma signs need professional support."}},{"title":"Screen Overuse","f":{"Meaning":"Excessive phone, TV, or gaming time that displaces sleep and activity.","Causes and risk factors":"Easy access, boredom, social pressure, poor boundaries.","Symptoms to detect":"Eye strain, poor sleep, irritability, reduced play, declining grades.","Prevention and precautions":"Set time limits; screen-free meals; no screens before bed; offline hobbies.","Natural support and how to use":"Blue-light reduction, hydration, regular meals, outdoor time.","Exercise if needed":"Outdoor play, sports, cycling, and family walks.","When to seek medical care":"If school, sleep, or relationships are badly affected, seek behavioral support."}},{"title":"Poor Appetite","f":{"Meaning":"Reduced interest in eating.","Causes and risk factors":"Illness, stress, teething, distraction, iron deficiency, excessive snacks.","Symptoms to detect":"Eating little, weight concerns, tiredness, mealtime battles.","Prevention and precautions":"Regular meal schedule; limit juice and snacks; family meals; pleasant eating environment.","Natural support and how to use":"Small frequent nutrient-dense meals; eggs, beans, avocado, fruit; avoid forcing food.","Exercise if needed":"Active play before meals can support appetite.","When to seek medical care":"Weight loss, lethargy, or signs of illness need assessment."}},{"title":"Picky Eating","f":{"Meaning":"Limited food acceptance or refusal of new foods.","Causes and risk factors":"Temperament, texture sensitivity, learned habits, pressure at meals.","Symptoms to detect":"Refusing vegetables or new foods, limited diet, mealtime conflict.","Prevention and precautions":"Offer foods repeatedly without pressure; involve the child in cooking; model eating.","Natural support and how to use":"Smoothies with fruits and vegetables; fun shapes; pair new foods with familiar favorites.","Exercise if needed":"Active play and family walks.","When to seek medical care":"Poor growth, extreme restriction, or nutritional concerns need professional support."}},{"title":"Speech Delay","f":{"Meaning":"Slower-than-expected speech or language development.","Causes and risk factors":"Hearing problems, developmental differences, limited interaction, prematurity.","Symptoms to detect":"Few words for age, difficulty forming sentences, poor understanding.","Prevention and precautions":"Talk and read daily; respond to communication attempts; hearing test; early intervention.","Natural support and how to use":"Nutritious diet supports development; avoid excessive screen time.","Exercise if needed":"Interactive play, singing, naming games, and outdoor activities.","When to seek medical care":"No words by 18 months or loss of speech skills needs early assessment."}},{"title":"Hearing Problems","f":{"Meaning":"Reduced ability to hear sounds.","Causes and risk factors":"Ear infections, wax, loud noise, genetics, some medicines.","Symptoms to detect":"Turning up TV, unclear speech, poor response to name, ear pain.","Prevention and precautions":"Treat ear infections; avoid loud headphones; regular hearing checks.","Natural support and how to use":"Do not insert objects into ears; warm compress for mild discomfort; professional wax removal.","Exercise if needed":"Safe play; avoid noisy environments without protection.","When to seek medical care":"Sudden hearing loss or ear discharge needs urgent care."}},{"title":"Vision Problems","f":{"Meaning":"Difficulty seeing clearly at distance or near.","Causes and risk factors":"Genetics, screen time, poor lighting, uncorrected refractive error.","Symptoms to detect":"Squinting, sitting close to TV, headaches, eye rubbing.","Prevention and precautions":"Regular eye checks; good lighting; outdoor time; limit continuous screen use.","Natural support and how to use":"Vitamin-A-rich foods, leafy greens, eggs, fish; 20-20-20 screen breaks.","Exercise if needed":"Outdoor play and ball games support visual development.","When to seek medical care":"Sudden vision loss, severe eye pain, or white pupil reflection is urgent."}},{"title":"Squint","f":{"Meaning":"Misalignment of the eyes, also called strabismus.","Causes and risk factors":"Muscle imbalance, refractive error, nerve issues, genetics.","Symptoms to detect":"Eyes pointing in different directions, head tilt, double vision.","Prevention and precautions":"Early eye examination; treat vision problems; follow patching or glasses advice.","Natural support and how to use":"Balanced vitamin-A-rich diet; avoid unproven eye exercises as treatment.","Exercise if needed":"Ball games and tracking activities as advised by an eye professional.","When to seek medical care":"New squint, double vision, or white pupil needs urgent eye assessment."}},{"title":"Lazy Eye","f":{"Meaning":"Reduced vision in one eye due to poor visual development.","Causes and risk factors":"Squint, refractive error, cataract, deprivation.","Symptoms to detect":"Favoring one eye, poor depth perception, squinting.","Prevention and precautions":"Early screening; glasses or patching as prescribed; treat underlying cause.","Natural support and how to use":"Vitamin-A-rich foods and balanced nutrition; avoid unproven remedies.","Exercise if needed":"Visual tracking games and outdoor play as advised.","When to seek medical care":"Untreated lazy eye can become permanent; early assessment is important."}},{"title":"Headache","f":{"Meaning":"Pain in the head from tension, illness, or other triggers.","Causes and risk factors":"Stress, dehydration, poor sleep, screens, hunger, illness.","Symptoms to detect":"Head pain, tiredness, sensitivity to light, nausea.","Prevention and precautions":"Hydration; regular meals; sleep routine; screen breaks.","Natural support and how to use":"Water, magnesium-rich foods, warm compress on neck, rest in a quiet room.","Exercise if needed":"Gentle play; avoid intense activity during headache.","When to seek medical care":"Sudden worst-ever headache, stiff neck, weakness, or confusion is an emergency."}},{"title":"Febrile Seizure","f":{"Meaning":"A seizure triggered by a rapid rise in body temperature in young children.","Causes and risk factors":"Fever, viral infection, genetic tendency.","Symptoms to detect":"Shaking, stiffening, eye rolling, brief loss of awareness.","Prevention and precautions":"Manage fever appropriately; seek medical advice after any seizure.","Natural support and how to use":"Do not put anything in the mouth; place the child on their side on a safe surface; time the seizure.","Exercise if needed":"No exercise during or immediately after a seizure.","When to seek medical care":"First seizure, seizure over 5 minutes, repeated seizures, or breathing difficulty is an emergency."}},{"title":"Meningitis Warning Signs","f":{"Meaning":"Infection or inflammation of the membranes around the brain and spinal cord.","Causes and risk factors":"Bacteria or viruses, close contact, weak immunity.","Symptoms to detect":"Fever, severe headache, stiff neck, rash, vomiting, confusion, light sensitivity.","Prevention and precautions":"Vaccination; avoid close contact with sick people; seek care early for severe illness.","Natural support and how to use":"No home remedy treats meningitis; urgent hospital care is essential.","Exercise if needed":"None during acute illness.","When to seek medical care":"Stiff neck, purple rash, confusion, seizure, or severe headache is a medical emergency."}},{"title":"Appendicitis Warning Signs","f":{"Meaning":"Inflammation of the appendix that can become a surgical emergency.","Causes and risk factors":"Blockage of the appendix, infection.","Symptoms to detect":"Belly pain moving to the lower right side, nausea, vomiting, fever, loss of appetite.","Prevention and precautions":"No proven prevention; seek care early for persistent abdominal pain.","Natural support and how to use":"Do not give painkillers, laxatives, or food while awaiting assessment.","Exercise if needed":"Avoid activity; rest until assessed.","When to seek medical care":"Worsening right-lower-belly pain, fever, or vomiting is an emergency."}},{"title":"Urinary Tract Infection","f":{"Meaning":"Bacterial infection of the bladder or urinary system.","Causes and risk factors":"Poor hygiene, holding urine, constipation, anatomical issues.","Symptoms to detect":"Burning urination, frequent urination, belly pain, fever, bedwetting.","Prevention and precautions":"Good hygiene; regular toileting; hydration; treat constipation.","Natural support and how to use":"Water, cranberry juice without added sugar for older children; avoid harsh soaps.","Exercise if needed":"Gentle play; rest during illness.","When to seek medical care":"Fever, back pain, vomiting, or blood in urine needs urgent care."}},{"title":"Phimosis","f":{"Meaning":"Foreskin cannot easily retract over the head of the penis.","Causes and risk factors":"Normal development in young boys, scarring, infection.","Symptoms to detect":"Difficulty retracting foreskin, ballooning during urination, irritation.","Prevention and precautions":"Gentle hygiene; do not force retraction; seek advice if problematic.","Natural support and how to use":"Warm water washing; avoid forceful pulling; see a clinician for recurring problems.","Exercise if needed":"Normal play and activity.","When to seek medical care":"Pain, swelling, inability to urinate, or recurrent infections needs care."}},{"title":"Undescended Testicle","f":{"Meaning":"One or both testicles have not moved into the scrotum.","Causes and risk factors":"Prematurity, hormonal factors, genetics.","Symptoms to detect":"Empty or underdeveloped scrotum; testicle felt in the groin.","Prevention and precautions":"Regular newborn checks; early referral; avoid delay.","Natural support and how to use":"No home remedy moves a testicle; medical assessment is needed.","Exercise if needed":"Normal play unless advised otherwise.","When to seek medical care":"Undescended testicle after 6 months needs specialist assessment."}},{"title":"Hernia","f":{"Meaning":"An organ or tissue pushes through a weak spot in the abdominal wall.","Causes and risk factors":"Weak abdominal wall, prematurity, chronic cough, constipation.","Symptoms to detect":"Bulge in the groin or belly, discomfort, swelling when crying or standing.","Prevention and precautions":"Avoid heavy lifting in older children; treat constipation; regular checks.","Natural support and how to use":"No home remedy repairs a hernia; supportive care only until assessed.","Exercise if needed":"Avoid straining and heavy activity until assessed.","When to seek medical care":"A bulge that becomes hard, painful, red, or cannot be pushed back is an emergency."}},{"title":"Umbilical Hernia","f":{"Meaning":"A soft bulge near the belly button from a small opening in the abdominal wall.","Causes and risk factors":"Prematurity, low birth weight, weak abdominal muscles.","Symptoms to detect":"Soft bulge at the belly button, more visible when crying.","Prevention and precautions":"Most close naturally; avoid pressure or binding; regular monitoring.","Natural support and how to use":"No home remedy closes it; avoid coins, belts, or binding.","Exercise if needed":"Normal gentle play.","When to seek medical care":"Hard, painful, discolored bulge with vomiting needs urgent care."}},{"title":"Early Puberty","f":{"Meaning":"Puberty signs begin earlier than expected.","Causes and risk factors":"Hormonal issues, obesity, brain or gland conditions, some exposures.","Symptoms to detect":"Breast development or testicular enlargement before age 8–9, growth spurt, body odor.","Prevention and precautions":"Healthy weight; avoid hormone-containing products; early assessment.","Natural support and how to use":"Balanced diet; avoid unregulated supplements; limit plastic food containers when possible.","Exercise if needed":"Regular active play and sports.","When to seek medical care":"Breast development before 8 or testicular enlargement before 9 needs pediatric evaluation."}},{"title":"Delayed Puberty","f":{"Meaning":"Puberty starts later than expected.","Causes and risk factors":"Chronic illness, undernutrition, hormonal issues, genetics, intense exercise.","Symptoms to detect":"No breast development by 13 in girls or testicular growth by 14 in boys.","Prevention and precautions":"Adequate nutrition; treat chronic illness; medical assessment.","Natural support and how to use":"Balanced meals with protein, healthy fats, and micronutrients; avoid extreme dieting.","Exercise if needed":"Moderate exercise; avoid excessive training without adequate food.","When to seek medical care":"No puberty signs by the expected ages needs endocrine assessment."}},{"title":"Teen Menstrual Problems","f":{"Meaning":"Period issues such as severe pain, irregular cycles, or heavy bleeding.","Causes and risk factors":"Hormonal changes, PCOS, thyroid issues, stress, anemia.","Symptoms to detect":"Severe cramps, irregular cycles, heavy bleeding, fainting, acne.","Prevention and precautions":"Track cycles; balanced meals; iron-rich foods; healthy sleep.","Natural support and how to use":"Ginger tea; warm compress; magnesium-rich foods; iron-rich beans and greens.","Exercise if needed":"Walking, yoga, and moderate exercise; reduce intensity during heavy bleeding.","When to seek medical care":"Fainting, soaking pads hourly, or severe pain that stops school needs care."}},{"title":"Teen Acne","f":{"Meaning":"Pimples caused by oil, bacteria, and hormonal changes during adolescence.","Causes and risk factors":"Hormones, oily skin, stress, cosmetics, diet, bacteria.","Symptoms to detect":"Pimples, blackheads, oily skin, scarring.","Prevention and precautions":"Gentle cleansing; non-comedogenic products; avoid picking; manage stress.","Natural support and how to use":"Honey mask, aloe vera, diluted tea-tree oil; reduce high-sugar foods.","Exercise if needed":"Exercise is fine; shower after sweating.","When to seek medical care":"Painful cysts, scarring, or acne with irregular periods needs medical review."}},{"title":"Body Odor","f":{"Meaning":"Strong smell from sweat interacting with skin bacteria.","Causes and risk factors":"Puberty, sweat, hygiene, diet, stress.","Symptoms to detect":"Underarm or foot odor, sweating, embarrassment.","Prevention and precautions":"Daily bathing; clean clothes; deodorant; breathable fabrics.","Natural support and how to use":"Baking-soda paste briefly under arms for older teens; diluted apple-cider vinegar rinse; tea-tree oil in wash.","Exercise if needed":"Regular sports are healthy; shower afterward.","When to seek medical care":"Sudden major odor change with other symptoms needs medical review."}},{"title":"Sports Injuries","f":{"Meaning":"Strains, sprains, or impact injuries during play or sport.","Causes and risk factors":"Poor warm-up, bad technique, overuse, unsafe surfaces.","Symptoms to detect":"Pain, swelling, bruising, reduced movement.","Prevention and precautions":"Warm-up; proper gear; coaching; rest days; hydration.","Natural support and how to use":"RICE for first 48 hours: rest, ice wrapped in cloth, compression, elevation.","Exercise if needed":"Rehabilitation exercises after acute pain settles; avoid playing through sharp pain.","When to seek medical care":"Deformity, inability to bear weight, or severe swelling needs urgent care."}},{"title":"Dental Injuries","f":{"Meaning":"Damage to teeth or gums from falls, sports, or accidents.","Causes and risk factors":"Falls, contact sports, biting hard objects, accidents.","Symptoms to detect":"Broken tooth, knocked-out tooth, bleeding, pain.","Prevention and precautions":"Mouthguards for sports; avoid chewing ice or hard objects; supervise play.","Natural support and how to use":"Rinse with clean water; save a knocked-out permanent tooth in milk and seek dental care immediately.","Exercise if needed":"Avoid contact sports until assessed.","When to seek medical care":"A knocked-out permanent tooth is a dental emergency."}},{"title":"Vaccine-Preventable Diseases","f":{"Meaning":"Illnesses preventable by routine immunization.","Causes and risk factors":"Missed or delayed vaccines, exposure to infected people.","Symptoms to detect":"Fever, rash, cough, paralysis, or severe illness depending on disease.","Prevention and precautions":"Follow the national immunization schedule; keep records; catch up missed doses.","Natural support and how to use":"Nutritious food, fluids, and rest support recovery but do not replace vaccines.","Exercise if needed":"Age-appropriate active play supports immunity and development.","When to seek medical care":"Fever with rash, stiff neck, breathing difficulty, or paralysis is urgent."}},{"title":"Lead Exposure","f":{"Meaning":"Harmful exposure to lead from paint, dust, water, or contaminated items.","Causes and risk factors":"Old paint, contaminated soil or water, some toys, occupational exposure.","Symptoms to detect":"Developmental delay, irritability, poor appetite, stomach pain, anemia.","Prevention and precautions":"Avoid peeling paint; wash hands; use safe water; choose certified toys.","Natural support and how to use":"Iron-, calcium-, and vitamin-C-rich foods may reduce absorption; medical testing and removal of exposure are essential.","Exercise if needed":"Safe outdoor play away from contaminated soil.","When to seek medical care":"Developmental regression, severe belly pain, or known exposure needs urgent testing."}},{"title":"Accidental Poisoning","f":{"Meaning":"Harmful swallowing, inhalation, or skin contact with toxic substances.","Causes and risk factors":"Medicines, cleaning products, pesticides, plants, fuels.","Symptoms to detect":"Vomiting, drowsiness, burns, difficulty breathing, confusion.","Prevention and precautions":"Store chemicals and medicines out of reach; use child-resistant caps; label containers.","Natural support and how to use":"Do not induce vomiting; call poison control or emergency services immediately.","Exercise if needed":"None during acute poisoning.","When to seek medical care":"Any suspected poisoning is an emergency; take the container or substance details."}},{"title":"Drowning Risk","f":{"Meaning":"Danger of suffocation from submersion in water.","Causes and risk factors":"Unsupervised swimming, buckets, pools, wells, open water.","Symptoms to detect":"Struggling in water, silent drowning, coughing, unconsciousness.","Prevention and precautions":"Constant supervision; fencing pools; swimming lessons; empty buckets; life jackets.","Natural support and how to use":"Learn CPR as a caregiver; remove from water and call emergency help; do not delay rescue.","Exercise if needed":"Swimming lessons with supervision; water-safety education.","When to seek medical care":"Any submersion event, even without symptoms, needs medical assessment."}},{"title":"Road Traffic Injuries","f":{"Meaning":"Injuries from road accidents involving pedestrians, cyclists, or passengers.","Causes and risk factors":"Speeding, no helmets or seat belts, poor supervision, unsafe roads.","Symptoms to detect":"Bruises, fractures, head injury, internal injury.","Prevention and precautions":"Seat belts, child car seats, helmets, reflective clothing, road-safety teaching.","Natural support and how to use":"First aid: control bleeding, immobilize suspected spine injury, call emergency services.","Exercise if needed":"Cycling and walking with safety gear and supervision.","When to seek medical care":"Head injury, unconsciousness, severe pain, or deformity is an emergency."}},{"title":"Choking","f":{"Meaning":"Blockage of the airway by food or a small object.","Causes and risk factors":"Small foods, toys, coins, running while eating.","Symptoms to detect":"Coughing, silent struggle, inability to speak or cry, blue lips.","Prevention and precautions":"Cut food small; avoid whole nuts and hard sweets for young children; supervise meals.","Natural support and how to use":"Learn infant/child choking first aid; call emergency help if the child cannot breathe.","Exercise if needed":"Age-appropriate active play; avoid eating while running.","When to seek medical care":"Inability to breathe, speak, or cough is an immediate emergency."}},{"title":"Child Safety and Preventive Checkups","f":{"Meaning":"Regular checks detect growth, development, vision, hearing, and dental problems early.","Causes and risk factors":"Missed appointments, poor access, lack of awareness.","Symptoms to detect":"Often none; growth or developmental concerns may appear gradually.","Prevention and precautions":"Immunization, growth monitoring, dental and vision checks, safety education.","Natural support and how to use":"Balanced meals, sleep routine, hygiene, active play, and safe environment.","Exercise if needed":"Daily active play, sports, and family walks.","When to seek medical care":"Do not wait for symptoms; routine checkups protect lifelong health."}}]},"ex":{"men":[{"day":1,"focus":"Chest, Triceps & Shoulders","ex":[{"name":"Push-Up","dose":"3 sets of 8–15 reps","motion":"Start in a straight-arm plank with hands slightly wider than shoulders. Bend your elbows and lower your chest toward the floor, keeping your body straight. Push back up.","tip":"Keep your hips level and squeeze your glutes. Too hard? Do knee push-ups. Too easy? Elevate your feet."},{"name":"Wide Push-Up","dose":"3 sets of 8–12 reps","motion":"Place hands wider than shoulder-width. Lower your chest between your hands, then press back up.","tip":"Keep elbows at about 45 degrees, not fully flared."},{"name":"Diamond Push-Up","dose":"3 sets of 6–12 reps","motion":"Place hands close together under your chest, forming a diamond with thumbs and fingers. Lower until your chest nearly touches your hands, then push up.","tip":"Keep elbows close to your body throughout."},{"name":"Pike Push-Up","dose":"3 sets of 6–12 reps","motion":"Start in a downward-dog position with hips high. Bend your elbows and lower the top of your head toward the floor, then press back up.","tip":"Keep your neck neutral and avoid shrugging your shoulders."},{"name":"Chair Dips","dose":"3 sets of 8–15 reps","motion":"Sit on a sturdy chair with hands beside your hips. Slide your hips off, bend your elbows to lower your body, then press back up.","tip":"Keep shoulders down; stop if you feel shoulder pain."},{"name":"Plank","dose":"3 holds of 20–60 seconds","motion":"Hold a forearm or straight-arm plank with your body in a straight line.","tip":"Do not let your hips sag or rise."}]},{"day":2,"focus":"Back & Biceps","ex":[{"name":"Backpack Row","dose":"3 sets of 10–15 reps each side","motion":"Hold a loaded backpack in one hand. Bend forward with a flat back, pull the backpack toward your waist, then lower slowly.","tip":"Squeeze your shoulder blade at the top."},{"name":"Towel Row","dose":"3 sets of 10–15 reps","motion":"Loop a towel around a sturdy door handle or pole. Hold both ends, lean back, and pull your chest toward the anchor point.","tip":"Keep your body straight and core tight."},{"name":"Backpack Curl","dose":"3 sets of 10–15 reps","motion":"Hold a backpack with both hands or one hand. Keep elbows fixed, curl the weight toward your shoulders, then lower slowly.","tip":"Do not swing; control the lowering phase."},{"name":"Isometric Biceps Hold","dose":"3 holds","motion":"Hold a backpack or water bottles at 90 degrees elbow angle for 20–40 seconds.","tip":"Keep elbows tucked and shoulders relaxed."},{"name":"Superman Pull","dose":"3 sets of 12–15 reps","motion":"Lie face down with arms extended. Lift your chest, arms, and legs slightly off the floor, hold for 2 seconds, then lower.","tip":"Move slowly; avoid jerking your neck."},{"name":"Plank","dose":"3 holds of 20–60 seconds","motion":"Hold a forearm or straight-arm plank with your body in a straight line.","tip":"Do not let your hips sag or rise."}]},{"day":3,"focus":"Legs & Glutes","ex":[{"name":"Squat","dose":"3 sets of 12–20 reps","motion":"Stand with feet shoulder-width apart. Push hips back and bend knees until thighs are near parallel, then stand up.","tip":"Keep chest up, knees tracking over toes."},{"name":"Lunge","dose":"3 sets of 10–15 reps each leg","motion":"Step forward, lower until both knees form 90-degree angles, then push back to standing.","tip":"Keep your front knee behind your toes."},{"name":"Reverse Lunge","dose":"3 sets of 10–15 reps each leg","motion":"Step backward into a lunge, lower with control, then return to standing.","tip":"Easier on the knees than forward lunges."},{"name":"Glute Bridge","dose":"3 sets of 15–20 reps","motion":"Lie on your back, knees bent, feet flat. Push through your heels and lift your hips until your body forms a straight line.","tip":"Squeeze your glutes hard at the top."},{"name":"Calf Raise","dose":"3 sets of 15–25 reps","motion":"Stand tall, rise onto your toes, hold briefly, then lower slowly.","tip":"Use stairs for a deeper stretch if stable."},{"name":"Wall Sit","dose":"3 holds of 30–60 seconds","motion":"Slide down a wall until knees are at 90 degrees. Hold the position.","tip":"Keep your back flat against the wall."}]},{"day":4,"focus":"Chest, Triceps & Shoulders","ex":[{"name":"Push-Up","dose":"3 sets of 8–15 reps","motion":"Start in a straight-arm plank with hands slightly wider than shoulders. Bend your elbows and lower your chest toward the floor, keeping your body straight. Push back up.","tip":"Keep your hips level and squeeze your glutes. Too hard? Do knee push-ups. Too easy? Elevate your feet."},{"name":"Wide Push-Up","dose":"3 sets of 8–12 reps","motion":"Place hands wider than shoulder-width. Lower your chest between your hands, then press back up.","tip":"Keep elbows at about 45 degrees, not fully flared."},{"name":"Diamond Push-Up","dose":"3 sets of 6–12 reps","motion":"Place hands close together under your chest, formi
