<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A2E38"><title>Vitalis · Health &amp; Body Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A2E38;--teal:#0F5C6B;--mint:#37D9AE;--coral:#FF6A55;--bg:#EEF4F4;--mut:#5C7279;--line:#DCE7E8;--card:#fff;--tx:#0A2E38}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.5 Figtree,system-ui,sans-serif;background:#CFE0E1;color:var(--tx);display:flex;justify-content:center}
h1,h2,h3,.d{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em;line-height:1.1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
#app{width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:520px){body{align-items:center;padding:20px;min-height:100vh}#app{height:min(900px,calc(100vh - 40px));border-radius:40px;box-shadow:0 30px 80px #0A2E3866}}
main{flex:1;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 18px}
.disc{margin:0 14px 8px;padding:8px 12px;font-size:12px;line-height:1.35;background:#FFEDE8;color:#8A3322;border-radius:12px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mut);padding:6px 0;border-radius:14px}
nav button.on{color:var(--teal)}nav button.on svg{background:#D8F6EE;border-radius:12px}
svg{display:block}.i{width:40px;height:26px;padding:2px 8px;transition:.2s}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}.top h2{flex:1;font-size:22px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 8px #0a2e3814;transition:transform .15s}
.ib:active{transform:scale(.9)}.ib svg{width:20px;height:20px}.ib.on{background:var(--coral);color:#fff}.ib.on svg{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35)}}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 18px #0a2e380d;margin-bottom:12px}
.hero{background:var(--ink);color:#fff;border-radius:28px;padding:20px;margin-bottom:14px;display:flex;gap:16px;align-items:center}
.hero h1{font-size:28px;margin-bottom:6px}.hero p{color:#A9C7CC;font-size:14px}
.ring{position:relative;flex:none;display:grid;place-items:center}.ring b{position:absolute;font:800 26px 'Bricolage Grotesque'}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}.ring .bg{stroke:#ffffff22}.ring .fg{stroke:var(--mint);transition:stroke-dashoffset 1s ease}
.tasks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tk{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--card)fff1c;display:flex;gap:4px;align-items:center}
.tk.ok{background:var(--mint);color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:16px;background:var(--coral);color:#fff;font-weight:700;box-shadow:0 6px 16px #ff6a5544;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.alt{background:var(--teal);box-shadow:none}.btn.ghost{background:var(--card);color:var(--teal);box-shadow:inset 0 0 0 2px var(--line)}.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.sec{font-size:19px;margin:20px 2px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:24px;padding:16px;text-align:left;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);transition:transform .15s}
.tile:active{transform:scale(.96)}.tile svg{width:60px;height:60px}.tile b{font:800 20px 'Bricolage Grotesque'}.tile small{display:block;font-size:12px;opacity:.75;line-height:1.3}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:13px 14px;margin-bottom:8px;box-shadow:0 2px 10px #0a2e3809}
.row>div{flex:1;min-width:0}.row b{display:block;font-weight:700}.row small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 15px 'Bricolage Grotesque';flex:none;background:#E2F1F1;color:var(--teal)}.dot.ok{background:var(--mint)}.dot.rec{background:#FFE9C7;color:#8A5A00}
.letter{position:sticky;top:-18px;background:var(--bg);font:800 15px 'Bricolage Grotesque';color:var(--teal);padding:8px 2px 4px;z-index:2}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;margin-bottom:12px;box-shadow:inset 0 0 0 2px var(--line)}
.search input{flex:1;border:0;background:none;font:inherit;padding:13px 0;min-width:0;outline:0}.search:focus-within{box-shadow:inset 0 0 0 2px var(--teal)}.search svg{width:20px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:9px 15px;border-radius:99px;background:var(--card);font-weight:600;font-size:14px;box-shadow:inset 0 0 0 2px var(--line)}.chip.on{background:var(--teal);color:#fff;box-shadow:none}
.seg{display:flex;background:var(--card);border-radius:16px;padding:4px;margin-bottom:14px}.seg button{flex:1;padding:10px;border-radius:12px;font-weight:700;color:var(--mut)}.seg .on{background:var(--ink);color:#fff}
.blk{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border-left:6px solid var(--c,#9EC9CF)}
.blk h3{font-size:16px;margin-bottom:6px;color:var(--teal)}.blk p,.blk li{font-size:16px;line-height:1.55}.blk ul{padding-left:18px}.blk li{margin:4px 0}
.blk.nat{--c:var(--mint);background:#EAFBF5}.blk.warn{--c:var(--coral);background:#FFF0EC}.blk.warn h3{color:#B3341F}.blk.mv{--c:var(--teal)}
.big{font:700 21px/1.3 'Bricolage Grotesque';letter-spacing:-.01em}
.map{display:flex;justify-content:center}.mz{fill:#D3E2E4;transition:fill .3s}.mz.on{fill:var(--coral)}.all .mz{fill:#8EE9D0}.all .mz.on{fill:var(--coral)}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;background:#D8F6EE;color:#0A5E49;font-weight:700;font-size:14px}
.timer{text-align:center}.timer .ring b{font-size:40px}.tc{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:12px}.tc .btn{width:auto;min-width:130px}
ol.st{padding-left:0;list-style:none;counter-reset:s}ol.st li{counter-increment:s;display:flex;gap:12px;margin:10px 0}ol.st li:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.bar{height:10px;background:#D8E6E7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .6s}
.toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:9;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
.sw{width:54px;height:32px;border-radius:99px;background:#C4D5D7;position:relative;transition:.2s;flex:none}.sw:after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--mint)}.sw.on:after{left:26px}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
input{color:var(--tx)}
.mot{background:radial-gradient(circle at 50% 45%,#35A0FF 0%,#0B52D6 48%,#04163F 100%);border-radius:26px;height:260px;position:relative;overflow:hidden;margin-bottom:14px}
.mot svg{width:100%;height:100%}.mot small{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#BFE3FF}
.rec{background:linear-gradient(135deg,#FFE4DE,#FFF4DC)}
[data-th=dark]{--bg:#071E26;--card:#0F3140;--tx:#E6F4F5;--mut:#8FB0B6;--line:#1D4452;--teal:#2AA3BA}
[data-th=dark] body{background:#04141A}[data-th=dark] .seg .on{background:var(--teal)}
[data-th=dark] .blk.nat{background:#0E3A36}[data-th=dark] .blk.warn{background:#3A1F22}[data-th=dark] .blk.warn h3{color:#FF9A8A}
[data-th=dark] .disc{background:#3A1F22;color:#FFB4A4}[data-th=dark] .pill{background:#0E3A36;color:#7CF0CF}
[data-th=dark] .dot{background:#17404E}[data-th=dark] .dot.ok{background:var(--mint);color:#0A2E38}[data-th=dark] .dot.rec{background:#4A3A1A;color:#FFD27A}
[data-th=dark] .mz{fill:#2B5461}[data-th=dark] .mz.on{fill:var(--coral)}[data-th=dark] .bar{background:#1D4452}[data-th=dark] .sw{background:#2B5461}[data-th=dark] .sw.on{background:var(--mint)}
[data-th=dark] .rec{background:linear-gradient(135deg,#3B2A2A,#3A3322)}[data-th=dark] .rec p:first-child{color:#FF9A8A!important}
[data-th=dark] nav button.on svg{background:#17404E}
ol.st li{padding:8px 10px;border-radius:12px;margin:4px 0;transition:background .25s}ol.st li.on{background:#37d9ae2e;box-shadow:inset 0 0 0 2px var(--mint)}ol.st li.on:before{background:var(--coral)}

<script>
const D={"h":{"men":[{"title":"High Blood Pressure","f":{"Meaning":"Blood pushes too hard against artery walls over time.","Causes and risk factors":"Excess salt, inactivity, obesity, alcohol, smoking, stress, family history.","Symptoms to detect":"Often none; sometimes headache, dizziness, blurred vision, or chest pain.","Prevention and precautions":"Check BP regularly; reduce salt and processed food; walk daily; avoid smoking and excess alcohol.","Natural support and how to use":"Garlic: crush 1 clove into warm water or add to meals daily. Beetroot juice 3–4 times weekly. Hibiscus tea unsweetened 3–4 times weekly.","Exercise if needed":"Brisk walk 30 minutes, 5 days weekly; light strength training twice weekly.","When to seek medical care":"Seek urgent care above 180/120 or with chest pain, weakness, speech or vision changes."}},{"title":"Type 2 Diabetes","f":{"Meaning":"The body cannot use insulin properly, so blood sugar stays high.","Causes and risk factors":"Belly fat, inactivity, sugary drinks, refined carbs, family history, poor sleep.","Symptoms to detect":"Thirst, frequent urination, fatigue, blurred vision, slow-healing wounds, tingling feet.","Prevention and precautions":"Cut sugary drinks; eat protein and fiber; walk after meals; screen blood sugar regularly.","Natural support and how to use":"Fenugreek: soak 1 teaspoon overnight and drink in the morning. Cinnamon in oats or tea. Apple-cider vinegar: 1 teaspoon in water before high-carb meals.","Exercise if needed":"Walk 30–45 minutes daily; resistance training twice weekly.","When to seek medical care":"Seek care for confusion, vomiting, extreme drowsiness, or very high readings."}},{"title":"Heart Disease","f":{"Meaning":"Narrowed or damaged blood vessels reduce blood flow to the heart.","Causes and risk factors":"Smoking, high BP, cholesterol, diabetes, obesity, inactivity, stress.","Symptoms to detect":"Chest pressure, breathlessness, fatigue, palpitations, arm or jaw discomfort.","Prevention and precautions":"Do not smoke; exercise; eat more plants and fish; control BP, sugar, and cholesterol.","Natural support and how to use":"Oats, beans, fatty fish, garlic, and vegetables daily. Reduce fried food and excess red meat.","Exercise if needed":"150 minutes weekly of brisk walking, cycling, or swimming; strength training twice weekly.","When to seek medical care":"Call emergency services for crushing chest pain, sweating, shortness of breath, or fainting."}},{"title":"High Cholesterol","f":{"Meaning":"Too much cholesterol in the blood can clog arteries.","Causes and risk factors":"Fried food, excess red meat, inactivity, obesity, smoking, genetics.","Symptoms to detect":"Usually no symptoms until artery disease develops.","Prevention and precautions":"Eat fiber, fish, nuts, and vegetables; reduce fried and processed foods; exercise.","Natural support and how to use":"Oats, beans, avocado, walnuts, and olive oil. Garlic and ginger in meals.","Exercise if needed":"Aerobic exercise 30 minutes most days; resistance training twice weekly.","When to seek medical care":"Get a lipid profile test; follow medical treatment if prescribed."}},{"title":"Stroke","f":{"Meaning":"Blood flow to part of the brain is blocked or a vessel bursts.","Causes and risk factors":"High BP, diabetes, smoking, atrial fibrillation, obesity, alcohol.","Symptoms to detect":"Face drooping, arm weakness, speech difficulty, sudden confusion, severe headache.","Prevention and precautions":"Control BP and diabetes; do not smoke; stay active; limit alcohol.","Natural support and how to use":"Leafy greens, berries, fish, garlic, and water. Reduce salt and processed meat.","Exercise if needed":"Regular walking and balance exercises; strength training twice weekly.","When to seek medical care":"Emergency: use FAST—Face, Arms, Speech, Time. Seek care immediately."}},{"title":"Obesity and Belly Fat","f":{"Meaning":"Excess body fat, especially around organs, raises disease risk.","Causes and risk factors":"Overeating, sugary drinks, alcohol, inactivity, poor sleep, stress.","Symptoms to detect":"Large waist, breathlessness, fatigue, snoring, joint pain.","Prevention and precautions":"Protein at meals, vegetables, home cooking, no sugary drinks, 7–9 hours sleep.","Natural support and how to use":"Ginger tea after meals; green tea 1–2 cups daily; lemon water instead of soda; beans and oats for fullness.","Exercise if needed":"Walk 30–45 minutes 5 days weekly; strength training 2–3 days weekly.","When to seek medical care":"Seek care for chest pain, severe breathlessness, or breathing pauses during sleep."}},{"title":"Fatty Liver Disease","f":{"Meaning":"Fat builds up in the liver and may cause inflammation.","Causes and risk factors":"Alcohol, obesity, diabetes, high triglycerides, poor diet.","Symptoms to detect":"Often silent; fatigue, right-side belly discomfort, enlarged liver.","Prevention and precautions":"Stop or limit alcohol; lose belly fat; avoid sugary drinks and fried food.","Natural support and how to use":"Coffee in moderation, green vegetables, garlic, and omega-3-rich fish. Avoid unproven detox products.","Exercise if needed":"Walk daily; resistance training twice weekly; gradual weight loss.","When to seek medical care":"See a doctor for persistent fatigue, jaundice, or abdominal swelling."}},{"title":"Erectile Dysfunction","f":{"Meaning":"Ongoing difficulty getting or keeping an erection firm enough for sex.","Causes and risk factors":"Diabetes, BP, heart disease, obesity, smoking, alcohol, stress, low testosterone.","Symptoms to detect":"Weak or short-lasting erections, reduced morning erections, low desire.","Prevention and precautions":"Exercise, quit smoking, limit alcohol, manage BP and sugar, reduce stress.","Natural support and how to use":"Watermelon, beetroot, leafy greens, garlic, pumpkin seeds. Pelvic-floor squeezes: hold 5 seconds, repeat 10–15 times, 2–3 times daily.","Exercise if needed":"Brisk walking or cycling 30 minutes most days; strength training twice weekly.","When to seek medical care":"See a clinician if persistent, sudden, or with heart symptoms; avoid unverified sexual-enhancement products."}},{"title":"Low Testosterone","f":{"Meaning":"Testosterone falls below the level needed for energy, muscle, mood, and sex drive.","Causes and risk factors":"Aging, obesity, diabetes, poor sleep, alcohol, stress, testicular problems.","Symptoms to detect":"Low libido, fatigue, reduced muscle, belly fat, low mood, poor concentration.","Prevention and precautions":"Sleep 7–9 hours; strength train; maintain healthy weight; limit alcohol.","Natural support and how to use":"Eggs, fish, lean meat, beans, pumpkin seeds, nuts, ginger. Ashwagandha only with professional advice.","Exercise if needed":"Squats, push-ups, rows, lunges 3 times weekly; walking on other days.","When to seek medical care":"Request blood testing for persistent symptoms; do not self-prescribe hormones."}},{"title":"Enlarged Prostate (BPH)","f":{"Meaning":"Non-cancerous prostate enlargement presses on the urine tube.","Causes and risk factors":"Age, hormones, family history, obesity, inactivity.","Symptoms to detect":"Weak stream, frequent urination, night urination, dribbling, incomplete emptying.","Prevention and precautions":"Reduce evening caffeine and alcohol; do not delay urination; stay active.","Natural support and how to use":"Pumpkin seeds daily; tomatoes and watermelon for lycopene; warm sitz bath 10–15 minutes.","Exercise if needed":"Daily walking; gentle hip stretches; avoid long sitting.","When to seek medical care":"See a doctor for blood in urine, inability to urinate, fever, or severe pain."}},{"title":"Prostatitis","f":{"Meaning":"Inflammation or infection of the prostate gland.","Causes and risk factors":"Bacterial infection, pelvic tension, urinary retention, STIs.","Symptoms to detect":"Pelvic pain, painful urination, urgency, fever, painful ejaculation.","Prevention and precautions":"Treat infections early; hydrate; avoid prolonged sitting; practice safe sex.","Natural support and how to use":"Warm sitz bath; ginger tea; water and cranberry-rich foods; avoid alcohol and spicy food during flare-ups.","Exercise if needed":"Gentle walking, pelvic relaxation stretches, deep breathing.","When to seek medical care":"Fever, severe pain, or inability to urinate needs urgent medical care."}},{"title":"Prostate Cancer Risk","f":{"Meaning":"Abnormal prostate-cell growth that may become cancer.","Causes and risk factors":"Age, family history, ethnicity, obesity, diet.","Symptoms to detect":"Often early-stage silent; urinary changes, blood in urine/semen, pelvic or bone pain.","Prevention and precautions":"Regular screening discussion after 45–50; healthy weight; vegetables and fish; avoid smoking.","Natural support and how to use":"Tomatoes, watermelon, green tea, cruciferous vegetables, and fatty fish as part of a healthy diet.","Exercise if needed":"Regular activity 150 minutes weekly; strength training twice weekly.","When to seek medical care":"Blood in urine, bone pain, or urinary obstruction requires prompt evaluation."}},{"title":"Testicular Torsion","f":{"Meaning":"The testicle twists and cuts off its blood supply.","Causes and risk factors":"Sudden twisting during activity or sleep; anatomical risk.","Symptoms to detect":"Sudden severe testicular pain, swelling, nausea, vomiting.","Prevention and precautions":"This is not preventable by home remedies; know the warning signs.","Natural support and how to use":"No home remedy is appropriate.","Exercise if needed":"None during an acute episode.","When to seek medical care":"Medical emergency—surgery within hours may save the testicle."}},{"title":"Testicular Cancer","f":{"Meaning":"Cancer that begins in a testicle, most common in younger men.","Causes and risk factors":"Undescended testicle, family history, prior cancer.","Symptoms to detect":"Painless lump, swelling, heaviness, dull ache in the lower belly.","Prevention and precautions":"Monthly self-check after a warm shower; report any lump promptly.","Natural support and how to use":"No remedy replaces medical assessment.","Exercise if needed":"Avoid strenuous exercise until evaluated.","When to seek medical care":"Any painless lump or persistent swelling needs urgent medical review."}},{"title":"Varicocele","f":{"Meaning":"Enlarged veins inside the scrotum, like varicose veins.","Causes and risk factors":"Faulty valves, increased pressure, prolonged standing.","Symptoms to detect":"Dull ache, visible veins, heaviness, worse after standing.","Prevention and precautions":"Supportive underwear; avoid prolonged standing; maintain healthy weight.","Natural support and how to use":"Cold compress for discomfort; flavonoid-rich fruits and vegetables.","Exercise if needed":"Swimming, walking, and core strengthening; avoid heavy straining.","When to seek medical care":"See a urologist for pain, shrinkage, or fertility concerns."}},{"title":"Hydrocele","f":{"Meaning":"Fluid collects around a testicle, causing painless swelling.","Causes and risk factors":"Injury, infection, inflammation, or unknown causes.","Symptoms to detect":"Painless scrotal swelling, heaviness.","Prevention and precautions":"Protect the groin during sport; treat infections early.","Natural support and how to use":"No proven home remedy; supportive underwear may ease discomfort.","Exercise if needed":"Light walking only if comfortable.","When to seek medical care":"Persistent or growing swelling needs medical assessment."}},{"title":"Epididymitis","f":{"Meaning":"Inflammation of the tube behind the testicle, often from infection.","Causes and risk factors":"STIs, urinary infections, prostate infection, injury.","Symptoms to detect":"Testicular pain, swelling, fever, painful urination, discharge.","Prevention and precautions":"Safe sex; treat urinary infections; hydrate; avoid delaying urination.","Natural support and how to use":"Rest, cold pack, supportive underwear; no self-treatment instead of antibiotics when needed.","Exercise if needed":"Rest and gentle walking after recovery.","When to seek medical care":"Fever, severe pain, or discharge requires prompt medical care."}},{"title":"Male Infertility","f":{"Meaning":"A man cannot cause pregnancy despite regular unprotected sex.","Causes and risk factors":"Low sperm count, varicocele, hormones, infection, heat, smoking, alcohol.","Symptoms to detect":"Often no symptoms; sometimes low libido, testicular swelling, or erectile issues.","Prevention and precautions":"Avoid heat exposure, smoking, excessive alcohol, and anabolic steroids.","Natural support and how to use":"Zinc-rich pumpkin seeds, oysters, beans; folate-rich greens; antioxidant fruits; adequate sleep.","Exercise if needed":"Moderate exercise; avoid excessive cycling and overheating.","When to seek medical care":"See a fertility specialist after 12 months of trying, or earlier with known risk factors."}},{"title":"Low Sperm Count","f":{"Meaning":"Semen contains fewer sperm than needed for reliable conception.","Causes and risk factors":"Heat, smoking, alcohol, stress, infection, varicocele, poor diet.","Symptoms to detect":"Usually no symptoms; fertility difficulty is the main sign.","Prevention and precautions":"Keep testicles cool; avoid hot baths and laptops on the lap; quit smoking.","Natural support and how to use":"Pumpkin seeds, walnuts, eggs, citrus fruits, leafy greens, and adequate water.","Exercise if needed":"Moderate strength training and walking; avoid overtraining.","When to seek medical care":"Semen analysis is needed for diagnosis and treatment planning."}},{"title":"Premature Ejaculation","f":{"Meaning":"Ejaculation happens sooner than desired during sex.","Causes and risk factors":"Anxiety, overstimulation, inexperience, prostate inflammation, stress.","Symptoms to detect":"Ejaculation within a very short time, distress, avoidance of sex.","Prevention and precautions":"Slow breathing, reduce performance pressure, communicate with partner.","Natural support and how to use":"Pelvic-floor exercises: squeeze 5 seconds, relax 5 seconds, 10–15 repetitions twice daily.","Exercise if needed":"Kegel exercises, walking, and stress-reducing activity.","When to seek medical care":"Persistent distress or pain warrants a clinician or sex therapist."}},{"title":"Delayed Ejaculation","f":{"Meaning":"Ejaculation takes too long or does not occur despite stimulation.","Causes and risk factors":"Medications, diabetes, nerve problems, alcohol, stress, psychological factors.","Symptoms to detect":"Long-lasting arousal without release, frustration, relationship strain.","Prevention and precautions":"Review medicines with a doctor; reduce alcohol; manage stress.","Natural support and how to use":"General circulation-supporting foods: fish, nuts, leafy greens, water.","Exercise if needed":"Regular moderate exercise; pelvic-floor relaxation.","When to seek medical care":"Sudden onset or complete inability needs medical review."}},{"title":"Low Libido","f":{"Meaning":"Reduced interest in sex.","Causes and risk factors":"Stress, depression, low testosterone, poor sleep, medicines, relationship issues.","Symptoms to detect":"Reduced desire, fewer sexual thoughts, avoidance of intimacy.","Prevention and precautions":"Sleep, exercise, reduce alcohol, address stress and relationship communication.","Natural support and how to use":"Zinc-rich foods, eggs, fish, nuts, ginger, and adequate sleep.","Exercise if needed":"Strength training 3 times weekly and daily walking.","When to seek medical care":"Persistent loss of desire deserves hormone and medication review."}},{"title":"Peyronie’s Disease","f":{"Meaning":"Scar tissue inside the penis causes curvature or pain during erection.","Causes and risk factors":"Injury, genetics, connective-tissue disease.","Symptoms to detect":"Penile curve, lump, pain, difficulty with sex.","Prevention and precautions":"Protect the penis during sex and sport; avoid trauma.","Natural support and how to use":"No proven home cure; gentle stretching only with medical guidance.","Exercise if needed":"Avoid activities that worsen pain; general fitness is fine.","When to seek medical care":"See a urologist early—early treatment has better outcomes."}},{"title":"Balanitis","f":{"Meaning":"Inflammation of the head of the penis, often under the foreskin.","Causes and risk factors":"Poor hygiene, yeast, bacteria, irritation, diabetes.","Symptoms to detect":"Redness, itching, soreness, discharge, painful urination.","Prevention and precautions":"Wash gently with warm water; avoid harsh soaps; keep area dry; manage diabetes.","Natural support and how to use":"Warm saline rinse twice daily; plain unscented moisturizer; avoid irritants.","Exercise if needed":"None needed during active irritation.","When to seek medical care":"Pain, pus, fever, or recurring episodes need medical assessment."}},{"title":"Jock Itch","f":{"Meaning":"Fungal infection in the groin causing itching and rash.","Causes and risk factors":"Sweat, heat, tight clothing, shared towels, poor drying.","Symptoms to detect":"Red ring-shaped rash, itching, peeling, burning.","Prevention and precautions":"Dry the groin fully; change sweaty clothes; do not share towels.","Natural support and how to use":"Antifungal cream as directed; tea-tree oil diluted in carrier oil may help some people; wear loose cotton underwear.","Exercise if needed":"Avoid friction-heavy exercise until healed.","When to seek medical care":"Spreading rash, pus, or fever needs medical care."}},{"title":"Genital Herpes","f":{"Meaning":"A viral STI causing painful blisters or sores.","Causes and risk factors":"Herpes simplex virus through skin-to-skin sexual contact.","Symptoms to detect":"Tingling, blisters, sores, itching, flu-like symptoms.","Prevention and precautions":"Condoms reduce but do not eliminate risk; avoid sex during outbreaks.","Natural support and how to use":"Keep sores clean and dry; cold compress for comfort; manage stress and sleep.","Exercise if needed":"Avoid sexual activity during active sores.","When to seek medical care":"First outbreak, severe pain, or frequent recurrences need clinical care."}},{"title":"Gonorrhea","f":{"Meaning":"A bacterial STI that can infect the genitals, throat, or rectum.","Causes and risk factors":"Unprotected vaginal, anal, or oral sex.","Symptoms to detect":"Discharge, burning urination, testicular pain, sometimes no symptoms.","Prevention and precautions":"Condoms; regular STI testing; mutual monogamy.","Natural support and how to use":"No home remedy replaces antibiotics; hydration and rest support recovery.","Exercise if needed":"Avoid sex until treated and cleared.","When to seek medical care":"Untreated infection can cause infertility; get tested and treated."}},{"title":"Chlamydia","f":{"Meaning":"A common bacterial STI that often has no symptoms.","Causes and risk factors":"Unprotected sex.","Symptoms to detect":"Discharge, burning urination, testicular discomfort, or no symptoms.","Prevention and precautions":"Condoms and routine screening.","Natural support and how to use":"No home cure; complete prescribed antibiotics.","Exercise if needed":"Avoid sex until treatment is complete.","When to seek medical care":"Untreated chlamydia can damage fertility."}},{"title":"Syphilis","f":{"Meaning":"A bacterial STI that develops in stages if untreated.","Causes and risk factors":"Direct contact with a syphilis sore during sex.","Symptoms to detect":"Painless sore, rash, fever, swollen glands; later serious organ damage.","Prevention and precautions":"Condoms and testing; treat partners.","Natural support and how to use":"No home remedy replaces prescribed antibiotics.","Exercise if needed":"Avoid sex until treated and cleared.","When to seek medical care":"Any genital sore or unexplained rash needs testing."}},{"title":"HIV","f":{"Meaning":"A virus that weakens the immune system if untreated.","Causes and risk factors":"Unprotected sex, sharing needles, exposure to infected blood.","Symptoms to detect":"Early flu-like illness may occur; later years may have no symptoms.","Prevention and precautions":"Condoms; never share needles; regular testing; prevention medication when indicated.","Natural support and how to use":"Healthy food, sleep, and stress management support overall health but do not treat HIV.","Exercise if needed":"Moderate exercise supports immunity and mood.","When to seek medical care":"Test after possible exposure; modern treatment allows long, healthy lives."}},{"title":"HPV and Genital Warts","f":{"Meaning":"A common viral infection that can cause warts and some cancers.","Causes and risk factors":"Skin-to-skin sexual contact.","Symptoms to detect":"Warts, itching, sometimes no symptoms.","Prevention and precautions":"HPV vaccination where available; condoms; regular screening.","Natural support and how to use":"Do not cut or burn warts; keep area clean and dry.","Exercise if needed":"Avoid friction until warts are treated.","When to seek medical care":"Persistent or bleeding warts need clinical treatment."}},{"title":"Urinary Tract Infection","f":{"Meaning":"Bacteria infect the urinary system.","Causes and risk factors":"Poor hygiene, dehydration, holding urine, prostate problems, STIs.","Symptoms to detect":"Burning urination, urgency, cloudy urine, pelvic discomfort, fever.","Prevention and precautions":"Drink water; urinate when needed; practice good hygiene; treat prostate issues.","Natural support and how to use":"Water, cranberry juice without added sugar, barley water, and probiotic foods.","Exercise if needed":"Gentle walking; avoid cycling during flare-ups.","When to seek medical care":"Fever, back pain, vomiting, or blood in urine needs urgent care."}},{"title":"Kidney Stones","f":{"Meaning":"Hard mineral deposits form in the kidneys and can block urine flow.","Causes and risk factors":"Low water intake, high salt, excess animal protein, family history.","Symptoms to detect":"Severe side or back pain, blood in urine, nausea, painful urination.","Prevention and precautions":"Drink enough water; reduce salt; moderate animal protein; eat citrate-rich fruits.","Natural support and how to use":"Lemon water daily; watermelon and cucumber; reduce salt and cola.","Exercise if needed":"Walk daily; avoid intense exercise during severe pain.","When to seek medical care":"Severe pain, fever, vomiting, or inability to pass urine is an emergency."}},{"title":"Chronic Kidney Disease","f":{"Meaning":"Kidneys gradually lose their ability to filter waste.","Causes and risk factors":"Diabetes, high BP, smoking, repeated infections, some painkillers.","Symptoms to detect":"Swollen feet, fatigue, poor appetite, foamy urine, high BP.","Prevention and precautions":"Control BP and sugar; avoid unnecessary painkillers; stay hydrated.","Natural support and how to use":"Water, berries, cabbage, garlic, and moderate protein; avoid herbal products that stress kidneys.","Exercise if needed":"Gentle walking 30 minutes most days.","When to seek medical care":"Foamy urine, swelling, or reduced urination needs prompt testing."}},{"title":"Gout","f":{"Meaning":"Uric acid crystals cause sudden joint inflammation, often in the big toe.","Causes and risk factors":"Red meat, alcohol, sugary drinks, dehydration, kidney issues, genetics.","Symptoms to detect":"Sudden intense joint pain, redness, swelling, warmth.","Prevention and precautions":"Limit beer, sugary drinks, and organ meats; hydrate; maintain healthy weight.","Natural support and how to use":"Cherries or cherry juice, celery, water, lemon water, and vitamin-C-rich fruits.","Exercise if needed":"Gentle walking between attacks; avoid stressing an inflamed joint.","When to seek medical care":"Hot, swollen joint with fever needs urgent care."}},{"title":"Arthritis","f":{"Meaning":"Joint inflammation causing pain, stiffness, and reduced movement.","Causes and risk factors":"Aging, injury, excess weight, autoimmune disease, repetitive strain.","Symptoms to detect":"Joint pain, morning stiffness, swelling, reduced range of motion.","Prevention and precautions":"Maintain healthy weight; avoid joint overuse; strengthen supporting muscles.","Natural support and how to use":"Turmeric with black pepper in food or warm milk; ginger tea; omega-3 fish.","Exercise if needed":"Low-impact exercise: swimming, cycling, walking, gentle strength work.","When to seek medical care":"Hot, red, severely swollen joint or fever needs medical care."}},{"title":"Lower Back Pain","f":{"Meaning":"Pain or stiffness between the ribs and hips.","Causes and risk factors":"Heavy lifting, sitting, weak core, poor posture, disc problems.","Symptoms to detect":"Ache, sharp pain, stiffness, muscle spasm, leg pain.","Prevention and precautions":"Lift with legs; move every 30–45 minutes; strengthen core.","Natural support and how to use":"Heat for tight muscles; ice after new injury; turmeric and ginger in food.","Exercise if needed":"Knee-to-chest stretch, cat-cow, glute bridges, bird-dogs, walking.","When to seek medical care":"Numb groin, leg weakness, or bladder/bowel control loss is an emergency."}},{"title":"Neck Pain","f":{"Meaning":"Pain or stiffness in the neck muscles or joints.","Causes and risk factors":"Phone use, poor posture, stress, sleeping position, injury.","Symptoms to detect":"Stiffness, headache, reduced turning, shoulder pain.","Prevention and precautions":"Raise screens to eye level; take breaks; use supportive pillow.","Natural support and how to use":"Heat pack 15 minutes; gentle massage; magnesium-rich foods like nuts and greens.","Exercise if needed":"Chin tucks, shoulder rolls, gentle side stretches.","When to seek medical care":"Numbness, weakness, or pain after injury needs assessment."}},{"title":"Frozen Shoulder","f":{"Meaning":"Shoulder becomes stiff and painful, limiting movement.","Causes and risk factors":"Injury, diabetes, immobility, inflammation.","Symptoms to detect":"Gradual pain and inability to lift or rotate the arm.","Prevention and precautions":"Keep the shoulder gently moving; manage diabetes; avoid sudden overload.","Natural support and how to use":"Warm compress before stretching; anti-inflammatory foods like ginger and fish.","Exercise if needed":"Pendulum swings, wall climbs, towel stretches—gentle and pain-limited.","When to seek medical care":"Sudden inability to move the shoulder needs evaluation."}},{"title":"Tennis Elbow","f":{"Meaning":"Tendon pain on the outside of the elbow from repetitive strain.","Causes and risk factors":"Repetitive gripping, typing, lifting, racquet sports.","Symptoms to detect":"Outer-elbow pain, weak grip, pain when lifting.","Prevention and precautions":"Improve technique; take breaks; strengthen forearm muscles.","Natural support and how to use":"Ice after activity; warm compress before stretching; omega-3 foods.","Exercise if needed":"Wrist extensor stretches and eccentric wrist exercises with light weight.","When to seek medical care":"Persistent weakness or severe pain needs clinical review."}},{"title":"Knee Pain","f":{"Meaning":"Pain around the knee from injury, arthritis, or overuse.","Causes and risk factors":"Excess weight, weak thighs, poor form, old injury, running load.","Symptoms to detect":"Pain, swelling, stiffness, clicking, instability.","Prevention and precautions":"Strengthen thighs and glutes; maintain healthy weight; use proper footwear.","Natural support and how to use":"Turmeric and ginger in food; cold pack after activity; adequate protein.","Exercise if needed":"Straight-leg raises, wall sits, glute bridges, cycling with proper seat height.","When to seek medical care":"Locking, giving way, or major swelling needs assessment."}},{"title":"Plantar Fasciitis","f":{"Meaning":"Inflammation of the tissue along the bottom of the foot.","Causes and risk factors":"Long standing, tight calves, poor shoes, flat feet, excess weight.","Symptoms to detect":"Heel pain, especially with first steps in the morning.","Prevention and precautions":"Supportive shoes; avoid walking barefoot on hard floors; stretch calves.","Natural support and how to use":"Ice-bottle massage for 10 minutes; foot rolling on a ball; magnesium-rich foods.","Exercise if needed":"Calf stretches, towel stretches, toe curls, and calf raises.","When to seek medical care":"Persistent pain or numbness deserves professional assessment."}},{"title":"Osteoporosis in Men","f":{"Meaning":"Bones become weak and fracture more easily.","Causes and risk factors":"Aging, low testosterone, smoking, alcohol, low calcium/vitamin D, inactivity.","Symptoms to detect":"Often silent until a fracture; height loss or back pain may occur.","Prevention and precautions":"Weight-bearing exercise, calcium, vitamin D, no smoking, limit alcohol.","Natural support and how to use":"Dairy or fortified alternatives, sardines, leafy greens, eggs, sunlight exposure.","Exercise if needed":"Walking, stair climbing, and resistance training 2–3 times weekly.","When to seek medical care":"Sudden back pain or fracture needs urgent assessment."}},{"title":"Muscle Loss (Sarcopenia)","f":{"Meaning":"Age-related loss of muscle mass and strength.","Causes and risk factors":"Inactivity, low protein, aging, illness, low testosterone.","Symptoms to detect":"Weakness, slower movement, fatigue, falls, reduced grip strength.","Prevention and precautions":"Eat enough protein; resistance train; avoid prolonged inactivity.","Natural support and how to use":"Eggs, fish, beans, dairy, nuts; vitamin D through sunlight or fortified foods.","Exercise if needed":"Strength training 2–3 times weekly; walking daily.","When to seek medical care":"Rapid weakness or weight loss needs medical evaluation."}},{"title":"Vitamin D Deficiency","f":{"Meaning":"Too little vitamin D affects bones, muscles, immunity, and mood.","Causes and risk factors":"Low sunlight, dark skin, indoor lifestyle, obesity, poor diet.","Symptoms to detect":"Fatigue, bone or muscle pain, low mood, frequent illness.","Prevention and precautions":"Get sensible sunlight; eat oily fish and eggs; maintain healthy weight.","Natural support and how to use":"Sunlight 15–30 minutes several times weekly; salmon, sardines, eggs, fortified milk.","Exercise if needed":"Outdoor walking and resistance training.","When to seek medical care":"Severe pain, fractures, or persistent fatigue warrants a blood test."}},{"title":"Iron Deficiency Anemia","f":{"Meaning":"Too little iron reduces the blood’s oxygen-carrying capacity.","Causes and risk factors":"Blood loss, poor diet, ulcers, kidney disease, poor absorption.","Symptoms to detect":"Fatigue, pale skin, breathlessness, dizziness, fast heartbeat.","Prevention and precautions":"Eat iron-rich foods with vitamin C; investigate ongoing blood loss.","Natural support and how to use":"Beans, liver, red meat, spinach, pumpkin seeds, citrus fruits.","Exercise if needed":"Light-to-moderate exercise; avoid intense training while symptomatic.","When to seek medical care":"Black stools, chest pain, fainting, or severe breathlessness need urgent care."}},{"title":"Vitamin B12 Deficiency","f":{"Meaning":"Low B12 affects nerves, blood cells, and energy.","Causes and risk factors":"Poor diet, stomach issues, alcohol, some medicines, aging.","Symptoms to detect":"Tingling, fatigue, memory issues, pale skin, balance problems.","Prevention and precautions":"Include animal foods or fortified foods; limit alcohol.","Natural support and how to use":"Eggs, fish, meat, dairy, fortified cereals; B12 supplements only after testing if needed.","Exercise if needed":"Moderate walking and balance work.","When to seek medical care":"Numbness, weakness, or balance problems need prompt assessment."}},{"title":"Zinc Deficiency","f":{"Meaning":"Low zinc can affect immunity, healing, hormones, and fertility.","Causes and risk factors":"Poor diet, alcohol, digestive disease, aging.","Symptoms to detect":"Slow healing, frequent infections, hair loss, low appetite, taste changes.","Prevention and precautions":"Eat zinc-rich foods regularly; limit alcohol.","Natural support and how to use":"Pumpkin seeds, oysters, meat, beans, nuts, whole grains.","Exercise if needed":"Regular resistance training supports overall health.","When to seek medical care":"Persistent symptoms should be confirmed with testing before high-dose supplements."}},{"title":"Insomnia","f":{"Meaning":"Difficulty falling asleep, staying asleep, or waking unrefreshed.","Causes and risk factors":"Stress, caffeine, screens, alcohol, pain, irregular schedule.","Symptoms to detect":"Trouble sleeping, daytime tiredness, irritability, poor focus.","Prevention and precautions":"Fixed sleep time; no caffeine after 2 p.m.; dark quiet room.","Natural support and how to use":"Chamomile tea 30–60 minutes before bed; warm milk; banana and almonds.","Exercise if needed":"Morning walks and gentle evening stretching; avoid intense late workouts.","When to seek medical care":"Loud snoring, gasping, or severe daytime sleepiness needs sleep assessment."}},{"title":"Sleep Apnea","f":{"Meaning":"Breathing repeatedly stops during sleep.","Causes and risk factors":"Obesity, large neck, alcohol, nasal blockage, anatomy.","Symptoms to detect":"Loud snoring, gasping, morning headache, daytime sleepiness.","Prevention and precautions":"Lose excess weight; avoid alcohol at night; sleep on the side; treat nasal blockage.","Natural support and how to use":"Weight-loss foods, nasal saline rinse, avoiding late heavy meals.","Exercise if needed":"Daily walking and strength training; avoid sedatives before bed.","When to seek medical care":"Untreated apnea raises heart and blood-pressure risk; get tested."}},{"title":"Snoring","f":{"Meaning":"Noisy breathing during sleep due to airflow vibration.","Causes and risk factors":"Nasal blockage, alcohol, obesity, sleeping on the back, smoking.","Symptoms to detect":"Noise during sleep, dry mouth, poor-quality sleep.","Prevention and precautions":"Sleep on the side; reduce alcohol; treat nasal congestion; maintain healthy weight.","Natural support and how to use":"Steam inhalation or saline rinse before bed; avoid heavy late meals.","Exercise if needed":"Regular exercise and weight management.","When to seek medical care":"Pauses in breathing or daytime sleepiness needs sleep evaluation."}},{"title":"Chronic Stress","f":{"Meaning":"Ongoing pressure keeps the body in a heightened alarm state.","Causes and risk factors":"Work, money, relationships, poor sleep, overcommitment.","Symptoms to detect":"Tension, irritability, headaches, poor sleep, low energy.","Prevention and precautions":"Boundaries, breaks, exercise, social support, reduced stimulants.","Natural support and how to use":"Deep breathing 4-7-8; journaling; chamomile or ginger tea; sunlight.","Exercise if needed":"Walk 20–30 minutes daily; stretching or yoga.","When to seek medical care":"Self-harm thoughts, panic attacks, or inability to function need urgent help."}},{"title":"Anxiety","f":{"Meaning":"Excessive worry, fear, or physical tension that is hard to control.","Causes and risk factors":"Genetics, stress, trauma, caffeine, poor sleep, health worries.","Symptoms to detect":"Racing heart, restlessness, worry, muscle tension, sleep problems.","Prevention and precautions":"Reduce caffeine; breathe slowly; maintain routine; talk to someone.","Natural support and how to use":"Chamomile tea; magnesium-rich nuts and greens; breathing exercises.","Exercise if needed":"Walking, yoga, swimming, and slow strength training.","When to seek medical care":"Panic attacks, chest pain, or inability to cope need professional care."}},{"title":"Depression","f":{"Meaning":"Persistent low mood, loss of interest, and reduced functioning.","Causes and risk factors":"Genetics, stress, isolation, illness, substance use, poor sleep.","Symptoms to detect":"Sadness, hopelessness, fatigue, appetite or sleep changes, withdrawal "Prevention and precautions":"Set alcohol-free days; avoid triggers; seek support groups.","Natural support and how to use":"Water, electrolytes, B-vitamin-rich foods, and medical supervision for withdrawal.","Exercise if needed":"Walking and light strength training once stable.","When to seek medical care":"Tremors, seizures, confusion, or inability to stop drinking need urgent care."}},{"title":"Smoking and Nicotine Addiction","f":{"Meaning":"Dependence on nicotine from cigarettes or vaping.","Causes and risk factors":"Nicotine dependence, stress, habit, social triggers.","Symptoms to detect":"Cravings, cough, breathlessness, reduced stamina.","Prevention and precautions":"Set a quit date; avoid triggers; use support; replace hand-to-mouth habits.","Natural support and how to use":"Water, fruit, sugar-free gum, deep breathing; avoid alcohol during quitting.","Exercise if needed":"Daily walking improves lung recovery and reduces cravings.","When to seek medical care":"Chest pain, coughing blood, or severe breathlessness needs urgent care."}},{"title":"Drug Misuse","f":{"Meaning":"Use of illegal or misused substances that harms health or life circumstances.","Causes and risk factors":"Addiction, trauma, peer pressure, stress.","Symptoms to detect":"Cravings, mood swings, neglect, financial or legal problems.","Prevention and precautions":"Avoid triggers; seek treatment; build accountability.","Natural support and how to use":"Medical supervision is essential; nutrition, hydration, and sleep support recovery.","Exercise if needed":"Gentle exercise once stable; avoid training while intoxicated.","When to seek medical care":"Overdose signs—unconsciousness, slow breathing, seizures—need emergency help."}},{"title":"Pornography Compulsion","f":{"Meaning":"Repeated porn use that feels uncontrollable or harms life and intimacy.","Causes and risk factors":"Stress, loneliness, boredom, habit loops, easy access.","Symptoms to detect":"Loss of control, secrecy, reduced real-life intimacy, guilt.","Prevention and precautions":"Block triggers; replace routine; build real connection; seek counseling.","Natural support and how to use":"Exercise, sunlight, journaling, social activities, and adequate sleep.","Exercise if needed":"Strength training and outdoor activities to rebuild routine.","When to seek medical care":"Distress, depression, or relationship breakdown warrants professional support."}},{"title":"Gaming and Screen Addiction","f":{"Meaning":"Excessive screen use that displaces sleep, work, and relationships.","Causes and risk factors":"Dopamine loops, stress, loneliness, poor boundaries.","Symptoms to detect":"Sleep loss, eye strain, irritability, missed responsibilities.","Prevention and precautions":"Set time limits; no screens 1 hour before bed; create offline hobbies.","Natural support and how to use":"Blue-light reduction, hydration, regular meals, outdoor time.","Exercise if needed":"Outdoor walks, sports, and strength training.","When to seek medical care":"If work, study, or relationships are collapsing, seek behavioral support."}},{"title":"Migraine","f":{"Meaning":"Intense headache often with nausea, light, or sound sensitivity.","Causes and risk factors":"Triggers include stress, poor sleep, dehydration, alcohol, certain foods.","Symptoms to detect":"Throbbing headache, nausea, visual aura, light sensitivity.","Prevention and precautions":"Track triggers; regular sleep and meals; hydrate; reduce alcohol.","Natural support and how to use":"Ginger tea for nausea; magnesium-rich foods; hydration.","Exercise if needed":"Gentle walking between attacks; avoid intense exercise during an attack.","When to seek medical care":"Sudden worst-ever headache, weakness, or confusion is an emergency."}},{"title":"Tension Headache","f":{"Meaning":"Band-like pressure headache from muscle tension and stress.","Causes and risk factors":"Stress, poor posture, screen strain, dehydration, poor sleep.","Symptoms to detect":"Dull pressure across the forehead or back of the head.","Prevention and precautions":"Hydrate; improve posture; take screen breaks; manage stress.","Natural support and how to use":"Water, magnesium-rich foods, warm compress on neck and shoulders.","Exercise if needed":"Neck stretches, shoulder rolls, chin tucks, walking.","When to seek medical care":"Headache with fever, weakness, vision change, or confusion needs urgent care."}},{"title":"Acid Reflux (GERD)","f":{"Meaning":"Stomach acid moves into the food pipe, causing burning.","Causes and risk factors":"Large meals, lying down after eating, alcohol, spicy food, obesity.","Symptoms to detect":"Heartburn, sour taste, burping, cough, sore throat.","Prevention and precautions":"Smaller meals; no food 3 hours before bed; reduce alcohol and fried food.","Natural support and how to use":"Ginger tea after meals; ripe papaya; oatmeal; avoid late-night spicy food.","Exercise if needed":"Walk 10–15 minutes after meals; avoid crunches after eating.","When to seek medical care":"Chest pain with sweating or breathlessness is an emergency; swallowing difficulty needs assessment."}},{"title":"Constipation","f":{"Meaning":"Infrequent or difficult bowel movements.","Causes and risk factors":"Low fiber, low water, inactivity, ignoring urges, some medicines.","Symptoms to detect":"Hard stool, straining, bloating, belly discomfort.","Prevention and precautions":"More fiber and water; move daily; do not delay toilet visits.","Natural support and how to use":"Papaya, prunes, oats, beans, flaxseed in pap or yogurt, warm lemon water.","Exercise if needed":"Walk 20–30 minutes daily; yoga twists and gentle core movement.","When to seek medical care":"Blood in stool, severe pain, vomiting, or no stool with swelling needs care."}},{"title":"Diarrhea","f":{"Meaning":"Frequent loose or watery stools.","Causes and risk factors":"Infection, food poisoning, stress, lactose intolerance, medicines.","Symptoms to detect":"Loose stools, cramps, dehydration, urgency.","Prevention and precautions":"Hydrate; eat simple foods; practice food hygiene.","Natural support and how to use":"Oral rehydration solution; rice, banana, toast, yogurt; ginger tea.","Exercise if needed":"Rest; avoid intense exercise until recovered.","When to seek medical care":"Blood, high fever, severe dehydration, or symptoms beyond 2 days need care."}},{"title":"Hemorrhoids","f":{"Meaning":"Swollen veins in the rectum or anus.","Causes and risk factors":"Straining, constipation, prolonged sitting, heavy lifting, low fiber.","Symptoms to detect":"Pain, itching, bleeding during bowel movements, lumps.","Prevention and precautions":"High-fiber diet; avoid straining; do not sit too long; keep the area clean.","Natural support and how to use":"Warm sitz bath 10–15 minutes; witch hazel compress; psyllium or flaxseed with water.","Exercise if needed":"Walking and gentle core work; avoid heavy straining.","When to seek medical care":"Heavy bleeding, severe pain, or a hard painful lump needs assessment."}},{"title":"Irritable Bowel Syndrome","f":{"Meaning":"A gut disorder causing abdominal pain and changed bowel habits.","Causes and risk factors":"Stress, food triggers, irregular meals, gut sensitivity.","Symptoms to detect":"Cramps, bloating, diarrhea, constipation, mucus in stool.","Prevention and precautions":"Identify triggers; eat regularly; manage stress; avoid overeating.","Natural support and how to use":"Ginger, peppermint tea, oats, bananas, rice; keep a food diary.","Exercise if needed":"Walking, yoga, and breathing exercises.","When to seek medical care":"Blood in stool, weight loss, fever, or night symptoms need investigation."}},{"title":"Stomach Ulcer","f":{"Meaning":"A sore in the stomach or upper intestine lining.","Causes and risk factors":"H. pylori infection, painkillers, alcohol, smoking, stress.","Symptoms to detect":"Burning stomach pain, bloating, nausea, pain when hungry.","Prevention and precautions":"Avoid excess alcohol and unnecessary painkillers; eat regular meals; stop smoking.","Natural support and how to use":"Cabbage juice, honey, oats, bananas, probiotic yogurt; avoid spicy irritants during flare-ups.","Exercise if needed":"Light walking; avoid core exercises during pain.","When to seek medical care":"Vomiting blood or black stools is an emergency."}},{"title":"Food Poisoning","f":{"Meaning":"Illness from contaminated food or water.","Causes and risk factors":"Bacteria, viruses, toxins, poor storage or undercooking.","Symptoms to detect":"Vomiting, diarrhea, cramps, fever, weakness.","Prevention and precautions":"Wash hands; cook food thoroughly; refrigerate leftovers; avoid questionable street food.","Natural support and how to use":"Oral rehydration, ginger tea, rice, banana, toast, probiotic foods.","Exercise if needed":"Rest until recovered.","When to seek medical care":"Blood in stool, high fever, confusion, or inability to keep fluids down needs urgent care."}},{"title":"Bad Breath","f":{"Meaning":"Persistent unpleasant mouth odor.","Causes and risk factors":"Poor oral hygiene, dry mouth, gum disease, smoking, gut issues.","Symptoms to detect":"Odor, coating on tongue, dry mouth, gum bleeding.","Prevention and precautions":"Brush twice daily; clean the tongue; floss; hydrate; quit smoking.","Natural support and how to use":"Parsley, mint, green tea, water, crunchy fruits and vegetables.","Exercise if needed":"General fitness is fine; no special exercise needed.","When to seek medical care":"Persistent odor despite hygiene may signal gum disease, sinus, or gut problems."}},{"title":"Tooth Decay and Gum Disease","f":{"Meaning":"Damage to teeth and inflammation of gums from plaque and bacteria.","Causes and risk factors":"Sugary food, poor brushing, smoking, dry mouth, diabetes.","Symptoms to detect":"Tooth pain, sensitivity, bleeding gums, bad breath, loose teeth.","Prevention and precautions":"Brush twice daily; floss; reduce sugar; dental checkups.","Natural support and how to use":"Salt-water rinse; clove oil for temporary tooth discomfort; green tea.","Exercise if needed":"General exercise is fine; avoid heavy lifting during acute dental infection.","When to seek medical care":"Facial swelling, fever, or difficulty swallowing needs urgent dental/medical care."}},{"title":"Hair Loss","f":{"Meaning":"Thinning or loss of scalp hair.","Causes and risk factors":"Genetics, stress, low iron or vitamin D, thyroid issues, harsh products.","Symptoms to detect":"Receding hairline, thinning crown, shedding, bald patches.","Prevention and precautions":"Manage stress; avoid tight hairstyles and harsh chemicals; eat well.","Natural support and how to use":"Onion juice or rosemary oil diluted in carrier oil, applied to scalp 2–3 times weekly; eggs, fish, nuts, spinach.","Exercise if needed":"Moderate exercise supports circulation and stress control.","When to seek medical care":"Sudden patchy loss or scalp inflammation needs dermatology review."}},{"title":"Dandruff","f":{"Meaning":"Flaking and itching of the scalp.","Causes and risk factors":"Dry skin, fungal overgrowth, product buildup, stress, seborrheic dermatitis.","Symptoms to detect":"White flakes, itching, scalp redness.","Prevention and precautions":"Wash regularly; avoid heavy oily products; manage stress.","Natural support and how to use":"Tea-tree oil diluted in shampoo; apple-cider vinegar rinse diluted with water; aloe vera gel.","Exercise if needed":"General exercise is fine; wash sweat from the scalp after workouts.","When to seek medical care":"Severe inflammation, sores, or hair loss needs dermatology care."}},{"title":"Acne","f":{"Meaning":"Blocked and inflamed skin pores causing pimples.","Causes and risk factors":"Oil, bacteria, hormones, sweat, diet, harsh products.","Symptoms to detect":"Pimples, blackheads, oily skin, scarring.","Prevention and precautions":"Wash after sweating; avoid picking; use non-comedogenic products.","Natural support and how to use":"Honey mask, aloe vera gel, tea-tree oil diluted in carrier oil; reduce high-sugar foods.","Exercise if needed":"Sweat-producing exercise is fine if you shower afterward.","When to seek medical care":"Painful cysts, spreading infection, or scarring needs dermatology care."}},{"title":"Eczema","f":{"Meaning":"Chronic itchy, inflamed skin patches.","Causes and risk factors":"Genetics, irritants, allergens, stress, dry skin.","Symptoms to detect":"Dry patches, itching, redness, cracking.","Prevention and precautions":"Moisturize; avoid harsh soaps; identify triggers; manage stress.","Natural support and how to use":"Colloidal oatmeal bath; coconut oil or aloe vera on mild dry patches; omega-3 foods.","Exercise if needed":"Avoid excessive sweating friction during flare-ups; choose breathable clothing.","When to seek medical care":"Infected, oozing, or widespread eczema needs medical treatment."}},{"title":"Psoriasis","f":{"Meaning":"An immune condition causing thick, scaly skin patches.","Causes and risk factors":"Immune system, genetics, stress, infections, alcohol, smoking.","Symptoms to detect":"Red patches with silvery scales, itching, joint pain.","Prevention and precautions":"Moisturize; reduce alcohol and smoking; manage stress; avoid skin injury.","Natural support and how to use":"Aloe vera, oatmeal baths, omega-3 fish, sunlight in moderation.","Exercise if needed":"Low-impact exercise; protect joints if psoriatic arthritis is suspected.","When to seek medical care":"Joint pain or widespread flare needs medical care."}},{"title":"Fungal Skin Infection","f":{"Meaning":"Fungal growth on skin causing itchy, scaly patches.","Causes and risk factors":"Sweat, moisture, shared items, weakened immunity, poor drying.","Symptoms to detect":"Itchy ring-like patches, peeling, discoloration.","Prevention and precautions":"Dry skin fully; do not share towels; wear breathable clothes.","Natural support and how to use":"Antifungal cream as directed; diluted tea-tree oil; keep skin dry.","Exercise if needed":"Avoid shared gym mats without a towel; shower after workouts.","When to seek medical care":"Spreading rash, pus, or fever needs medical care."}},{"title":"Body Odor","f":{"Meaning":"Strong smell from sweat interacting with skin bacteria.","Causes and risk factors":"Sweat, poor hygiene, diet, stress, some medical conditions.","Symptoms to detect":"Strong underarm, foot, or body odor.","Prevention and precautions":"Shower daily; dry well; wear clean breathable clothes; reduce alcohol and garlic if sensitive.","Natural support and how to use":"Baking-soda paste briefly under arms; apple-cider vinegar diluted as a rinse; tea-tree oil in wash.","Exercise if needed":"Regular exercise is healthy; shower promptly afterward.","When to seek medical care":"Sudden major odor change with other symptoms needs medical review."}},{"title":"Excessive Sweating","f":{"Meaning":"Sweating more than needed for temperature control.","Causes and risk factors":"Heat, anxiety, hyperthyroidism, obesity, medications, genetics.","Symptoms to detect":"Wet underarms, palms, feet, or night sweats.","Prevention and precautions":"Breathable fabrics; antiperspirant; stress management; avoid triggers.","Natural support and how to use":"Sage tea in moderation; apple-cider vinegar foot soak; stay hydrated.","Exercise if needed":"Regular exercise; choose moisture-wicking clothing.","When to seek medical care":"Night sweats with weight loss, fever, or swollen glands need assessment."}},{"title":"Eye Strain","f":{"Meaning":"Tired, uncomfortable eyes from prolonged screen or close work.","Causes and risk factors":"Screens, poor lighting, uncorrected vision, dry air.","Symptoms to detect":"Blurry vision, headaches, dry eyes, neck pain.","Prevention and precautions":"20-20-20 rule: every 20 minutes look 20 feet away for 20 seconds; proper lighting.","Natural support and how to use":"Blink often; warm compress; omega-3 foods; stay hydrated.","Exercise if needed":"Neck and shoulder stretches; outdoor walking reduces near-work strain.","When to seek medical care":"Sudden vision loss, flashes, or severe eye pain is an emergency."}},{"title":"Dry Eyes","f":{"Meaning":"Insufficient tears or poor tear quality.","Causes and risk factors":"Screens, aging, contact lenses, dry air, some medicines.","Symptoms to detect":"Burning, grittiness, redness, blurry vision.","Prevention and precautions":"Blink deliberately; humidify rooms; take screen breaks.","Natural support and how to use":"Warm compress; omega-3-rich fish; hydration.","Exercise if needed":"Gentle neck stretches and outdoor walks.","When to seek medical care":"Pain, light sensitivity, or vision change needs an eye professional."}},{"title":"Hearing Loss","f":{"Meaning":"Reduced ability to hear sounds.","Causes and risk factors":"Loud noise, aging, earwax, infections, some medicines.","Symptoms to detect":"Asking people to repeat, raised TV volume, ringing ears.","Prevention and precautions":"Avoid loud headphones; use ear protection at noisy events; treat ear infections.","Natural support and how to use":"Do not insert objects into the ear; warm compress for mild discomfort; see a professional for wax.","Exercise if needed":"General fitness is fine; avoid loud environments without protection.","When to seek medical care":"Sudden hearing loss is an emergency."}},{"title":"Tinnitus","f":{"Meaning":"Ringing, buzzing, or hissing in the ears without outside sound.","Causes and risk factors":"Noise exposure, earwax, ear infection, stress, some medicines, BP issues.","Symptoms to detect":"Persistent ringing or buzzing, sleep disruption, concentration problems.","Prevention and precautions":"Protect hearing; reduce caffeine and alcohol if they worsen it; manage stress.","Natural support and how to use":"Ginkgo evidence is mixed; prioritize sleep, hydration, and stress reduction; avoid inserting anything into ears.","Exercise if needed":"Relaxation exercises, walking, and good sleep habits.","When to seek medical care":"One-sided ringing with hearing loss or dizziness needs urgent assessment."}},{"title":"Allergies","f":{"Meaning":"Immune overreaction to substances like dust, pollen, or food.","Causes and risk factors":"Genetics, exposure, season, indoor dust, certain foods.","Symptoms to detect":"Sneezing, itching, runny nose, rash, watery eyes.","Prevention and precautions":"Reduce dust; wash bedding; avoid known triggers; keep windows managed during high pollen.","Natural support and how to use":"Local honey evidence is limited; saline nasal rinse; vitamin-C-rich fruits; steam inhalation.","Exercise if needed":"Outdoor exercise may worsen pollen allergies; choose indoor workouts during flare-ups.","When to seek medical care":"Trouble breathing, facial swelling, or collapse is an emergency."}},{"title":"Asthma","f":{"Meaning":"Airway inflammation causing breathing difficulty.","Causes and risk factors":"Genetics, allergens, smoke, respiratory infections, exercise triggers.","Symptoms to detect":"Wheezing, cough, chest tightness, breathlessness.","Prevention and precautions":"Avoid smoke and triggers; use prescribed inhalers correctly; stay active safely.","Natural support and how to use":"Warm fluids, ginger, vitamin-C-rich foods; avoid known triggers.","Exercise if needed":"Swimming, walking, and interval training with a doctor-approved asthma plan.","When to seek medical care":"Severe breathlessness, blue lips, or no relief from inhaler is an emergency."}},{"title":"Sinusitis","f":{"Meaning":"Inflammation or infection of the sinus passages.","Causes and risk factors":"Cold, allergies, nasal blockage, bacterial infection.","Symptoms to detect":"Facial pressure, blocked nose, headache, thick mucus, reduced smell.","Prevention and precautions":"Steam inhalation; saline rinse; hydrate; avoid smoke.","Natural support and how to use":"Steam with eucalyptus or ginger; warm compress over sinuses; spicy foods may temporarily clear passages.","Exercise if needed":"Light walking; avoid strenuous exercise during fever.","When to seek medical care":"Swelling around the eye, high fever, confusion, or vision change is an emergency."}},{"title":"Cold and Flu","f":{"Meaning":"Viral infections of the nose, throat, and sometimes lungs.","Causes and risk factors":"Viruses spread through droplets and contact.","Symptoms to detect":"Sneezing, sore throat, cough, fever, body aches.","Prevention and precautions":"Hand hygiene; avoid close contact when sick; sleep and hydration.","Natural support and how to use":"Ginger, garlic, honey in warm water, citrus fruits, chicken or vegetable soup, steam inhalation.","Exercise if needed":"Rest first; resume light walking after fever resolves.","When to seek medical care":"Difficulty breathing, chest pain, confusion, or persistent high fever needs care."}},{"title":"Pneumonia Risk","f":{"Meaning":"Lung infection that fills air sacs with fluid or pus.","Causes and risk factors":"Bacteria, viruses, smoking, weak immunity, flu complications.","Symptoms to detect":"Fever, cough, chest pain, breathlessness, fatigue.","Prevention and precautions":"Vaccination where available; quit smoking; treat flu early; hand hygiene.","Natural support and how to use":"Garlic, ginger, turmeric, warm fluids, protein-rich foods for recovery.","Exercise if needed":"Rest during illness; gradual walking during recovery.","When to seek medical care":"Breathlessness, blue lips, confusion, or chest pain is an emergency."}},{"title":"Tuberculosis (TB)","f":{"Meaning":"Bacterial infection that mainly affects the lungs.","Causes and risk factors":"Close contact with an infected person, weak immunity, crowded living.","Symptoms to detect":"Cough over 2 weeks, night sweats, weight loss, fever, coughing blood.","Prevention and precautions":"Ventilate rooms; cover coughs; complete treatment; get tested after exposure.","Natural support and how to use":"Nutritious food, protein, eggs, beans, and fruits support recovery but do not cure TB.","Exercise if needed":"Rest during treatment; resume activity gradually.","When to seek medical care":"Coughing blood or severe breathlessness needs urgent care."}},{"title":"Malaria","f":{"Meaning":"Parasitic infection transmitted by infected mosquitoes.","Causes and risk factors":"Mosquito bites in endemic areas.","Symptoms to detect":"Fever, chills, headache, body pain, vomiting, fatigue.","Prevention and precautions":"Sleep under treated nets; use repellent; remove stagnant water; screen windows.","Natural support and how to use":"Hydration, electrolytes, light foods; no home remedy replaces antimalarial medicine.","Exercise if needed":"Rest during illness; resume activity after recovery.","When to seek medical care":"Severe malaria can be fatal; fever in a malaria area needs prompt testing."}},{"title":"Typhoid","f":{"Meaning":"Bacterial infection from contaminated food or water.","Causes and risk factors":"Unsafe water, poor sanitation, contaminated food.","Symptoms to detect":"Fever, weakness, stomach pain, constipation or diarrhea, headache.","Prevention and precautions":"Drink safe water; wash hands; avoid unverified street food; vaccinate where appropriate.","Natural support and how to use":"Oral rehydration, rice, banana, toast, yogurt; complete prescribed antibiotics.","Exercise if needed":"Rest until fully recovered.","When to seek medical care":"Severe abdominal pain, confusion, or persistent high fever needs urgent care."}},{"title":"Dehydration","f":{"Meaning":"The body loses more fluid than it takes in.","Causes and risk factors":"Heat, exercise, diarrhea, vomiting, low water intake.","Symptoms to detect":"Thirst, dark urine, headache, dizziness, fatigue.","Prevention and precautions":"Drink regularly; increase fluids in heat; limit alcohol.","Natural support and how to use":"Water, coconut water, oral rehydration solution, water-rich fruits.","Exercise if needed":"Avoid intense exercise in extreme heat; hydrate before and after.","When to seek medical care":"Confusion, no urination, rapid heartbeat, or fainting is an emergency."}},{"title":"Heat Exhaustion","f":{"Meaning":"Overheating from heat exposure and fluid loss.","Causes and risk factors":"Hot weather, exertion, dehydration, alcohol.","Symptoms to detect":"Heavy sweating, weakness, headache, nausea, dizziness.","Prevention and precautions":"Rest in shade; hydrate; avoid alcohol in heat; acclimatize gradually.","Natural support and how to use":"Cool water, electrolytes, wet cloth on neck and wrists.","Exercise if needed":"Stop exercise immediately in heat; resume only after full recovery.","When to seek medical care":"Hot dry skin, confusion, fainting, or very high temperature is heatstroke—an emergency."}},{"title":"Chronic Fatigue","f":{"Meaning":"Long-lasting tiredness not relieved by normal rest.","Causes and risk factors":"Poor sleep, stress, anemia, thyroid issues, diabetes, depression, inactivity.","Symptoms to detect":"Low energy, brain fog, weakness, poor motivation.","Prevention and precautions":"Sleep, nutrition, gradual activity, medical screening for causes.","Natural support and how to use":"Balanced meals, iron-rich foods if deficient, hydration, B vitamins from whole foods.","Exercise if needed":"Start with 10-minute walks and build gradually; strength train lightly.","When to seek medical care":"Sudden severe fatigue, chest pain, or unexplained weight loss needs evaluation."}},{"title":"Overtraining Syndrome","f":{"Meaning":"Excessive exercise without enough recovery breaks down performance and health.","Causes and risk factors":"Too much intensity, insufficient sleep, under-eating, stress.","Symptoms to detect":"Persistent soreness, poor sleep, declining performance, irritability.","Prevention and precautions":"Schedule rest days; eat enough; sleep 7–9 hours; monitor progress.","Natural support and how to use":"Protein, complex carbs, fruits, vegetables, water; tart cherry or ginger for recovery.","Exercise if needed":"Reduce training volume; prioritize mobility, walking, and sleep.","When to seek medical care":"Chest pain, fainting, or abnormal heartbeat during exercise needs urgent care."}},{"title":"Gym and Sports Injuries","f":{"Meaning":"Strains, sprains, or joint injuries during exercise.","Causes and risk factors":"Poor warm-up, bad form, excessive load, fatigue, old injuries.","Symptoms to detect":"Pain, swelling, bruising, reduced movement, weakness.","Prevention and precautions":"Warm up; learn form; progress gradually; use proper equipment.","Natural support and how to use":"RICE in first 48 hours: rest, ice, compression, elevation; protein and vitamin-C-rich foods for repair.","Exercise if needed":"Rehabilitation exercises after acute pain settles; avoid training through sharp pain.","When to seek medical care":"Deformity, inability to bear weight, numbness, or severe swelling needs urgent care."}},{"title":"Poor Posture","f":{"Meaning":"Misalignment from prolonged sitting, phone use, or weak muscles.","Causes and risk factors":"Desk work, phone use, weak core, stress, poor workstation setup.","Symptoms to detect":"Rounded shoulders, neck pain, back pain, headaches.","Prevention and precautions":"Set up an ergonomic desk; take movement breaks; strengthen back and core.","Natural support and how to use":"Magnesium-rich foods, hydration, heat for tight muscles.","Exercise if needed":"Wall angels, rows, chin tucks, planks, hip-flexor stretches.","When to seek medical care":"Numbness, weakness, or pain radiating down limbs needs assessment."}},{"title":"Loneliness and Social Isolation","f":{"Meaning":"Lack of meaningful connection that affects mental and physical health.","Causes and risk factors":"Work pressure, relocation, divorce, social anxiety, digital substitution.","Symptoms to detect":"Sadness, low motivation, poor sleep, unhealthy habits.","Prevention and precautions":"Schedule real contact; join groups; volunteer; reduce passive scrolling.","Natural support and how to use":"Regular meals, sunlight, omega-3 foods, and sleep hygiene.","Exercise if needed":"Group sports, walking clubs, gym classes, or team activities.","When to seek medical care":"Persistent hopelessness or thoughts of self-harm need immediate support."}},{"title":"Preventive Checkups and Cancer Screening","f":{"Meaning":"Regular screening detects disease early before symptoms appear.","Causes and risk factors":"Skipping checkups, fear, busy schedules, lack of awareness.","Symptoms to detect":"Often none—this is why screening matters.","Prevention and precautions":"BP, sugar, cholesterol, weight, dental, eye, prostate discussion, and colon screening as advised.","Natural support and how to use":"Balanced diet, exercise, sleep, no smoking, limited alcohol.","Exercise if needed":"At least 150 minutes weekly moderate activity plus strength training twice weekly.","When to seek medical care":"Do not wait for symptoms; early detection saves lives."}}],"women":[{"title":"Menstrual Cramps","f":{"Meaning":"Painful contractions of the uterus before or during periods.","Causes and risk factors":"Prostaglandins, endometriosis, fibroids, stress, poor sleep.","Symptoms to detect":"Lower-belly cramps, back pain, nausea, headache, diarrhea.","Prevention and precautions":"Heat, hydration, regular exercise, reduce caffeine and salty food before periods.","Natural support and how to use":"Warm compress on the lower belly 15–20 minutes; ginger or chamomile tea; magnesium-rich foods like bananas, nuts, and greens.","Exercise if needed":"Walking, gentle yoga, cat-cow, and pelvic stretches; reduce intense training on heavy days.","When to seek medical care":"Severe pain that stops normal activity, fainting, or pain worse than usual needs medical review."}},{"title":"Irregular Periods","f":{"Meaning":"Menstrual cycles that come too early, too late, or unpredictably.","Causes and risk factors":"Stress, PCOS, thyroid issues, weight changes, breastfeeding, perimenopause.","Symptoms to detect":"Missed periods, unpredictable bleeding, acne, hair changes.","Prevention and precautions":"Regular sleep, balanced meals, stress management, healthy weight.","Natural support and how to use":"Balanced meals with protein and fiber; spearmint tea may help some women with hormonal acne; avoid extreme dieting.","Exercise if needed":"Moderate walking, strength training, and yoga; avoid overtraining.","When to seek medical care":"Missed periods for 3 months, very heavy bleeding, or pregnancy possibility needs assessment."}},{"title":"Heavy Menstrual Bleeding","f":{"Meaning":"Period bleeding that is unusually heavy or lasts too long.","Causes and risk factors":"Fibroids, hormonal imbalance, thyroid problems, clotting disorders, polyps.","Symptoms to detect":"Soaking pads hourly, clots, fatigue, pale skin, periods over 7 days.","Prevention and precautions":"Track cycles; eat iron-rich foods; seek evaluation for repeated heavy bleeding.","Natural support and how to use":"Iron-rich beans, liver, spinach, pumpkin seeds with vitamin-C fruits; hydration and rest.","Exercise if needed":"Light walking; avoid intense exercise during heavy bleeding if dizzy or weak.","When to seek medical care":"Drenching pads hourly, fainting, chest pain, or severe weakness is urgent."}},{"title":"PMS","f":{"Meaning":"Physical and emotional symptoms before menstruation.","Causes and risk factors":"Hormonal changes, stress, poor sleep, high salt or sugar, caffeine.","Symptoms to detect":"Bloating, mood swings, breast tenderness, cravings, fatigue, acne.","Prevention and precautions":"Regular sleep, balanced meals, exercise, reduce salt, caffeine, and alcohol before periods.","Natural support and how to use":"Ginger tea for cramps; chamomile for mood and sleep; calcium, magnesium, and vitamin-B6-rich foods.","Exercise if needed":"Walking, yoga, swimming, and light strength training.","When to seek medical care":"Symptoms that disrupt work, relationships, or daily life may indicate PMDD and need care."}},{"title":"PCOS","f":{"Meaning":"A hormonal condition with irregular ovulation, high androgens, and metabolic issues.","Causes and risk factors":"Insulin resistance, genetics, weight gain, inflammation.","Symptoms to detect":"Irregular periods, acne, excess facial/body hair, weight gain, difficulty conceiving.","Prevention and precautions":"Balanced low-glycemic meals, strength training, weight management, sleep.","Natural support and how to use":"Cinnamon in oats or tea; fenugreek-soaked water; apple-cider vinegar before high-carb meals; protein and fiber at meals.","Exercise if needed":"Strength training 2–3 times weekly plus walking; avoid excessive cardio without recovery.","When to seek medical care":"Missed periods, pregnancy difficulty, or new excess hair growth needs clinical evaluation."}},{"title":"Endometriosis","f":{"Meaning":"Tissue similar to the womb lining grows outside the uterus, causing pain.","Causes and risk factors":"Genetics, retrograde menstruation, immune factors, inflammation.","Symptoms to detect":"Painful periods, pain during sex, chronic pelvic pain, heavy bleeding, fertility issues.","Prevention and precautions":"Track symptoms; anti-inflammatory diet; early diagnosis and treatment.","Natural support and how to use":"Ginger and turmeric in food; omega-3 fish; vegetables and berries; heat therapy for cramps.","Exercise if needed":"Gentle yoga, walking, pelvic-floor relaxation; avoid painful high-impact exercise during flares.","When to seek medical care":"Severe pain, fainting, or fertility concerns require a gynecologist."}},{"title":"Uterine Fibroids","f":{"Meaning":"Non-cancerous growths in or around the uterus.","Causes and risk factors":"Hormones, genetics, age, obesity, family history.","Symptoms to detect":"Heavy periods, pelvic pressure, frequent urination, back pain, fertility issues.","Prevention and precautions":"Maintain healthy weight; eat vegetables and fiber; limit processed meat and alcohol.","Natural support and how to use":"Green vegetables, citrus fruit
